<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stickman Fury</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #f0ece2;
    --accent: #ff6b35;
    --accent2: #fbbf24;
    --danger: #ef4444;
    --success: #22c55e;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    image-rendering: auto;
    border-radius: 4px;
  }
  .overlay {
    position: fixed; inset:0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 10;
    transition: opacity 0.4s;
    pointer-events: auto;
  }
  .overlay.hidden { opacity:0; pointer-events:none; }
  .overlay-bg {
    position: absolute; inset:0;
    background: rgba(5,5,10,0.92);
    backdrop-filter: blur(8px);
  }
  .overlay-content {
    position: relative; z-index:2;
    text-align: center;
    padding: 20px;
  }
  .game-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 10vw, 96px);
    color: var(--accent);
    letter-spacing: 6px;
    line-height: 1;
    text-shadow: 0 0 40px rgba(255,107,53,0.4), 0 4px 0 #c2410c;
  }
  .game-subtitle {
    font-size: clamp(14px, 3vw, 18px);
    color: rgba(240,236,226,0.5);
    margin-top: 8px;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 36px;
    border: 2px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 28px;
    border-radius: 4px;
  }
  .btn:hover, .btn:active {
    background: var(--accent);
    color: #0a0a0f;
    transform: scale(1.05);
  }
  .btn-sm {
    padding: 10px 24px;
    font-size: 18px;
    margin-top: 16px;
  }
  .level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 32px;
    max-width: 500px;
  }
  .level-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 12px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .level-card:hover:not(.locked) {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(255,107,53,0.15);
  }
  .level-card.locked {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .level-card .lnum {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--accent);
  }
  .level-card .lname {
    font-size: 13px;
    margin-top: 4px;
    font-weight: 500;
  }
  .level-card .ldiff {
    font-size: 11px;
    color: rgba(240,236,226,0.4);
    margin-top: 6px;
  }
  .stat-row {
    display: flex; gap: 32px; justify-content: center; margin-top: 24px;
  }
  .stat-item { text-align: center; }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--accent2);
  }
  .stat-label {
    font-size: 12px;
    color: rgba(240,236,226,0.4);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .controls-info {
    margin-top: 24px;
    font-size: 12px;
    color: rgba(240,236,226,0.35);
    line-height: 1.8;
  }
  .controls-info kbd {
    background: rgba(255,255,255,0.1);
    padding: 2px 8px;
    border-radius: 3px;
    font-family: 'Outfit', sans-serif;
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* Kontrol Mobile */
  #mobileControls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 140px;
    z-index: 5;
    pointer-events: none;
    display: none;
  }
  #mobileControls.active { display: block; }
  .m-btn {
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .m-btn:active, .m-btn.pressed {
    background: rgba(255,107,53,0.35);
    border-color: var(--accent);
    color: var(--accent);
  }
  .m-btn-atk { border-color: rgba(239,68,68,0.4); }
  .m-btn-atk:active, .m-btn-atk.pressed { background: rgba(239,68,68,0.3); border-color: var(--danger); color: var(--danger); }
  .m-btn-jump { border-color: rgba(34,197,94,0.4); }
  .m-btn-jump:active, .m-btn-jump.pressed { background: rgba(34,197,94,0.3); border-color: var(--success); color: var(--success); }
  .m-btn-dodge { border-color: rgba(251,191,36,0.4); }
  .m-btn-dodge:active, .m-btn-dodge.pressed { background: rgba(251,191,36,0.3); border-color: var(--accent2); color: var(--accent2); }

  @media (max-width: 768px) {
    .level-grid { grid-template-columns: 1fr; max-width: 260px; }
    .stat-row { gap: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- Menu Utama -->
<div id="menuOverlay" class="overlay">
  <div class="overlay-bg"></div>
  <div class="overlay-content">
    <div class="game-title">STICKMAN FURY</div>
    <div class="game-subtitle">Pertarungan Epik</div>
    <button class="btn" onclick="showLevelSelect()">MULAI BERMAIN</button>
    <div class="controls-info">
      <kbd>A</kbd><kbd>D</kbd> Bergerak &nbsp; <kbd>W</kbd>/<kbd>Spasi</kbd> Lompat &nbsp; <kbd>J</kbd> Serang &nbsp; <kbd>K</kbd> Menghindar
    </div>
  </div>
</div>

<!-- Pilih Level -->
<div id="levelOverlay" class="overlay hidden">
  <div class="overlay-bg"></div>
  <div class="overlay-content">
    <div style="font-family:'Bebas Neue';font-size:32px;letter-spacing:3px;color:var(--fg)">PILIH LEVEL</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="btn btn-sm" onclick="showMenu()">KEMBALI</button>
  </div>
</div>

<!-- Level Selesai -->
<div id="winOverlay" class="overlay hidden">
  <div class="overlay-bg"></div>
  <div class="overlay-content">
    <div style="font-family:'Bebas Neue';font-size:42px;letter-spacing:3px;color:var(--success)">LEVEL SELESAI</div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-val" id="winScore">0</div><div class="stat-label">Skor</div></div>
      <div class="stat-item"><div class="stat-val" id="winCoins">0</div><div class="stat-label">Koin</div></div>
    </div>
    <button class="btn btn-sm" id="winNextBtn" onclick="nextLevel()">LEVEL BERIKUTNYA</button>
    <button class="btn btn-sm" onclick="showLevelSelect()" style="border-color:var(--border);color:var(--fg)">PILIH LEVEL</button>
  </div>
</div>

<!-- Game Over -->
<div id="overOverlay" class="overlay hidden">
  <div class="overlay-bg"></div>
  <div class="overlay-content">
    <div style="font-family:'Bebas Neue';font-size:48px;letter-spacing:3px;color:var(--danger)">KALAH</div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-val" id="overScore">0</div><div class="stat-label">Skor</div></div>
      <div class="stat-item"><div class="stat-val" id="overWave">0</div><div class="stat-label">Gelombang</div></div>
    </div>
    <button class="btn btn-sm" onclick="retryLevel()">COBA LAGI</button>
    <button class="btn btn-sm" onclick="showLevelSelect()" style="border-color:var(--border);color:var(--fg)">PILIH LEVEL</button>
  </div>
</div>

<!-- Kontrol Mobile -->
<div id="mobileControls">
  <div class="m-btn" id="mbLeft" style="left:16px;bottom:40px;"><i class="fas fa-chevron-left"></i></div>
  <div class="m-btn" id="mbRight" style="left:84px;bottom:40px;"><i class="fas fa-chevron-right"></i></div>
  <div class="m-btn m-btn-jump" id="mbJump" style="right:84px;bottom:40px;"><i class="fas fa-arrow-up"></i></div>
  <div class="m-btn m-btn-atk" id="mbAtk" style="right:16px;bottom:88px;"><i class="fas fa-fist-raised"></i></div>
  <div class="m-btn m-btn-dodge" id="mbDodge" style="right:16px;bottom:24px;"><i class="fas fa-wind"></i></div>
</div>

<script>
// ============================================================
// KONSTANTA GAME
// ============================================================
const GW = 960, GH = 540;
const GRAVITY = 1800;
const GROUND_Y = GH - 70;
const PLAYER_SPEED = 300;
const JUMP_FORCE = -620;
const DODGE_SPEED = 520;
const DODGE_DUR = 0.22;
const DODGE_CD = 0.55;
const ATK_DUR = [0.22, 0.2, 0.32];
const ATK_DMG = [18, 18, 35];
const ATK_RANGE = [48, 48, 58];
const COMBO_WINDOW = 0.38;
const HIT_STOP = 0.045;
const INVINCE_DUR = 0.7;
const KNOCKBACK = [120, 100, 250];

// ============================================================
// LEVEL DATA
// ============================================================
const LEVELS = [
  {
    name:"Kota Reruntuhan", bg:'#0d1117', gnd:'#161d2e', accent:'#ff6b35',
    waves:[
      {e:[{t:'basic',n:2}]},
      {e:[{t:'basic',n:3}]},
      {e:[{t:'basic',n:2},{t:'fast',n:1}]},
      {e:[{t:'basic',n:2},{t:'fast',n:2}]},
      {e:[{t:'fast',n:3}]}
    ],
    boss:{name:'Shadow Knight',hp:220,dmg:18,spd:140,color:'#a855f7',scale:1.4}
  },
  {
    name:"Hutan Gelap", bg:'#070f07', gnd:'#0c1f10', accent:'#06d6a0',
    waves:[
      {e:[{t:'basic',n:3}]},
      {e:[{t:'fast',n:3}]},
      {e:[{t:'basic',n:2},{t:'tank',n:1}]},
      {e:[{t:'fast',n:4}]},
      {e:[{t:'tank',n:2}]},
      {e:[{t:'basic',n:2},{t:'fast',n:2},{t:'tank',n:1}]},
      {e:[{t:'fast',n:3},{t:'tank',n:1}]}
    ],
    boss:{name:'Dual Blade',hp:380,dmg:24,spd:160,color:'#06b6d4',scale:1.45}
  },
  {
    name:"Gunung Api", bg:'#140808', gnd:'#261010', accent:'#ef4444',
    waves:[
      {e:[{t:'fast',n:4}]},
      {e:[{t:'tank',n:2},{t:'fast',n:2}]},
      {e:[{t:'basic',n:3},{t:'tank',n:2}]},
      {e:[{t:'fast',n:5}]},
      {e:[{t:'tank',n:3}]},
      {e:[{t:'fast',n:4},{t:'tank',n:2}]},
      {e:[{t:'basic',n:4},{t:'fast',n:3},{t:'tank',n:2}]},
      {e:[{t:'tank',n:4}]},
      {e:[{t:'fast',n:5},{t:'tank',n:3}]}
    ],
    boss:{name:'Demon Lord',hp:550,dmg:30,spd:135,color:'#f59e0b',scale:1.55}
  }
];

// ============================================================
// AUDIO (Procedural Web Audio API)
// ============================================================
let actx = null;
function initAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }

function sfx(type){
  if(!actx) return;
  const t = actx.currentTime;
  try {
    if(type==='hit'){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(60,t+0.09);
      g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.1);
      // noise layer
      const buf=actx.createBuffer(1,actx.sampleRate*0.06,actx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.3;
      const n=actx.createBufferSource(),ng=actx.createGain();
      n.buffer=buf; ng.gain.setValueAtTime(0.2,t); ng.gain.exponentialRampToValueAtTime(0.001,t+0.06);
      n.connect(ng).connect(actx.destination); n.start(t);
    } else if(type==='swing'){
      const buf=actx.createBuffer(1,actx.sampleRate*0.08,actx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
      const n=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();
      n.buffer=buf; f.type='bandpass'; f.frequency.setValueAtTime(2000,t); f.Q.value=1;
      g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      n.connect(f).connect(g).connect(actx.destination); n.start(t);
    } else if(type==='jump'){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(280,t); o.frequency.exponentialRampToValueAtTime(560,t+0.12);
      g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.13);
    } else if(type==='coin'){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1320,t+0.06);
      g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.16);
    } else if(type==='hurt'){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='square'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(80,t+0.15);
      g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.16);
    } else if(type==='die'){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(30,t+0.5);
      g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.5);
    } else if(type==='dodge'){
      const buf=actx.createBuffer(1,actx.sampleRate*0.1,actx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.15;
      const n=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();
      n.buffer=buf; f.type='highpass'; f.frequency.value=3000;
      g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      n.connect(f).connect(g).connect(actx.destination); n.start(t);
    } else if(type==='boss'){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(60,t); o.frequency.setValueAtTime(80,t+0.2); o.frequency.setValueAtTime(50,t+0.4);
      g.gain.setValueAtTime(0.18,t); g.gain.setValueAtTime(0.18,t+0.35); g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.6);
    }
  } catch(e){}
}

// ============================================================
// CANVAS & SCALING
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let scaleFactor = 1;

function resize(){
  const sw = window.innerWidth, sh = window.innerHeight;
  scaleFactor = Math.min(sw/GW, sh/GH);
  canvas.width = GW; canvas.height = GH;
  canvas.style.width = (GW*scaleFactor)+'px';
  canvas.style.height = (GH*scaleFactor)+'px';
}
window.addEventListener('resize', resize);
resize();

function isMobile(){ return 'ontouchstart' in window || navigator.maxTouchPoints > 0; }

// ============================================================
// PARTIKEL
// ============================================================
let particles = [];
function spawnP(x,y,color,count,spd,life,sz){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:life*(0.5+Math.random()*0.5),maxLife:life,color,size:sz||(1.5+Math.random()*3)});
  }
}
function updateP(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=600*dt; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawP(c){
  for(const p of particles){
    const a=Math.max(0,p.life/p.maxLife);
    c.globalAlpha=a; c.fillStyle=p.color;
    const s=p.size*a;
    c.fillRect(p.x-s/2,p.y-s/2,s,s);
  }
  c.globalAlpha=1;
}

// ============================================================
// NOMOR KERUSAKAN
// ============================================================
let dmgNums = [];
function spawnDmg(x,y,val,color){
  dmgNums.push({x:x+(Math.random()-0.5)*20, y, val:Math.round(val), color:color||'#fbbf24', life:0.8, maxLife:0.8});
}
function updateDmg(dt){
  for(let i=dmgNums.length-1;i>=0;i--){
    const d=dmgNums[i]; d.y-=60*dt; d.life-=dt;
    if(d.life<=0) dmgNums.splice(i,1);
  }
}
function drawDmg(c){
  c.font='bold 18px "Bebas Neue",sans-serif'; c.textAlign='center';
  for(const d of dmgNums){
    const a=Math.max(0,d.life/d.maxLife);
    c.globalAlpha=a; c.fillStyle=d.color;
    c.fillText('-'+d.val, d.x, d.y);
  }
  c.globalAlpha=1;
}

// ============================================================
// POSE STICKMAN
// ============================================================
function getPose(state, t, combo){
  const br = Math.sin(t*3)*0.03;
  const idle = {lT:-0.08+br,lS:0.04,rT:0.08-br,rS:-0.04,lUA:0.35+br,lLA:-0.25,rUA:-0.35-br,rLA:0.25,lean:br*0.4};
  switch(state){
    case 'idle': return idle;
    case 'run': {
      const c=Math.sin(t*12);
      return {lT:c*0.65,lS:Math.max(0,-c)*0.9+0.08,rT:-c*0.65,rS:Math.max(0,c)*0.9+0.08,
        lUA:-c*0.55,lLA:-0.35-Math.abs(c)*0.25,rUA:c*0.55,rLA:0.35+Math.abs(c)*0.25,lean:0.12};
    }
    case 'jump': return {lT:-0.35,lS:0.7,rT:0.25,rS:0.5,lUA:-1.1,lLA:-0.2,rUA:1.1,rLA:0.2,lean:0};
    case 'fall': return {lT:-0.2,lS:0.3,rT:0.15,rS:0.2,lUA:-0.8,lLA:-0.1,rUA:0.8,rLA:0.1,lean:0.05};
    case 'attack': {
      const p=t;
      if(combo===0){
        const sw=p<0.25?p/0.25:1-(p-0.25)/0.75;
        return {lT:-0.12,lS:0.05,rT:0.15,rS:0,lUA:0.3,lLA:-0.4,rUA:-1.5*sw,rLA:-0.15*sw,lean:-0.18*sw};
      } else if(combo===1){
        const sw=p<0.25?p/0.25:1-(p-0.25)/0.75;
        return {lT:-0.12,lS:0.05,rT:0.15,rS:0,lUA:1.5*sw,lLA:0.15*sw,rUA:0.3,rLA:0.4,lean:0.18*sw};
      } else {
        const sw=p<0.2?p/0.2:1-(p-0.2)/0.8;
        return {lT:-0.1,lS:0.08,rT:-1.3*sw,rS:0.15*sw,lUA:0.4,lLA:-0.3,rUA:-0.4,rLA:0.3,lean:-0.25*sw};
      }
    }
    case 'hurt': {
      const p=Math.min(1,t*4);
      return {lT:0.08,lS:0.08,rT:-0.08,rS:0.08,lUA:0.7*p,lLA:-0.2,rUA:-0.7*p,rLA:0.2,lean:0.25*p};
    }
    case 'dodge': {
      const p=t;
      return {lT:-1.0+p*2,lS:1.2-p*2.4,rT:-1.0+p*2,rS:1.2-p*2.4,
        lUA:-1.3+p*2.6,lLA:-0.8+p*1.6,rUA:1.3-p*2.6,rLA:0.8-p*1.6,lean:-0.4+p*0.8};
    }
    default: return idle;
  }
}

// Gambar stickman
function drawStick(c, x, y, dir, state, time, combo, color, scale, flash, glowColor){
  const s = scale||1;
  const pose = getPose(state, time, combo||0);
  c.save();
  c.translate(x, y);
  c.scale(dir*s, s);

  const hR=8, tL=22, uA=13, lA=11, uL=15, lL=14;
  const lean=pose.lean||0;
  const sx=Math.sin(lean)*tL, sy=-tL*Math.cos(lean);
  const headY=sy-11;

  // Glow untuk boss
  if(glowColor){
    c.shadowColor=glowColor; c.shadowBlur=18;
  }

  const col = flash ? '#ffffff' : color;
  c.strokeStyle=col; c.lineWidth=3; c.lineCap='round'; c.lineJoin='round';

  // Kaki
  limb(c,0,0,pose.lT,uL,pose.lS,lL);
  limb(c,0,0,pose.rT,uL,pose.rS,lL);
  // Badan
  c.beginPath(); c.moveTo(0,0); c.lineTo(sx,sy); c.stroke();
  // Lengan
  limb(c,sx,sy,pose.lUA,uA,pose.lLA,lA);
  limb(c,sx,sy,pose.rUA,uA,pose.rLA,lA);
  // Kepala
  c.beginPath(); c.arc(sx,headY,hR,0,Math.PI*2); c.stroke();
  // Mata
  if(!flash){
    c.fillStyle=col; c.beginPath(); c.arc(sx+3,headY-1,1.5,0,Math.PI*2); c.fill();
  }

  c.shadowColor='transparent'; c.shadowBlur=0;
  c.restore();
}

function limb(c,x,y,a1,l1,a2,l2){
  const mx=x+Math.sin(a1)*l1, my=y+Math.cos(a1)*l1;
  const ex=mx+Math.sin(a1+a2)*l2, ey=my+Math.cos(a1+a2)*l2;
  c.beginPath(); c.moveTo(x,y); c.lineTo(mx,my); c.lineTo(ex,ey); c.stroke();
  return {x:ex,y:ey};
}

// Posisi ujung serangan
function getAtkPoint(x,y,dir,combo,scale){
  const s=scale||1;
  const tL=22, uA=13*s, lA=11*s;
  const lean=combo===2?-0.25:combo===1?0.18:-0.18;
  const sx=Math.sin(lean)*tL*s, sy=-tL*s*Math.cos(lean);
  let a1,a2;
  if(combo===0){ a1=-1.5; a2=-0.15; }
  else if(combo===1){ a1=1.5; a2=0.15; }
  else { a1=-1.3; a2=0.15; }
  const mx=dir*sx+Math.sin(a1)*uA*dir, my=sy+Math.cos(a1)*uA;
  return {x:mx+Math.sin(a1+a2)*lA*dir, y:my+Math.cos(a1+a2)*lA};
}

const keys = {};
window.addEventListener('keydown', e=>{ keys[e.code]=true; e.preventDefault(); });
window.addEventListener('keyup', e=>{ keys[e.code]=false; });

// Tombol mobile
const mKeys = {left:false,right:false,jump:false,atk:false,dodge:false};
function setupMobile(){
  if(!isMobile()) return;
  document.getElementById('mobileControls').classList.add('active');
  const map = {mbLeft:'left',mbRight:'right',mbJump:'jump',mbAtk:'atk',mbDodge:'dodge'};
  for(const [id,key] of Object.entries(map)){
    const el=document.getElementById(id);
    const on=()=>{ mKeys[key]=true; el.classList.add('pressed'); };
    const off=()=>{ mKeys[key]=false; el.classList.remove('pressed'); };
    el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();off();},{passive:false});
    el.addEventListener('touchcancel',e=>{off();});
  }
}

function inpLeft(){ return keys['KeyA']||keys['ArrowLeft']||mKeys.left; }
function inpRight(){ return keys['KeyD']||keys['ArrowRight']||mKeys.right; }
function inpJump(){ return keys['KeyW']||keys['ArrowUp']||keys['Space']||mKeys.jump; }
function inpAtk(){ return keys['KeyJ']||keys['KeyZ']||mKeys.atk; }
function inpDodge(){ return keys['KeyK']||keys['KeyX']||mKeys.dodge; }

// Debounce untuk jump dan attack
let prevJump=false, prevAtk=false, prevDodge=false;
function tapJump(){ const v=inpJump(); const r=v&&!prevJump; prevJump=v; return r; }
function tapAtk(){ const v=inpAtk(); const r=v&&!prevAtk; prevAtk=v; return r; }
function tapDodge(){ const v=inpDodge(); const r=v&&!prevDodge; prevDodge=v; return r; }

function updatePickups(dt){

// PEMAIN
// ============================================================
let player;
function createPlayer(){
  return {
    x:GW/2, y:GROUND_Y, vx:0, vy:0, dir:1,
    hp:100, maxHp:100,
    state:'idle', stateT:0, combo:0, comboTimer:0,
    invTimer:0, dodgeCd:0, grounded:true,
    score:0, coinCount:0,
    flashTimer:0, dead:false, afterimages:[]
  };
}

function updatePlayer(dt){
  const p=player;
  if(p.dead) return;
  p.stateT+=dt;
  if(p.invTimer>0) p.invTimer-=dt;
  if(p.dodgeCd>0) p.dodgeCd-=dt;
  if(p.flashTimer>0) p.flashTimer-=dt;
  if(p.comboTimer>0){ p.comboTimer-=dt; if(p.comboTimer<=0) p.combo=0; }

  // Afterimages
  for(let i=p.afterimages.length-1;i>=0;i--){
    p.afterimages[i].life-=dt;
    if(p.afterimages[i].life<=0) p.afterimages.splice(i,1);
  }

  // Dodge
  if(p.state==='dodge'){
    p.x+=p.vx*dt;
    p.x=Math.max(30,Math.min(GW-30,p.x));
    if(p.stateT>=DODGE_DUR){
      p.state='idle'; p.stateT=0;
    }
    return;
  }

  // Attack
  if(p.state==='attack'){
    if(p.stateT>=ATK_DUR[p.combo]){
      p.state='idle'; p.stateT=0;
    }
    return;
  }

  // Hurt
  if(p.state==='hurt'){
    p.x+=p.vx*dt;
    p.x=Math.max(30,Math.min(GW-30,p.x));
    if(p.stateT>=0.3){ p.state='idle'; p.stateT=0; }
    return;
  }

  // Movement
  let mx=0;
  if(inpLeft()) mx=-1;
  if(inpRight()) mx=1;
  p.vx=mx*PLAYER_SPEED;
  if(mx!==0) p.dir=mx;

  if(mx!==0 && p.grounded) p.state='run';
  else if(!p.grounded) p.state=p.vy<0?'jump':'fall';
  else p.state='idle';

  p.x+=p.vx*dt;
  p.x=Math.max(30,Math.min(GW-30,p.x));

  // Jump
  if(tapJump() && p.grounded){
    p.vy=JUMP_FORCE; p.grounded=false; p.state='jump'; p.stateT=0;
    sfx('jump');
  }

  // Attack
  if(tapAtk()){
    const useCombo = p.comboTimer>0 && p.combo<2 ? p.combo+1 : 0;
    p.state='attack'; p.stateT=0; p.combo=useCombo; p.comboTimer=COMBO_WINDOW;
    sfx('swing');
    // Cek hit
    checkPlayerAttack();
  }

  // Dodge
  if(tapDodge() && p.dodgeCd<=0){
    p.state='dodge'; p.stateT=0; p.dodgeCd=DODGE_CD;
    p.vx=(p.dir)*(DODGE_SPEED);
    p.invTimer=DODGE_DUR;
    sfx('dodge');
    p.afterimages.push({x:p.x,y:p.y,dir:p.dir,state:p.state,stateT:0,combo:0,life:0.15,maxLife:0.15});
  }

  // Gravity
  if(!p.grounded){
    p.vy+=GRAVITY*dt;
    p.y+=p.vy*dt;
    if(p.y>=GROUND_Y){ p.y=GROUND_Y; p.vy=0; p.grounded=true; }
  }
}

function checkPlayerAttack(){
  const p=player;
  const ap=getAtkPoint(p.x,p.y,p.dir,p.combo,1);
  const range=ATK_RANGE[p.combo];
  const hitX=p.x+p.dir*30;

  for(const e of enemies){
    if(e.hp<=0) continue;
    const dx=hitX-e.x, dy=ap.y-(e.y-20);
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<range+(e.scale?e.scale*10:10)){
      // Hit!
      const dmg=ATK_DMG[p.combo]+(Math.random()*4-2);
      e.hp-=dmg;
      e.state='hurt'; e.stateT=0;
      e.vx=p.dir*KNOCKBACK[p.combo]*(e.isBoss?0.3:1);
      e.vy=-100;
      e.flashTimer=0.1;
      spawnDmg(e.x, e.y-40, dmg, p.combo===2?'#ef4444':'#fbbf24');
      spawnP(hitX, ap.y, p.combo===2?'#ef4444':'#ff6b35', p.combo===2?12:6, 200, 0.3, null);
      sfx('hit');
      p.score+=Math.round(dmg*(1+p.combo*0.5));
      hitStopTimer=HIT_STOP;
      shakeTimer=0.1; shakeIntensity=p.combo===2?6:3;

      if(e.hp<=0){
        e.dead=true; e.deathT=0;
        sfx('die');
        spawnP(e.x,e.y-20,e.color||'#ef4444',20,300,0.5,null);
        // Drop koin
        const nc= e.isBoss?8:(e.type==='tank'?4:2);
        for(let i=0;i<nc;i++) spawnCoin(e.x+(Math.random()-0.5)*30, e.y-20);
        spawnPickup(e.x, e.y-20);
        p.score+= e.isBoss?500:(e.type==='tank'?200:100);
      }
    }
  }
}

function hurtPlayer(dmg, fromX){
  const p=player;
  if(p.invTimer>0 || p.dead) return;
  p.hp-=dmg;
  p.state='hurt'; p.stateT=0;
  p.invTimer=INVINCE_DUR;
  p.vx=(p.x>fromX?1:-1)*180;
  p.flashTimer=0.15;
  spawnDmg(p.x, p.y-40, dmg, '#ef4444');
  spawnP(p.x, p.y-20, '#ef4444', 8, 150, 0.3, null);
  sfx('hurt');
  shakeTimer=0.12; shakeIntensity=5;
  if(p.hp<=0){ p.hp=0; p.dead=true; sfx('die'); spawnP(p.x,p.y-20,'#ff6b35',30,350,0.6,null); }
}

function drawPlayer(c){
  const p=player;
  if(p.dead) return;
  // Afterimages
  for(const ai of p.afterimages){
    c.globalAlpha=ai.life/ai.maxLife*0.3;
    drawStick(c, ai.x, ai.y, ai.dir, ai.state, ai.stateT, ai.combo, '#ff6b35', 1, false, null);
  }
  c.globalAlpha=1;
  // Invincibility flash
  if(p.invTimer>0 && !p.flashTimer && Math.floor(p.invTimer*15)%2===0) return;
  drawStick(c, p.x, p.y, p.dir, p.state, p.stateT, p.combo, '#ff6b35', 1, p.flashTimer>0, null);
  // Attack trail
  if(p.state==='attack'){
    const ap=getAtkPoint(p.x,p.y,p.dir,p.combo,1);
    const prog=p.stateT/ATK_DUR[p.combo];
    if(prog>0.15 && prog<0.5){
      c.globalAlpha=0.4*(1-prog);
      c.strokeStyle=p.combo===2?'#ef4444':'#ff6b35';
      c.lineWidth=2;
      c.beginPath();
      c.arc(p.x+p.dir*30, p.y-25, ATK_RANGE[p.combo]*prog, p.dir>0?-0.8:Math.PI-0.8, p.dir>0?0.8:Math.PI+0.8);
      c.stroke();
      c.globalAlpha=1;
    }
  }
}

let enemies = [];
const ENEMY_DEFS = {
  basic: {hp:50, dmg:10, spd:90, color:'#dc2626', scale:1, atkRange:40, atkCd:1.2, atkDur:0.5},
  fast:  {hp:35, dmg:8,  spd:180, color:'#06b6d4', scale:0.9, atkRange:38, atkCd:0.7, atkDur:0.35},
  tank:  {hp:120,dmg:20, spd:55,  color:'#991b1b', scale:1.25, atkRange:50, atkCd:1.8, atkDur:0.7}
};

function spawnEnemy(type, x){
  const d=ENEMY_DEFS[type];
  enemies.push({
    type, x, y:GROUND_Y, vx:0, vy:0, dir:-1,
    hp:d.hp, maxHp:d.hp, dmg:d.dmg, spd:d.spd, color:d.color, scale:d.scale,
    atkRange:d.atkRange, atkCd:d.atkCd, atkDur:d.atkDur,
    state:'idle', stateT:0, atkTimer:Math.random()*0.5+0.5,
    flashTimer:0, dead:false, deathT:0, isBoss:false,
    telegraphTimer:0
  });
}

function spawnBoss(lvl){
  const b=lvl.boss;
  enemies.push({
    type:'boss', x:GW-80, y:GROUND_Y, vx:0, vy:0, dir:-1,
    hp:b.hp, maxHp:b.hp, dmg:b.dmg, spd:b.spd, color:b.color, scale:b.scale,
    atkRange:60, atkCd:1.4, atkDur:0.45,
    state:'idle', stateT:0, atkTimer:1.5,
    flashTimer:0, dead:false, deathT:0, isBoss:true, bossName:b.name,
    telegraphTimer:0, pattern:0, patternTimer:0, enraged:false
  });
}

function updateEnemies(dt){
  const p=player;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){
      e.deathT+=dt;
      if(e.deathT>0.5) enemies.splice(i,1);
      continue;
    }
    e.stateT+=dt;
    if(e.flashTimer>0) e.flashTimer-=dt;

    // Gravity
    if(e.y<GROUND_Y){ e.vy+=GRAVITY*dt; e.y+=e.vy*dt; if(e.y>=GROUND_Y){e.y=GROUND_Y;e.vy=0;} }
    // Knockback
    if(Math.abs(e.vx)>10){ e.x+=e.vx*dt; e.vx*=0.9; }
    e.x=Math.max(20,Math.min(GW-20,e.x));

    if(e.state==='hurt'){
      if(e.stateT>=0.25){ e.state='idle'; e.stateT=0; }
      continue;
    }
    if(e.state==='attack'){
      // Cek hit di frame tengah
      if(e.stateT>=e.atkDur*0.4 && e.stateT<e.atkDur*0.5){
        const dx=p.x-e.x;
        if(Math.abs(dx)<e.atkRange+20 && Math.abs(p.y-e.y)<40){
          hurtPlayer(e.dmg+(e.isBoss?Math.random()*5:0), e.x);
        }
      }
      if(e.stateT>=e.atkDur){ e.state='idle'; e.stateT=0; }
      continue;
    }

    // AI
    const dx=p.x-e.x;
    const dist=Math.abs(dx);
    e.dir=dx>0?1:-1;

    // Telegraph
    if(e.telegraphTimer>0){
      e.telegraphTimer-=dt;
      if(e.telegraphTimer<=0){
        e.state='attack'; e.stateT=0;
      }
      continue;
    }

    e.atkTimer-=dt;
    if(dist<e.atkRange+15 && e.atkTimer<=0){
      // Mulai telegraph
      e.telegraphTimer=e.isBoss?0.35:0.3;
      e.atkTimer=e.atkCd*(e.enraged?0.6:1);
      // Boss pattern
      if(e.isBoss){
        e.pattern=(e.pattern+1)%3;
      }
      continue;
    }

    // Bergerak mendekati pemain
    if(dist>e.atkRange){
      e.x+=e.dir*e.spd*dt;
    } else if(dist<e.atkRange*0.5){
      e.x-=e.dir*e.spd*0.5*dt;
    }
    e.state=dist>e.atkRange*0.8?'run':'idle';
  }
}

function drawEnemies(c){
  for(const e of enemies){
    if(e.dead){
      c.globalAlpha=1-e.deathT/0.5;
      drawStick(c,e.x,e.y,e.dir,e.state,e.stateT,0,e.color,e.scale,false,e.isBoss?e.color:null);
      c.globalAlpha=1;
      continue;
    }
    // Telegraph glow
    if(e.telegraphTimer>0){
      const pulse=0.5+Math.sin(e.telegraphTimer*30)*0.5;
      c.fillStyle=e.isBoss?`rgba(245,158,11,${0.15*pulse})`:`rgba(239,68,68,${0.1*pulse})`;
      c.beginPath(); c.arc(e.x,e.y-20,30*e.scale,0,Math.PI*2); c.fill();
    }
    // Invincibility flash
    if(e.flashTimer>0){
      drawStick(c,e.x,e.y,e.dir,e.state,e.stateT,0,'#ffffff',e.scale,true,e.isBoss?e.color:null);
    } else {
      drawStick(c,e.x,e.y,e.dir,e.state,e.stateT,0,e.color,e.scale,false,e.isBoss?e.color:null);
    }
    // HP bar untuk tank/boss
    if(e.type==='tank' || e.isBoss){
      const bw=50*e.scale, bh=5;
      const bx=e.x-bw/2, by=e.y-55*e.scale;
      c.fillStyle='rgba(0,0,0,0.5)'; c.fillRect(bx-1,by-1,bw+2,bh+2);
      c.fillStyle='#ef4444'; c.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
    }
  }
}

let bgElements = [];
function genBg(levelIdx){
  bgElements=[];
  const lvl=LEVELS[levelIdx];
  // Bangunan/pohon tergantung level
  if(levelIdx===0){
    // Kota reruntuhan
    for(let i=0;i<12;i++){
      bgElements.push({x:i*90+Math.random()*40, h:60+Math.random()*120, w:30+Math.random()*50, layer:Math.random()<0.5?0:1, color:`rgba(${20+Math.random()*15},${25+Math.random()*15},${40+Math.random()*20},0.6)`});
    }
  } else if(levelIdx===1){
    // Hutan
    for(let i=0;i<15;i++){
      bgElements.push({x:i*70+Math.random()*30, h:80+Math.random()*100, w:20+Math.random()*15, layer:Math.random()<0.5?0:1, type:'tree', color:`rgba(${10+Math.random()*15},${40+Math.random()*30},${15+Math.random()*15},0.5)`});
    }
  } else {
    // Gunung
    for(let i=0;i<8;i++){
      bgElements.push({x:i*140-50+Math.random()*40, h:100+Math.random()*150, w:120+Math.random()*80, layer:Math.random()<0.4?0:1, type:'mountain', color:`rgba(${50+Math.random()*20},${10+Math.random()*10},${10+Math.random()*10},0.4)`});
    }
  }
}

function drawBg(c, levelIdx){
  const lvl=LEVELS[levelIdx];
  // Gradient latar
  const grd=c.createLinearGradient(0,0,0,GH);
  grd.addColorStop(0,lvl.bg);
  grd.addColorStop(1,lvl.gnd);
  c.fillStyle=grd; c.fillRect(0,0,GW,GH);

  // Bintang
  c.fillStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<40;i++){
    const sx=(i*137.5+50)%GW, sy=(i*97.3+20)%(GH*0.6);
    const sz=0.5+Math.sin(gameTime*2+i)*0.5;
    c.fillRect(sx,sy,Math.max(0.5,sz),Math.max(0.5,sz));
  }

  // Elemen background
  const px=(player?player.x:GW/2)/GW;
  for(const el of bgElements){
    const parallax=el.layer===0?0.02:0.05;
    const ox=-px*parallax*GW;
    const ex=el.x+ox;
    if(el.type==='tree'){
      // Segitiga pohon
      c.fillStyle=el.color;
      c.beginPath();
      c.moveTo(ex,GROUND_Y);
      c.lineTo(ex+el.w/2,GROUND_Y-el.h);
      c.lineTo(ex+el.w,GROUND_Y);
      c.fill();
      c.fillRect(ex+el.w*0.35,GROUND_Y-el.h*0.3,el.w*0.3,el.h*0.3);
    } else if(el.type==='mountain'){
      c.fillStyle=el.color;
      c.beginPath();
      c.moveTo(ex-el.w/2,GROUND_Y);
      c.lineTo(ex,GROUND_Y-el.h);
      c.lineTo(ex+el.w/2,GROUND_Y);
      c.fill();
    } else {
      // Bangunan
      c.fillStyle=el.color;
      c.fillRect(ex,GROUND_Y-el.h,el.w,el.h);
      // Jendela
      c.fillStyle='rgba(255,200,100,0.15)';
      for(let wy=GROUND_Y-el.h+10;wy<GROUND_Y-10;wy+=18){
        for(let wx=ex+6;wx<ex+el.w-6;wx+=14){
          if(Math.random()>0.3) c.fillRect(wx,wy,6,8);
        }
      }
    }
  }

  // Tanah
  c.fillStyle=lvl.gnd;
  c.fillRect(0,GROUND_Y,GW,GH-GROUND_Y);
  // Garis tanah
  c.strokeStyle=lvl.accent;
  c.lineWidth=2;
  c.globalAlpha=0.5;
  c.beginPath(); c.moveTo(0,GROUND_Y); c.lineTo(GW,GROUND_Y); c.stroke();
  c.globalAlpha=1;

  // Level 3: retakan lava
  if(levelIdx===2){
    c.strokeStyle='rgba(239,68,68,0.3)';
    c.lineWidth=1;
    for(let i=0;i<8;i++){
      const cx=i*130+40, cy=GROUND_Y+15+Math.random()*30;
      c.beginPath(); c.moveTo(cx,cy);
      c.lineTo(cx+20+Math.random()*30,cy+Math.random()*10-5);
      c.lineTo(cx+40+Math.random()*20,cy+Math.random()*8);
      c.stroke();
    }
  }
}

// ============================================================
// GAME STATE
// ============================================================
let gameState='menu'; // menu, levelSelect, playing, win, over
let currentLevel=0;
let unlockedLevels=1;
let gameTime=0;
let hitStopTimer=0;
let shakeTimer=0, shakeIntensity=0;
let waveIndex=0, waveDelay=0, waveText='', waveTextTimer=0;
let bossActive=false;
let totalCoins=0;

function loadProgress(){
  try{
    const d=JSON.parse(localStorage.getItem('stickmanFury'));
    if(d){ unlockedLevels=d.unlocked||1; totalCoins=d.coins||0; }
  }catch(e){}
}
function saveProgress(){
  try{
    localStorage.setItem('stickmanFury',JSON.stringify({unlocked:unlockedLevels,coins:totalCoins}));
  }catch(e){}
}

function startLevel(idx){
  initAudio();
  currentLevel=idx;
  player=createPlayer();
  enemies=[];
  coins=[];
  pickups=[];
  particles=[];
  dmgNums=[];
  waveIndex=0;
  waveDelay=1.5;
  waveText=LEVELS[idx].name;
  waveTextTimer=2;
  bossActive=false;
  hitStopTimer=0; shakeTimer=0;
  gameTime=0;
  genBg(idx);
  gameState='playing';
  hideAllOverlays();
  if(isMobile()) document.getElementById('mobileControls').classList.add('active');
}

function spawnWave(){
  const lvl=LEVELS[currentLevel];
  if(waveIndex>=lvl.waves.length){
    // Spawn boss
    bossActive=true;
    waveText='BOSS: '+lvl.boss.name;
    waveTextTimer=2.5;
    spawnBoss(lvl);
    sfx('boss');
    return;
  }
  const wave=lvl.waves[waveIndex];
  waveText='Gelombang '+(waveIndex+1);
  waveTextTimer=1.5;
  for(const g of wave.e){
    for(let i=0;i<g.n;i++){
      const side=Math.random()<0.5?-1:1;
      const x=side<0?-20:GW+20;
      spawnEnemy(g.t, x);
    }
  }
  waveIndex++;
}

function checkWaveComplete(){
  if(bossActive) return;
  if(enemies.length===0 && waveDelay<=0){
    const lvl=LEVELS[currentLevel];
    if(waveIndex>=lvl.waves.length){
      // Boss sudah dikalahkan atau belum spawn
      if(!bossActive) { waveDelay=1.5; spawnWave(); }
    } else {
      waveDelay=2;
    }
  }
}

function checkBossDefeated(){
  if(bossActive && enemies.length===0){
    // Boss mati
    bossActive=false;
    setTimeout(()=>{
      if(gameState==='playing') winLevel();
    }, 800);
  }
}

function winLevel(){
  gameState='win';
  totalCoins+=player.coinCount;
  if(currentLevel+1>=unlockedLevels && currentLevel<LEVELS.length-1) unlockedLevels=currentLevel+2;
  saveProgress();
  document.getElementById('winScore').textContent=player.score;
  document.getElementById('winCoins').textContent=player.coinCount;
  document.getElementById('winNextBtn').style.display=currentLevel<LEVELS.length-1?'inline-flex':'none';
  showOverlay('winOverlay');
  if(isMobile()) document.getElementById('mobileControls').classList.remove('active');
}

function gameOver(){
  gameState='over';
  document.getElementById('overScore').textContent=player.score;
  document.getElementById('overWave').textContent=bossActive?'Boss':('Gel. '+(waveIndex));
  showOverlay('overOverlay');
  if(isMobile()) document.getElementById('mobileControls').classList.remove('active');
}

function nextLevel(){ if(currentLevel<LEVELS.length-1) startLevel(currentLevel+1); }
function retryLevel(){ startLevel(currentLevel); }

// ============================================================
// UI OVERLAY
// ============================================================
function hideAllOverlays(){
  ['menuOverlay','levelOverlay','winOverlay','overOverlay'].forEach(id=>document.getElementById(id).classList.add('hidden'));
}
function showOverlay(id){ hideAllOverlays(); document.getElementById(id).classList.remove('hidden'); }

function showMenu(){
  gameState='menu';
  showOverlay('menuOverlay');
  if(isMobile()) document.getElementById('mobileControls').classList.remove('active');
}

function showLevelSelect(){
  gameState='levelSelect';
  const grid=document.getElementById('levelGrid');
  grid.innerHTML='';
  LEVELS.forEach((lvl,i)=>{
    const locked=i>=unlockedLevels;
    const card=document.createElement('div');
    card.className='level-card'+(locked?' locked':'');
    card.innerHTML=`<div class="lnum">${locked?'<i class="fas fa-lock" style="font-size:24px;color:rgba(255,255,255,0.3)"></i>':(i+1)}</div><div class="lname">${lvl.name}</div><div class="ldiff">${['Mudah','Sedang','Sulit'][i]}</div>`;
    if(!locked) card.onclick=()=>startLevel(i);
    grid.appendChild(card);
  });
  showOverlay('levelOverlay');
}

function drawHUD(c){
  const p=player;
  // HP Bar
  const hpW=180, hpH=14, hpX=20, hpY=20;
  c.fillStyle='rgba(0,0,0,0.5)';
  c.fillRect(hpX-1,hpY-1,hpW+2,hpH+2);
  const hpRatio=Math.max(0,p.hp/p.maxHp);
  const hpColor=hpRatio>0.5?'#22c55e':hpRatio>0.25?'#f59e0b':'#ef4444';
  c.fillStyle=hpColor;
  c.fillRect(hpX,hpY,hpW*hpRatio,hpH);
  c.fillStyle='rgba(255,255,255,0.15)';
  c.fillRect(hpX,hpY,hpW*hpRatio,hpH/2);
  c.font='bold 11px Outfit,sans-serif';
  c.fillStyle='#fff'; c.textAlign='left';
  c.fillText('HP '+Math.ceil(p.hp)+'/'+p.maxHp, hpX+6, hpY+11);

  // Boss HP bar
  if(bossActive){
    const boss=enemies.find(e=>e.isBoss && !e.dead);
    if(boss){
      const bw=300, bh=10, bx=(GW-bw)/2, by=12;
      c.fillStyle='rgba(0,0,0,0.6)';
      c.fillRect(bx-1,by-1,bw+2,bh+2);
      c.fillStyle=boss.color;
      c.fillRect(bx,by,bw*Math.max(0,boss.hp/boss.maxHp),bh);
      c.fillStyle='rgba(255,255,255,0.2)';
      c.fillRect(bx,by,bw*Math.max(0,boss.hp/boss.maxHp),bh/2);
      c.font='bold 12px "Bebas Neue",sans-serif';
      c.fillStyle=boss.color; c.textAlign='center';
      c.fillText(boss.bossName+(boss.enraged?' [GERAM]':''), GW/2, by-2);
    }
  }

  // Skor & Koin
  c.font='bold 16px "Bebas Neue",sans-serif';
  c.textAlign='right';
  c.fillStyle='#f0ece2';
  c.fillText('SKOR', GW-20, 28);
  c.font='bold 26px "Bebas Neue",sans-serif';
  c.fillStyle='#fbbf24';
  c.fillText(p.score, GW-20, 54);

  // Koin
  c.fillStyle='#fbbf24';
  c.beginPath(); c.arc(GW-110, 44, 7, 0, Math.PI*2); c.fill();
  c.fillStyle='#f59e0b';
  c.beginPath(); c.arc(GW-110, 44, 4, 0, Math.PI*2); c.fill();
  c.font='bold 18px "Bebas Neue",sans-serif';
  c.fillStyle='#fbbf24';
  c.textAlign='left';
  c.fillText(p.coinCount, GW-98, 50);

  // Combo
  if(p.combo>0 && p.comboTimer>0){
    c.font='bold 28px "Bebas Neue",sans-serif';
    c.textAlign='center';
    c.fillStyle=`rgba(255,107,53,${Math.min(1,p.comboTimer*3)})`;
    c.fillText(p.combo+1+'x COMBO', GW/2, GH-30);
  }

  // Wave text
  if(waveTextTimer>0){
    const a=Math.min(1, waveTextTimer*2);
    c.globalAlpha=a;
    c.font='bold 36px "Bebas Neue",sans-serif';
    c.textAlign='center';
    c.fillStyle=bossActive&&waveTextTimer>1?'#f59e0b':'#f0ece2';
    c.fillText(waveText, GW/2, GH/2-40);
    c.globalAlpha=1;
  }

  // Level indicator
  c.font='12px Outfit,sans-serif';
  c.textAlign='left';
  c.fillStyle='rgba(240,236,226,0.3)';
  c.fillText('Level '+(currentLevel+1)+': '+LEVELS[currentLevel].name, 20, GH-15);
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime=0;

function gameLoop(timestamp){
  requestAnimationFrame(gameLoop);
  let dt=(timestamp-lastTime)/1000;
  lastTime=timestamp;
  if(dt>0.1) dt=0.1;

  if(gameState!=='playing'){
    // Animasi menu background
    if(gameState==='menu'||gameState==='levelSelect'){
      gameTime+=dt;
      ctx.clearRect(0,0,GW,GH);
      // Latar gelap dengan partikel
      const grd=ctx.createLinearGradient(0,0,0,GH);
      grd.addColorStop(0,'#0a0a0f'); grd.addColorStop(1,'#111118');
      ctx.fillStyle=grd; ctx.fillRect(0,0,GW,GH);
      // Partikel dekoratif
      ctx.fillStyle='rgba(255,107,53,0.15)';
      for(let i=0;i<20;i++){
        const px=(i*173.7+gameTime*20*(i%3+1))%GW;
        const py=(i*131.3+Math.sin(gameTime+i)*30)%(GH*0.8);
        const sz=1+Math.sin(gameTime*2+i)*1;
        ctx.beginPath(); ctx.arc(px,py,Math.max(0.5,sz),0,Math.PI*2); ctx.fill();
      }
      // Stickman demo
      const demoX=GW/2+Math.sin(gameTime*0.8)*100;
      const demoState=Math.sin(gameTime*3)>0?'run':'attack';
      const demoCombo=Math.floor(gameTime*2)%3;
      drawStick(ctx,demoX,GROUND_Y,Math.sin(gameTime*0.8)>0?1:-1,demoState,gameTime,demoCombo,'rgba(255,107,53,0.2)',1.2,false,null);
    }
    return;
  }

  // Hit stop
  if(hitStopTimer>0){ hitStopTimer-=dt; dt=0; }

  gameTime+=dt;
  if(waveTextTimer>0) waveTextTimer-=dt;

  // Wave management
  if(waveDelay>0){
    waveDelay-=dt;
    if(waveDelay<=0 && !bossActive){
      spawnWave();
    }
  }

  // Update
  updatePlayer(dt);
  updateEnemies(dt);
  updateCoins(dt);
  updatePickups(dt);
  updateP(dt);
  updateDmg(dt);

  // Koin pickup
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    const dx=player.x-c.x, dy=(player.y-25)-(c.y);
    if(Math.sqrt(dx*dx+dy*dy)<25){
      player.coinCount++;
      player.score+=25;
      sfx('coin');
      spawnP(c.x,c.y,'#fbbf24',5,100,0.2,2);
      coins.splice(i,1);
    }
  }

  // HP pickup
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    if(pk.type==='hp'){
      const dx=player.x-pk.x, dy=(player.y-25)-(pk.y);
      if(Math.sqrt(dx*dx+dy*dy)<25){
        player.hp=Math.min(player.maxHp, player.hp+25);
        spawnP(pk.x,pk.y,'#22c55e',6,100,0.25,2);
        pickups.splice(i,1);
      }
    }
  }

  // Cek gelombang selesai
  checkWaveComplete();
  checkBossDefeated();

  // Cek game over
  if(player.dead && gameState==='playing'){
    setTimeout(()=>{ if(gameState==='playing') gameOver(); }, 1200);
    gameState='dying';
    setTimeout(()=>{ if(gameState==='dying') gameOver(); }, 1200);
  }

  // Screen shake
  let shakeX=0, shakeY=0;
  if(shakeTimer>0){
    shakeTimer-=dt;
    shakeX=(Math.random()-0.5)*shakeIntensity*2;
    shakeY=(Math.random()-0.5)*shakeIntensity*2;
  }

  // === RENDER ===
  ctx.save();
  ctx.translate(shakeX,shakeY);

  drawBg(ctx, currentLevel);
  drawPickups(ctx);
  drawCoins(ctx);
  drawEnemies(ctx);
  drawPlayer(ctx);
  drawP(ctx);
  drawDmg(ctx);
  drawHUD(ctx);

  ctx.restore();
}

// ============================================================
// INIT
// ============================================================
loadProgress();
setupMobile();
showMenu();
requestAnimationFrame(gameLoop);
</script>
