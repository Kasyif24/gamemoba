<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Legends of Valor</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#080c14;--bg2:#0f1524;--card:#141c30;--border:#1c2a48;--accent:#00e5ff;--accent2:#ffb800;--danger:#ff2d55;--success:#00e676;--blue:#2196f3;--red:#f44336;--text:#e4eaf4;--dim:#5a6d8a;--font1:'Rajdhani',sans-serif;--font2:'Exo 2',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font2);overflow:hidden;height:100vh;width:100vw;user-select:none}
.screen{display:none;position:absolute;inset:0;z-index:1}
.screen.active{display:flex}

/* ===== MENU ===== */
#screen-menu{flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
#menuCanvas{position:absolute;inset:0;z-index:0}
.menu-content{position:relative;z-index:2;text-align:center}
.menu-logo{font-family:var(--font1);font-size:clamp(2.2rem,6vw,4.5rem);font-weight:700;letter-spacing:4px;background:linear-gradient(135deg,var(--accent),#00ffaa,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 30px rgba(0,229,255,.3));margin-bottom:4px}
.menu-sub{font-family:var(--font2);font-size:clamp(.7rem,1.8vw,1rem);color:var(--dim);letter-spacing:6px;text-transform:uppercase;margin-bottom:40px}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(320px,85vw)}
.menu-btn{background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(0,229,255,.02));border:1px solid rgba(0,229,255,.2);color:var(--text);font-family:var(--font1);font-size:1.1rem;font-weight:600;padding:14px 24px;border-radius:8px;cursor:pointer;transition:all .25s;letter-spacing:1px;position:relative;overflow:hidden}
.menu-btn:hover,.menu-btn:active{background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(0,229,255,.06));border-color:var(--accent);transform:scale(1.03);box-shadow:0 0 25px rgba(0,229,255,.15)}
.menu-btn i{margin-right:10px;color:var(--accent)}
.menu-rank{margin-top:30px;display:flex;align-items:center;gap:12px;justify-content:center}
.rank-badge{width:48px;height:48px;border-radius:50%;border:2px solid var(--accent2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--accent2);background:rgba(255,184,0,.08)}
.rank-info{text-align:left}
.rank-name{font-family:var(--font1);font-weight:700;color:var(--accent2);font-size:1rem}
.rank-stars{color:var(--dim);font-size:.75rem}
.menu-ver{position:absolute;bottom:12px;right:16px;font-size:.65rem;color:var(--dim);z-index:2}

/* ===== HERO SELECT ===== */
#screen-heropick{flex-direction:column;background:var(--bg)}
.hp-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);min-height:56px;flex-shrink:0}
.hp-team{display:flex;gap:4px}
.hp-slot{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--dim)}
.hp-slot.filled{border-color:var(--accent);color:var(--accent)}
.hp-vs{font-family:var(--font1);font-weight:700;font-size:1.1rem;color:var(--accent2)}
.hp-body{display:flex;flex:1;overflow:hidden}
.hp-grid{flex:1;padding:8px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.hp-filters{display:flex;gap:4px;padding:0 8px 6px;flex-shrink:0;flex-wrap:wrap}
.hp-filter{padding:4px 10px;border-radius:20px;font-size:.7rem;font-family:var(--font1);font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--dim);cursor:pointer;transition:all .2s}
.hp-filter.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.08)}
.hp-hero-card{width:62px;height:74px;border-radius:8px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.hp-hero-card:hover{border-color:var(--dim)}
.hp-hero-card.selected{border-color:var(--accent);box-shadow:0 0 15px rgba(0,229,255,.2)}
.hp-hero-card .hc-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.hp-hero-card .hc-name{font-size:.5rem;font-family:var(--font1);font-weight:600;text-align:center;line-height:1.1;color:var(--text)}
.hp-hero-card .hc-role{font-size:.45rem;color:var(--dim)}
.hp-detail{width:280px;background:var(--bg2);border-left:1px solid var(--border);padding:12px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.hd-portrait{width:100%;aspect-ratio:16/9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.hd-portrait::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.7))}
.hd-name{font-family:var(--font1);font-weight:700;font-size:1.2rem}
.hd-role{font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:2px}
.hd-stats{display:flex;flex-direction:column;gap:4px}
.hd-stat{display:flex;align-items:center;gap:6px;font-size:.7rem}
.hd-stat label{width:32px;color:var(--dim);font-family:var(--font1);font-weight:600}
.hd-stat .bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.hd-stat .bar div{height:100%;border-radius:3px;transition:width .3s}
.hd-skills{display:flex;flex-direction:column;gap:6px}
.hd-skill{background:var(--card);border-radius:6px;padding:6px 8px;border:1px solid var(--border)}
.hd-skill-name{font-family:var(--font1);font-weight:600;font-size:.8rem;color:var(--accent)}
.hd-skill-desc{font-size:.65rem;color:var(--dim);margin-top:2px}
.hd-passive{border-color:rgba(255,184,0,.3)}
.hd-passive .hd-skill-name{color:var(--accent2)}
.hp-bottom{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.hp-sel{display:flex;flex-direction:column;gap:2px}
.hp-sel label{font-size:.55rem;color:var(--dim);font-family:var(--font1);font-weight:600;text-transform:uppercase}
.hp-sel select{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:var(--font2);font-size:.75rem;padding:4px 8px;border-radius:4px;min-width:110px}
.hp-lockin{margin-left:auto;padding:10px 28px;background:linear-gradient(135deg,var(--accent),#00b8d4);border:none;border-radius:8px;color:#000;font-family:var(--font1);font-weight:700;font-size:1rem;cursor:pointer;letter-spacing:1px;transition:all .2s}
.hp-lockin:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,229,255,.3)}

/* ===== GAME ===== */
#screen-game{position:relative}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hud{position:absolute;inset:0;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-top{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 16px;background:rgba(8,12,20,.85);border-radius:0 0 12px 12px;border:1px solid var(--border);border-top:none}
.hud-score{font-family:var(--font1);font-weight:700;font-size:1.2rem}
.hud-score .blue{color:var(--blue)}
.hud-score .red{color:var(--red)}
.hud-timer{font-family:var(--font1);font-weight:600;font-size:.9rem;color:var(--dim)}
.hud-minimap{position:absolute;top:8px;left:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:rgba(8,12,20,.8)}
.hud-gold{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.hud-gold-val{font-family:var(--font1);font-weight:700;font-size:1.1rem;color:var(--accent2)}
.hud-gold-rate{font-size:.6rem;color:var(--dim)}
.hud-level{position:absolute;top:52px;right:8px;display:flex;align-items:center;gap:6px}
.hud-lvl-num{font-family:var(--font1);font-weight:700;font-size:1.4rem;color:var(--accent)}
.hud-xp-bar{width:80px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.hud-xp-bar div{height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.hud-bars{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:min(300px,60vw);display:flex;flex-direction:column;gap:3px}
.hud-bar{height:10px;background:rgba(0,0,0,.6);border-radius:5px;overflow:hidden;position:relative}
.hud-bar div{height:100%;border-radius:5px;transition:width .15s}
.hud-bar.hp div{background:linear-gradient(90deg,#00c853,#69f0ae)}
.hud-bar.mp div{background:linear-gradient(90deg,#2979ff,#82b1ff)}
.hud-bar span{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:.55rem;font-family:var(--font1);font-weight:600;color:#fff;text-shadow:0 1px 2px #000}
.hud-skills{position:absolute;bottom:20px;right:12px;display:flex;gap:8px;align-items:flex-end}
.skill-btn{width:52px;height:52px;border-radius:12px;border:2px solid var(--border);background:rgba(20,28,48,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;transition:all .15s}
.skill-btn:active{transform:scale(.9)}
.skill-btn .sk-key{position:absolute;top:2px;left:4px;font-size:.5rem;font-family:var(--font1);font-weight:700;color:var(--dim)}
.skill-btn .sk-icon{font-size:1.2rem}
.skill-btn.ult{width:60px;height:60px;border-radius:14px;border-color:var(--accent2)}
.skill-btn .cd-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;font-family:var(--font1);font-weight:700;font-size:.9rem;color:#fff}
.skill-btn .mp-cost{position:absolute;bottom:1px;right:3px;font-size:.45rem;color:var(--blue)}
.skill-btn.atk-btn{border-color:rgba(255,255,255,.15);width:48px;height:48px}
.hud-joystick{position:absolute;bottom:20px;left:12px;width:120px;height:120px}
.joy-base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);position:relative}
.joy-stick{width:48px;height:48px;border-radius:50%;background:rgba(0,229,255,.25);border:2px solid rgba(0,229,255,.4);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);transition:none}
.hud-items{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.item-slot{width:36px;height:36px;border-radius:6px;border:1px solid var(--border);background:rgba(20,28,48,.9);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--dim);cursor:pointer;position:relative}
.item-slot.has-item{border-color:rgba(0,229,255,.3);color:var(--accent)}
.hud-shop-btn{position:absolute;bottom:82px;left:50%;transform:translateX(-50%);padding:4px 14px;border-radius:12px;background:rgba(255,184,0,.12);border:1px solid rgba(255,184,0,.3);color:var(--accent2);font-family:var(--font1);font-weight:600;font-size:.7rem;cursor:pointer}
.hud-recall{position:absolute;bottom:82px;left:12px;padding:4px 10px;border-radius:8px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);color:var(--accent);font-family:var(--font1);font-weight:600;font-size:.65rem;cursor:pointer}
.hud-kills{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.kill-msg{padding:3px 12px;background:rgba(0,0,0,.7);border-radius:4px;font-size:.65rem;font-family:var(--font1);font-weight:600;white-space:nowrap;animation:killFade 3s forwards}
@keyframes killFade{0%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.hud-surrender{position:absolute;top:50px;right:8px;padding:4px 10px;border-radius:6px;background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.25);color:var(--danger);font-family:var(--font1);font-weight:600;font-size:.6rem;cursor:pointer}

/* ===== SHOP ===== */
.shop-overlay{display:none;position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.8);align-items:center;justify-content:center}
.shop-overlay.open{display:flex}
.shop-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:min(600px,92vw);max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
.shop-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.shop-header h3{font-family:var(--font1);font-weight:700;font-size:1.1rem}
.shop-gold{font-family:var(--font1);font-weight:700;color:var(--accent2)}
.shop-close{background:none;border:none;color:var(--dim);font-size:1.2rem;cursor:pointer;padding:4px}
.shop-cats{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.shop-cat{padding:3px 10px;border-radius:12px;font-size:.65rem;font-family:var(--font1);font-weight:600;border:1px solid var(--border);color:var(--dim);cursor:pointer;background:var(--card)}
.shop-cat.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.08)}
.shop-items{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;overflow-y:auto;flex:1}
.shop-item{width:130px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s}
.shop-item:hover{border-color:var(--accent)}
.shop-item.cant-afford{opacity:.4}
.shop-item-name{font-family:var(--font1);font-weight:600;font-size:.75rem;margin-bottom:2px}
.shop-item-stats{font-size:.55rem;color:var(--dim);margin-bottom:4px}
.shop-item-cost{font-family:var(--font1);font-weight:700;font-size:.8rem;color:var(--accent2)}
.shop-item .buy-btn{margin-top:4px;width:100%;padding:3px;border-radius:4px;border:none;background:var(--accent);color:#000;font-family:var(--font1);font-weight:700;font-size:.65rem;cursor:pointer}
.shop-item .buy-btn:disabled{background:var(--border);color:var(--dim);cursor:not-allowed}

/* ===== RESULTS ===== */
#screen-results{flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,20,.95);gap:20px}
.result-title{font-family:var(--font1);font-size:clamp(2rem,6vw,4rem);font-weight:700;letter-spacing:4px}
.result-title.win{background:linear-gradient(135deg,var(--accent2),#ff9100);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-title.lose{background:linear-gradient(135deg,var(--danger),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center}
.result-stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 20px}
.result-stat .rs-val{font-family:var(--font1);font-weight:700;font-size:1.8rem;color:var(--accent)}
.result-stat .rs-label{font-size:.7rem;color:var(--dim);margin-top:2px}
.result-mvp{font-family:var(--font1);font-size:1rem;color:var(--accent2);font-weight:600}
.result-btn{padding:12px 36px;background:linear-gradient(135deg,var(--accent),#00b8d4);border:none;border-radius:8px;color:#000;font-family:var(--font1);font-weight:700;font-size:1rem;cursor:pointer;letter-spacing:1px;transition:all .2s;margin-top:10px}
.result-btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(0,229,255,.3)}

/* ===== LOADING ===== */
#screen-loading{flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:20px}
.loading-bar{width:240px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.loading-bar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s}
.loading-text{font-family:var(--font1);font-size:.9rem;color:var(--dim)}
.loading-tip{font-size:.7rem;color:var(--dim);max-width:300px;text-align:center;font-style:italic}

/* Scrollbar */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- MENU -->
<div id="screen-menu" class="screen active">
  <canvas id="menuCanvas"></canvas>
  <div class="menu-content">
    <div class="menu-logo">LEGENDS OF VALOR</div>
    <div class="menu-sub">Conquer the Battlefield</div>
    <div class="menu-btns">
      <button class="menu-btn" onclick="startMode('classic')"><i class="fas fa-gamepad"></i>Classic</button>
      <button class="menu-btn" onclick="startMode('ranked')"><i class="fas fa-trophy"></i>Ranked</button>
      <button class="menu-btn" onclick="startMode('custom')"><i class="fas fa-users"></i>Custom Room</button>
      <button class="menu-btn" onclick="startMode('training')"><i class="fas fa-robot"></i>AI Training</button>
    </div>
    <div class="menu-rank">
      <div class="rank-badge"><i class="fas fa-shield-halved"></i></div>
      <div class="rank-info">
        <div class="rank-name">Grandmaster</div>
        <div class="rank-stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i></div>
      </div>
    </div>
  </div>
  <div class="menu-ver">v1.0.0 Beta</div>
</div>

<!-- HERO SELECT -->
<div id="screen-heropick" class="screen">
  <div class="hp-top">
    <div class="hp-team" id="blueTeam"></div>
    <div class="hp-vs">VS</div>
    <div class="hp-team" id="redTeam"></div>
  </div>
  <div class="hp-filters" id="heroFilters"></div>
  <div class="hp-body">
    <div class="hp-grid" id="heroGrid"></div>
    <div class="hp-detail" id="heroDetail"></div>
  </div>
  <div class="hp-bottom">
    <div class="hp-sel"><label>Spell</label><select id="selSpell"></select></div>
    <div class="hp-sel"><label>Emblem</label><select id="selEmblem"></select></div>
    <button class="hp-lockin" onclick="lockIn()">LOCK IN</button>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading" class="screen">
  <div class="loading-bar"><div id="loadBar"></div></div>
  <div class="loading-text" id="loadText">Memprepare pertandingan...</div>
  <div class="loading-tip" id="loadTip">Tips: Gunakan Fog of War untuk menghindari ambush dari musuh.</div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <canvas id="gameCanvas"></canvas>
  <div class="hud">
    <div class="hud-top">
      <span class="hud-score"><span class="blue" id="blueKills">0</span> : <span class="red" id="redKills">0</span></span>
      <span class="hud-timer" id="gameTimer">00:00</span>
    </div>
    <canvas class="hud-minimap" id="minimap" width="140" height="140"></canvas>
    <div class="hud-gold">
      <div class="hud-gold-val"><i class="fas fa-coins" style="font-size:.8rem"></i> <span id="goldVal">0</span></div>
      <div class="hud-gold-rate">+<span id="goldRate">0</span>/s</div>
    </div>
    <div class="hud-level">
      <span class="hud-lvl-num" id="lvlNum">1</span>
      <div class="hud-xp-bar"><div id="xpBar" style="width:0%"></div></div>
    </div>
    <div class="hud-bars">
      <div class="hud-bar hp"><div id="hpBar" style="width:100%"></div><span id="hpText">1000/1000</span></div>
      <div class="hud-bar mp"><div id="mpBar" style="width:100%"></div><span id="mpText">400/400</span></div>
    </div>
    <div class="hud-items" id="hudItems"></div>
    <div class="hud-shop-btn" onclick="toggleShop()"><i class="fas fa-store"></i> SHOP</div>
    <div class="hud-recall" onclick="startRecall()"><i class="fas fa-rotate-left"></i> RECALL</div>
    <div class="hud-skills" id="hudSkills"></div>
    <div class="hud-joystick" id="joystickArea">
      <div class="joy-base" id="joyBase"><div class="joy-stick" id="joyStick"></div></div>
    </div>
    <div class="hud-kills" id="killFeed"></div>
    <div class="hud-surrender" onclick="trySurrender()">SURRENDER</div>
  </div>
  <div class="shop-overlay" id="shopOverlay">
    <div class="shop-panel">
      <div class="shop-header"><h3>Item Shop</h3><span class="shop-gold"><i class="fas fa-coins"></i> <span id="shopGold">0</span></span><button class="shop-close" onclick="toggleShop()"><i class="fas fa-xmark"></i></button></div>
      <div class="shop-cats" id="shopCats"></div>
      <div class="shop-items" id="shopItems"></div>
    </div>
  </div>
</div>

//  UTILITAS

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}
function rnd(a,b){return a+Math.random()*(b-a)}
function rndInt(a,b){return Math.floor(rnd(a,b+1))}
function w2s(wx,wy){return{x:(wx-camera.x)*camera.zoom+canvas.width/2,y:(wy-camera.y)*camera.zoom+canvas.height/2}}
function s2w(sx,sy){return{x:(sx-canvas.width/2)/camera.zoom+camera.x,y:(sy-canvas.height/2)/camera.zoom+camera.y}}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}

//  MENU PARTICLES

let menuParticles = [];
function initMenuParticles(){
  const c = document.getElementById('menuCanvas');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const cx = c.getContext('2d');
  menuParticles = [];
  for(let i=0;i<80;i++){
    menuParticles.push({x:rnd(0,c.width),y:rnd(0,c.height),vx:rnd(-.3,.3),vy:rnd(-.5,-.1),r:rnd(1,3),a:rnd(.1,.5),color:Math.random()>.5?'0,229,255':'255,184,0'});
  }
  function animMenu(){
    if(!document.getElementById('screen-menu').classList.contains('active'))return;
    cx.clearRect(0,0,c.width,c.height);
    // Latar gradien
    const g = cx.createRadialGradient(c.width/2,c.height*0.4,0,c.width/2,c.height*0.4,c.width*0.7);
    g.addColorStop(0,'rgba(0,229,255,0.03)');
    g.addColorStop(0.5,'rgba(0,229,255,0.01)');
    g.addColorStop(1,'transparent');
    cx.fillStyle=g;cx.fillRect(0,0,c.width,c.height);
    menuParticles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.y<-10){p.y=c.height+10;p.x=rnd(0,c.width)}
      if(p.x<-10)p.x=c.width+10;if(p.x>c.width+10)p.x=-10;
      cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
      cx.fillStyle=`rgba(${p.color},${p.a})`;cx.fill();
    });
    requestAnimationFrame(animMenu);
  }
  animMenu();
}
window.addEventListener('resize',()=>{
  const c=document.getElementById('menuCanvas');if(c){c.width=innerWidth;c.height=innerHeight}
  if(canvas){canvas.width=innerWidth;canvas.height=innerHeight}
  camera.zoom=Math.min(canvas.width,canvas.height)/900;
});
initMenuParticles();

function buildHeroSelect(){
  // Filter
  const fc=document.getElementById('heroFilters');
  fc.innerHTML='';
  ROLES.forEach(r=>{
    const b=document.createElement('div');b.className='hp-filter'+(r==='All'?' active':'');b.textContent=r;
    b.onclick=()=>{fc.querySelectorAll('.hp-filter').forEach(f=>f.classList.remove('active'));b.classList.add('active');filterHeroes(r)};
    fc.appendChild(b);
  });
  // Grid
  filterHeroes('All');
  // Spell
  const ss=document.getElementById('selSpell');
  ss.innerHTML='';SPELLS.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;ss.appendChild(o)});
  ss.onchange=()=>selectedSpell=+ss.value;
  // Emblem
  const se=document.getElementById('selEmblem');
  se.innerHTML='';EMBLEMS.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e+' Emblem';se.appendChild(o)});
  se.onchange=()=>selectedEmblem=+se.value;
  // Team slots
  ['blueTeam','redTeam'].forEach(id=>{
    const d=document.getElementById(id);d.innerHTML='';
    for(let i=0;i<5;i++){const s=document.createElement('div');s.className='hp-slot';s.id=id+'_'+i;s.textContent='?';d.appendChild(s)}
  });
  // Detail kosong
  showHeroDetail(null);
}
function filterHeroes(role){
  const g=document.getElementById('heroGrid');g.innerHTML='';
  HEROES.filter(h=>role==='All'||h.role===role).forEach(h=>{
    const c=document.createElement('div');c.className='hp-hero-card'+(selectedHero&&selectedHero.id===h.id?' selected':'');
    c.innerHTML=`<div class="hc-icon" style="background:${h.color}22;border:2px solid ${h.color};color:${h.color}">${h.symbol}</div><div class="hc-name">${h.name}</div><div class="hc-role">${h.role}</div>`;
    c.onclick=()=>{selectedHero=h;filterHeroes(role);showHeroDetail(h)};
    g.appendChild(c);
  });
}

  for(let i=0;i<5;i++){

// ============================================================
//  BUILD TERRAIN (offscreen canvas)
// ============================================================
function buildTerrain(){
  mapCanvas=document.createElement('canvas');
  mapCanvas.width=MAP_W;mapCanvas.height=MAP_H;
  mapCtx=mapCanvas.getContext('2d');

  // Latar hijau gelap
  mapCtx.fillStyle='#1a2e1a';mapCtx.fillRect(0,0,MAP_W,MAP_H);

  // Grid halus
  mapCtx.strokeStyle='rgba(255,255,255,0.02)';mapCtx.lineWidth=1;
  for(let i=0;i<MAP_W;i+=100){mapCtx.beginPath();mapCtx.moveTo(i,0);mapCtx.lineTo(i,MAP_H);mapCtx.stroke();mapCtx.beginPath();mapCtx.moveTo(0,i);mapCtx.lineTo(MAP_W,i);mapCtx.stroke()}

  // Gambar lane paths
  function drawPath(pts,w){
    mapCtx.beginPath();mapCtx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)mapCtx.lineTo(pts[i][0],pts[i][1]);
    mapCtx.strokeStyle='#2a3a25';mapCtx.lineWidth=w;mapCtx.lineCap='round';mapCtx.lineJoin='round';mapCtx.stroke();
    mapCtx.strokeStyle='#333d2e';mapCtx.lineWidth=w-10;mapCtx.stroke();
  }
  drawPath(LANES.top.blue,60);
  drawPath(LANES.mid.blue,60);
  drawPath(LANES.bot.blue,60);

  // River (diagonal tengah)
  mapCtx.save();
  mapCtx.beginPath();
  mapCtx.moveTo(800,2400);mapCtx.quadraticCurveTo(1600,1600,2400,800);
  mapCtx.strokeStyle='rgba(0,100,180,0.25)';mapCtx.lineWidth=120;mapCtx.lineCap='round';mapCtx.stroke();
  mapCtx.strokeStyle='rgba(0,150,220,0.15)';mapCtx.lineWidth=80;mapCtx.stroke();
  mapCtx.restore();

  // Jungle area (lingkaran pepohonan)
  const trees=[
    [500,2000,25],[700,1800,20],[900,2000,22],[400,1500,20],[600,1000,25],[800,800,20],
    [2700,1200,25],[2500,1400,20],[2300,1200,22],[2800,1700,20],[2600,2200,25],[2400,2400,20],
    [1200,2200,20],[1400,2400,22],[1800,800,20],[2000,1000,22],[1200,1000,20],[2000,2200,20]
  ];
  trees.forEach(t=>{
    mapCtx.beginPath();mapCtx.arc(t[0],t[1],t[2],0,Math.PI*2);
    mapCtx.fillStyle='rgba(20,60,20,0.6)';mapCtx.fill();
    mapCtx.strokeStyle='rgba(40,90,40,0.4)';mapCtx.lineWidth=2;mapCtx.stroke();
  });

  // Base area biru
  let g=mapCtx.createRadialGradient(BLUE_BASE.x,BLUE_BASE.y,0,BLUE_BASE.x,BLUE_BASE.y,250);
  g.addColorStop(0,'rgba(33,150,243,0.12)');g.addColorStop(1,'transparent');
  mapCtx.fillStyle=g;mapCtx.fillRect(0,0,MAP_W,MAP_H);
  // Base area merah
  g=mapCtx.createRadialGradient(RED_BASE.x,RED_BASE.y,0,RED_BASE.x,RED_BASE.y,250);
  g.addColorStop(0,'rgba(244,67,54,0.12)');g.addColorStop(1,'transparent');
  mapCtx.fillStyle=g;mapCtx.fillRect(0,0,MAP_W,MAP_H);

  // Base struktur
  function drawBase(bx,by,color){
    mapCtx.save();
    mapCtx.beginPath();mapCtx.arc(bx,by,60,0,Math.PI*2);
    mapCtx.fillStyle=color+'22';mapCtx.fill();
    mapCtx.strokeStyle=color+'66';mapCtx.lineWidth=3;mapCtx.stroke();
    // Crystal di tengah
    mapCtx.beginPath();mapCtx.moveTo(bx,by-25);mapCtx.lineTo(bx+18,by);mapCtx.lineTo(bx,by+25);mapCtx.lineTo(bx-18,by);mapCtx.closePath();
    mapCtx.fillStyle=color+'88';mapCtx.fill();mapCtx.strokeStyle=color;mapCtx.lineWidth=2;mapCtx.stroke();
    mapCtx.restore();
  }
  drawBase(BLUE_BASE.x,BLUE_BASE.y,'#2196f3');
  drawBase(RED_BASE.x,RED_BASE.y,'#f44336');
}

function buyItem(it){
  if(!player||player.items.length>=6||player.gold<it.cost)return;
  player.gold-=it.cost;
  // Terapkan stat item
  const h=player;
  if(it.atk)h.atk+=it.atk;
  if(it.mpow){h.atk+=it.mpow*0.8}// Magic power juga menambah damage skill
  if(it.def)h.def+=it.def;
  if(it.hp)h.maxHp+=it.hp;h.hp=Math.min(h.hp+h.hp*0,h.maxHp);
  if(it.mp)h.maxMp+=it.mp;h.mp=Math.min(h.mp+it.mp,h.maxMp);
  if(it.spd)h.spd+=it.spd;
  if(it.crit)h._crit=(h._crit||0)+it.crit;
  if(it.steal)h._steal=(h._steal||0)+it.steal;
  if(it.mpen)h._mpen=(h._mpen||0)+it.mpen;
  h.items.push(it);
  buildShop();updateHUD();
  addEffect(h.x,h.y,'+','var(--accent2)',20);
}

// ============================================================
//  SKILL SYSTEM
// ============================================================
function useSkill(cdKey,sk){
  if(!player||!player.alive||player[cdKey]>0||player.mp<sk.cost)return;
  player[cdKey]=sk.cd;player.mp-=sk.cost;

  // Cari target terdekat dalam range (untuk targeted skill)
  let tx=player.x,ty=player.y;
  const enemies_near=enemies.concat(minions.filter(m=>m.alive&&m.team==='red')).filter(e=>dist(player,e)<=(sk.range||sk.radius||300));
  if(enemies_near.length>0){
    let nearest=enemies_near[0];enemies_near.forEach(e=>{if(dist(player,e)<dist(player,nearest))nearest=e});
    tx=nearest.x;ty=nearest.y;
  }else{
    // Arah berdasarkan joystick
    if(joyDir.x!==0||joyDir.y!==0){
      const a=Math.atan2(joyDir.y,joyDir.x);
      tx=player.x+Math.cos(a)*(sk.range||200);
      ty=player.y+Math.sin(a)*(sk.range||200);
    }else{
      tx=player.x+100;ty=player.y;
    }
  }

  const dmg=sk.dmg+player.level*15+(player.buffAtk||0);
  const a=angle(player,{x:tx,y:ty});

  if(sk.type==='melee'){
    // Damage semua musuh di depan
    enemies_near.forEach(e=>{
      if(dist(player,e)<=sk.range+20)dealDamage(player,e,dmg);
    });
    addEffect(player.x+Math.cos(a)*60,player.y+Math.sin(a)*60,'slash',player.heroData.color,40);
  }else if(sk.type==='projectile'){
    projectiles.push({x:player.x,y:player.y,tx,ty,spd:500,dmg,team:player.team,owner:player,radius:6,color:player.heroData.color,life:2,fx:sk.fx,dur:sk.dur||0});
  }else if(sk.type==='aoe'){
    const cx=sk.range>0?tx:player.x,cy=sk.range>0?ty:player.y;
    const r=sk.radius||200;
    getAllEnemies(player.team).forEach(e=>{if(dist({x:cx,y:cy},e)<=r){
      if(sk.fx==='heal_aoe'){e.hp=Math.min(e.hp+(sk.val||300),e.maxHp);addEffect(e.x,e.y,'+','#00e676',18)}
      else if(sk.fx==='revive'){/* Simplified: heal besar */e.hp=Math.min(e.hp+500,e.maxHp);addEffect(e.x,e.y,'+','#aa00ff',18)}
      else dealDamage(player,e,dmg);
      if(sk.fx==='stun')e.stunTimer=sk.dur;
      if(sk.fx==='slow'){e.slowTimer=sk.dur;e.slowAmt=0.4}
    }});
    effects.push({type:'aoe',x:cx,y:cy,radius:0,maxRadius:r,color:player.heroData.color,life:0.5,maxLife:0.5});
  }else if(sk.type==='dash'){
    const dd=sk.dashDist||200;
    const nx=clamp(player.x+Math.cos(a)*dd,20,MAP_W-20);
    const ny=clamp(player.y+Math.sin(a)*dd,20,MAP_H-20);
    enemies_near.forEach(e=>{if(dist(player,e)<=dd+30)dealDamage(player,e,dmg)});
    // Trail effect
    for(let i=0;i<5;i++){effects.push({type:'trail',x:lerp(player.x,nx,i/5),y:lerp(player.y,ny,i/5),radius:12,color:player.heroData.color,life:0.3,maxLife:0.3})}
    player.x=nx;player.y=ny;
  }else if(sk.type==='self'){
    if(sk.fx==='shield'){player.shield=sk.val;player.shieldTimer=sk.dur;addEffect(player.x,player.y,'shield',player.heroData.color,30)}
    if(sk.fx==='buff'){player.buffAtk=(player.buffAtk||0)+sk.val;player.buffAtkTimer=sk.dur;addEffect(player.x,player.y,'buff',player.heroData.color,30)}
  }else if(sk.type==='heal'){
    // Heal ally terdekat (atau diri sendiri)
    let target=player;
    const allies_near=[player,...allies].filter(a=>a.alive&&dist(player,a)<sk.range);
    allies_near.forEach(a=>{if(a.hp<a.maxHp&&dist(player,a)<dist(player,target)||target===player&&a!==player&&a.hp<a.maxHp)target=a});
    target.hp=Math.min(target.hp+sk.val,target.maxHp);
    addEffect(target.x,target.y,'+','#00e676',20);
  }else if(sk.type==='ally_shield'||sk.type==='ally_buff'){
    let target=player;
    [player,...allies].filter(a=>a.alive&&dist(player,a)<sk.range).forEach(a=>{if(a!==player)target=a});
    if(sk.fx==='shield'){target.shield=sk.val;target.shieldTimer=sk.dur}
    if(sk.fx==='buff'){target.buffAtk=(target.buffAtk||0)+sk.val;target.buffAtkTimer=sk.dur}
    addEffect(target.x,target.y,sk.fx==='shield'?'shield':'buff','#00e676',25);
  }
}

function playerAttackNearest(){
  if(!player||!player.alive||player.atkCd>0)return;
  const targets=getAllEnemies(player.team).filter(e=>e.alive&&dist(player,e)<=player.atkRange+50);
  if(targets.length===0)return;
  let nearest=targets[0];targets.forEach(e=>{if(dist(player,e)<dist(player,nearest))nearest=e});
  autoAttackTarget=nearest;
  doAttack(player,nearest);
}

// ============================================================
//  COMBAT
// ============================================================
function dealDamage(attacker,target,dmg){
  if(!target.alive)return;
  let actualDmg=Math.max(1,dmg-target.def*0.4);
  if(attacker._crit&&Math.random()*100<attacker._crit)actualDmg*=1.5;
  if(target.shield>0){
    const absorbed=Math.min(target.shield,actualDmg);
    target.shield-=absorbed;actualDmg-=absorbed;
  }
  target.hp-=actualDmg;
  if(attacker.isPlayer)playerStats.damage+=actualDmg;
  addEffect(target.x,target.y-randNum(5,15),'-'+Math.floor(actualDmg),'#ff4444',14);
  if(target.hp<=0)killEntity(target,attacker);
}
function randNum(a,b){return a+Math.random()*(b-a)}
function doAttack(attacker,target){
  if(attacker.atkCd>0||!target.alive)return;
  attacker.atkCd=1/attacker.atkSpeed;
  let dmg=attacker.atk+(attacker.buffAtk||0)+attacker.level*5;
  if(attacker.atkRange>200){
    // Ranged - projectile
    projectiles.push({x:attacker.x,y:attacker.y,tx:target.x,ty:target.y,spd:600,dmg,team:attacker.team,owner:attacker,radius:4,color:attacker.heroData.color,life:1.5,fx:'none',dur:0});
  }else{
    dealDamage(attacker,target,dmg);
    if(attacker._steal){attacker.hp=Math.min(attacker.hp+dmg*attacker._steal/100,attacker.maxHp)}
  }
}
function killEntity(entity,killer){
  entity.alive=false;
  if(entity.hp!==undefined&&entity.maxHp!==undefined&&entity.maxHp>600){
    // Hero death
    entity.respawnTimer=5+entity.level*1.5;
    if(entity.team==='blue')redKills++;else blueKills++;
    if(killer&&killer.isPlayer)playerStats.kills++;
    if(entity.isPlayer)playerStats.deaths++;
    const killerName=killer?killer.heroData.name:'Tower';
    const victimName=entity.heroData.name;
    addKillMsg(killerName+' mengeliminasi '+victimName,entity.team==='red'?'var(--blue)':'var(--red)');
    // Gold & XP untuk killer
    if(killer&&killer.gold!==undefined){killer.gold+=200+entity.level*20;killer.xp+=100+entity.level*15;checkLevelUp(killer)}
    // Death effect
    for(let i=0;i<12;i++)effects.push({type:'particle',x:entity.x+rnd(-20,20),y:entity.y+rnd(-20,20),vx:rnd(-80,80),vy:rnd(-80,80),radius:rnd(2,5),color:entity.heroData.color,life:0.8,maxLife:0.8});
  }else if(entity.gold!==undefined&&entity.maxHp<=600){
    // Minion death
    if(killer&&killer.gold!==undefined){
      const bonus=(killer.team===entity.team)?0:20;
      killer.gold+=50+bonus;killer.xp+=25+bonus;checkLevelUp(killer);
      if(killer.isPlayer)playerStats.goldEarned+=50+bonus;
    }
  }else if(entity.type){
    // Jungle monster
    if(killer&&killer.gold!==undefined){
      killer.gold+=entity.gold;killer.xp+=entity.xp;checkLevelUp(killer);
      if(killer.isPlayer)playerStats.goldEarned+=entity.gold;
    }
    entity.respawnTimer=entity.type==='lord'?120:entity.type==='turtle'?90:40;
    addKillMsg((killer?killer.heroData.name:'')+' membunuh '+entity.type.replace('_',' '),'var(--accent2)');
  }
}
function checkLevelUp(hero){
  while(hero.xp>=hero.xpToLevel&&hero.level<15){
    hero.xp-=hero.xpToLevel;hero.level++;
    hero.xpToLevel=100+hero.level*50;
    hero.maxHp+=hero.heroData.hp*0.08;hero.hp=Math.min(hero.hp+hero.heroData.hp*0.08,hero.maxHp);
    hero.maxMp+=hero.heroData.mp*0.05;hero.mp=Math.min(hero.mp+hero.heroData.mp*0.05,hero.maxMp);
    hero.atk+=hero.heroData.atk*0.06;hero.def+=hero.heroData.def*0.05;
    if(hero.isPlayer)addEffect(hero.x,hero.y,'LEVEL UP!','var(--accent)',22);
  }
}
function getAllEnemies(team){
  const arr=[];
  if(team==='blue'){enemies.forEach(e=>{if(e.alive)arr.push(e)});minions.forEach(m=>{if(m.alive&&m.team==='red')arr.push(m)});towers.forEach(t=>{if(t.alive&&t.team==='red')arr.push(t)});jungleMonsters.forEach(j=>{if(j.alive)arr.push(j)})}
  else{allies.forEach(e=>{if(e.alive)arr.push(e)});if(player.alive)arr.push(player);minions.forEach(m=>{if(m.alive&&m.team==='blue')arr.push(m)});towers.forEach(t=>{if(t.alive&&t.team==='blue')arr.push(t)});jungleMonsters.forEach(j=>{if(j.alive)arr.push(j)})}
  return arr;
}
function getAllAllies(team){
  if(team==='blue'){const a=[...allies.filter(x=>x.alive)];if(player.alive)a.push(player);return a}
  return enemies.filter(x=>x.alive);
}
function addEffect(x,y,text,color,size){
  effects.push({type:'text',x,y,text,color,size:size||14,life:0.8,maxLife:0.8,vy:-40});
}
function addKillMsg(text,color){
  killMessages.push({text,color,time:3});
  const kf=document.getElementById('killFeed');
  const d=document.createElement('div');d.className='kill-msg';d.style.color=color;d.textContent=text;
  kf.appendChild(d);setTimeout(()=>d.remove(),3000);
}

// ============================================================
//  RECALL
// ============================================================
function startRecall(){
  if(!player||!player.alive||recalling)return;
  // Cek apakah dekat base
  if(dist(player,BLUE_BASE)>500){addEffect(player.x,player.y,'Terlalu jauh dari base!','var(--danger)',14);return}
  recalling=true;recallTimer=4;
}
function cancelRecall(){recalling=false;recallTimer=0}

// ============================================================
//  SURRENDER
// ============================================================
function trySurrender(){
  if(gameTime<300){addEffect(player.x,player.y,'Surrender tidak bisa sebelum 5 menit','var(--danger)',14);return}
  endGame(false);
}

// ============================================================
//  AI SYSTEM
// ============================================================
function updateAI(hero,dt){
  if(!hero.alive)return;
  if(hero.stunTimer>0)return;

  // Regen HP/MP sedikit di base
  const base=hero.team==='blue'?BLUE_BASE:RED_BASE;
  if(dist(hero,base)<200){hero.hp=Math.min(hero.hp+hero.maxHp*0.03*dt,hero.maxHp);hero.mp=Math.min(hero.mp+hero.maxMp*0.05*dt,hero.maxMp)}

  // Beli item jika gold cukup dan di base
  if(hero.gold>=800&&dist(hero,base)<200&&hero.items.length<6){
    const affordable=ITEMS.filter(it=>it.cost<=hero.gold).sort((a,b)=>b.cost-a.cost)[0];
    if(affordable){
      hero.gold-=affordable.cost;
      if(affordable.atk)hero.atk+=affordable.atk;if(affordable.mpow)hero.atk+=affordable.mpow*0.8;
      if(affordable.def)hero.def+=affordable.def;if(affordable.hp){hero.maxHp+=affordable.hp;hero.hp+=affordable.hp}
      if(affordable.mp){hero.maxMp+=affordable.mp;hero.mp+=affordable.mp}
      if(affordable.spd)hero.spd+=affordable.spd;if(affordable.crit)hero._crit=(hero._crit||0)+affordable.crit;
      if(affordable.steal)hero._steal=(hero._steal||0)+affordable.steal;
      hero.items.push(affordable);
    }
  }

  // Retreat ke base jika HP rendah
  if(hero.hp<hero.maxHp*0.2){
    moveToward(hero,base,dt);
    return;
  }

  if(hero.lane==='jungle'){
    updateJungleAI(hero,dt);return;
  }

  const waypoints=LANES[hero.lane][hero.team==='blue'?'blue':'red'];
  if(!waypoints||hero.waypointIdx>=waypoints.length){hero.waypointIdx=waypoints.length-1;return}

  // Cari musuh terdekat
  const nearEnemies=getAllEnemies(hero.team).filter(e=>e.alive&&dist(hero,e)<hero.atkRange+50);
  if(nearEnemies.length>0){
    let target=nearEnemies[0];nearEnemies.forEach(e=>{if(e.hp<target.hp)target=e});
    if(dist(hero,target)<=hero.atkRange){doAttack(hero,target)}
    else moveToward(hero,target,dt);
    // Gunakan skill jika tersedia
    if(hero.s1Cd<=0&&hero.mp>=hero.heroData.s1.cost&&dist(hero,target)<=hero.heroData.s1.range+30){
      hero.s1Cd=hero.heroData.s1.cd;hero.mp-=hero.heroData.s1.cost;
      dealDamage(hero,target,hero.heroData.s1.dmg+hero.level*15);
      if(hero.heroData.s1.fx==='stun')target.stunTimer=hero.heroData.s1.dur;
      effects.push({type:'aoe',x:target.x,y:target.y,radius:0,maxRadius:60,color:hero.heroData.color,life:0.3,maxLife:0.3});
    }
    if(hero.ultCd<=0&&hero.mp>=hero.heroData.ult.cost&&dist(hero,target)<=hero.heroData.ult.range+50&&hero.level>=4){
      hero.ultCd=hero.heroData.ult.cd;hero.mp-=hero.heroData.ult.cost;
      const r=hero.heroData.ult.radius||200;
      getAllEnemies(hero.team).forEach(e=>{if(dist(target,e)<=r){dealDamage(hero,e,hero.heroData.ult.dmg+hero.level*20);if(hero.heroData.ult.fx==='stun')e.stunTimer=hero.heroData.ult.dur}});
      effects.push({type:'aoe',x:target.x,y:target.y,radius:0,maxRadius:r,color:hero.heroData.color,life:0.6,maxLife:0.6});
    }
  }else{
    // Ikuti waypoint
    const wp=waypoints[hero.waypointIdx];
    if(dist(hero,wp)<50)hero.waypointIdx=Math.min(hero.waypointIdx+1,waypoints.length-1);
    moveToward(hero,wp,dt);
  }
}

function updateJungleAI(hero,dt){
  const base=hero.team==='blue'?BLUE_BASE:RED_BASE;
  // Cari monster jungle yang hidup dan dekat
  const camps=hero.team==='blue'?
    jungleMonsters.filter(j=>j.alive&&(j.team==='blue'||j.team==='neutral')):
    jungleMonsters.filter(j=>j.alive&&(j.team==='red'||j.team==='neutral'));
  if(camps.length>0){
    let camp=camps[0];camps.forEach(c=>{if(dist(hero,c)<dist(hero,camp))camp=camp});
    if(dist(hero,camp)<=hero.atkRange){
      doAttack(hero,camp);
      if(hero.s1Cd<=0&&hero.mp>=hero.heroData.s1.cost){
        hero.s1Cd=hero.heroData.s1.cd;hero.mp-=hero.heroData.s1.cost;
        dealDamage(hero,camp,hero.heroData.s1.dmg+hero.level*15);
      }
    }else moveToward(hero,camp,dt);
  }else{
    // Gank mid lane
    const midWp=LANES.mid[hero.team==='blue'?'blue':'red'];
    const wp=midWp[Math.min(2,midWp.length-1)];
    moveToward(hero,wp,dt);
    // Attack heroes yang ditemui
    const nearE=getAllEnemies(hero.team).filter(e=>e.alive&&dist(hero,e)<hero.atkRange+50);
    if(nearE.length>0){let t=nearE[0];nearE.forEach(e=>{if(e.hp<t.hp)t=e});if(dist(hero,t)<=hero.atkRange)doAttack(hero,t);else moveToward(hero,t,dt)}
  }
}

function moveToward(entity,target,dt){
  const a=angle(entity,target);
  let spd=entity.spd;
  if(entity.slowTimer>0)spd*=(1-entity.slowAmt);
  if(entity.buffSpdTimer>0)spd+=entity.buffSpd;
  entity.x+=Math.cos(a)*spd*dt;
  entity.y+=Math.sin(a)*spd*dt;
  entity.x=clamp(entity.x,20,MAP_W-20);
  entity.y=clamp(entity.y,20,MAP_H-20);
}

// ============================================================
//  MINION AI
// ============================================================
function updateMinion(m,dt){
  if(!m.alive||m.stunTimer>0)return;
  const waypoints=LANES[m.lane][m.team==='blue'?'blue':'red'];
  if(!waypoints)return;

  // Cari musuh terdekat
  const targets=m.team==='blue'?
    enemies.filter(e=>e.alive).concat(minions.filter(x=>x.alive&&x.team==='red')).concat(towers.filter(t=>t.alive&&t.team==='red')):
    allies.filter(e=>e.alive).concat(minions.filter(x=>x.alive&&x.team==='blue')).concat(towers.filter(t=>t.alive&&t.team==='blue')).concat([player].filter(p=>p.alive));

  const near=targets.filter(t=>dist(m,t)<m.atkRange+30);
  if(near.length>0){
    let t=near[0];near.forEach(e=>{if(e.hp<t.hp)t=e});
    if(dist(m,t)<=m.atkRange&&m.atkCd<=0){
      m.atkCd=1;dealDamage(m,t,m.atk);
    }
  }else{
    if(m.wpIdx>=waypoints.length)m.wpIdx=waypoints.length-1;
    const wp=waypoints[m.wpIdx];
    if(dist(m,wp)<40)m.wpIdx++;
    if(m.wpIdx<waypoints.length)moveToward(m,waypoints[m.wpIdx],dt);
  }
}

// ============================================================
//  TOWER AI
// ============================================================
function updateTower(t,dt){
  if(!t.alive)return;
  if(t.atkCd>0)return;
  // Target: minion dulu, lalu hero
  const targets=t.team==='blue'?
    minions.filter(m=>m.alive&&m.team==='red'&&dist(t,m)<=t.range).concat(enemies.filter(e=>e.alive&&dist(t,e)<=t.range)):
    minions.filter(m=>m.alive&&m.team==='blue'&&dist(t,m)<=t.range).concat(allies.filter(e=>e.alive&&dist(t,e)<=t.range)).concat(player.alive&&dist(t,player)<=t.range?[player]:[]);
  if(targets.length>0){
    const target=targets[0];
    dealDamage(t,target,t.atk);
    t.atkCd=1;
    projectiles.push({x:t.x,y:t.y,tx:target.x,ty:target.y,spd:700,dmg:0,team:t.team,owner:t,radius:5,color:t.team==='blue'?'#448aff':'#f44336',life:0.5,fx:'none',dur:0,visualOnly:true});
  }
}

// ============================================================
//  JUNGLE MONSTER AI
// ============================================================
function updateJungleMonster(m,dt){
  if(!m.alive)return;
  if(m.atkCd>0)return;
  // Serang hero yang menyerang (simplified: serang yang paling dekat)
  const allHeroes=[player,...allies,...enemies].filter(h=>h.alive&&dist(m,h)<150);
  if(allHeroes.length>0){
    let t=allHeroes[0];allHeroes.forEach(h=>{if(dist(m,h)<dist(m,t))t=h});
    dealDamage(m,t,m.atk);m.atkCd=1.5;
  }
}

// ============================================================
//  PROJECTILE UPDATE
// ============================================================
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    p.life-=dt;if(p.life<=0){projectiles.splice(i,1);continue}
    const a=Math.atan2(p.ty-p.y,p.tx-p.x);
    const spd=p.spd*dt;
    p.x+=Math.cos(a)*spd;p.y+=Math.sin(a)*spd;
    // Cek collision
    if(!p.visualOnly){
      const targets=getAllEnemies(p.team);
      for(const t of targets){
        if(!t.alive)continue;
        if(dist(p,t)<(t.radius||15)+p.radius){
          if(p.dmg>0)dealDamage(p.owner||p,t,p.dmg);
          if(p.fx==='stun'&&t.stunTimer!==undefined)t.stunTimer=p.dur;
          if(p.fx==='slow'&&t.slowTimer!==undefined){t.slowTimer=p.dur;t.slowAmt=0.4}
          projectiles.splice(i,1);break;
        }
      }
    }else{
      if(dist(p,{x:p.tx,y:p.ty})<20){projectiles.splice(i,1)}
    }
  }
}

// ============================================================
//  EFFECTS UPDATE
// ============================================================
function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];
    e.life-=dt;if(e.life<=0){effects.splice(i,1);continue}
    if(e.type==='text'){e.y+=e.vy*dt}
    if(e.type==='particle'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=0.95;e.vy*=0.95}
    if(e.type==='aoe'){e.radius=lerp(0,e.maxRadius,1-e.life/e.maxLife)}
  }
}

// ============================================================
//  MAIN UPDATE
// ============================================================
function update(dt){
  if(!gameActive)return;
  gameTime+=dt;
  minionTimer-=dt;
  if(minionTimer<=0){spawnMinions();minionTimer=30}
  mpRegenTimer+=dt;goldTimer+=dt;

  // Player movement
  if(player.alive&&player.stunTimer<=0){
    if(joyActive&&(joyDir.x!==0||joyDir.y!==0)){
      cancelRecall();
      const len=Math.hypot(joyDir.x,joyDir.y);
      let spd=player.spd;
      if(player.slowTimer>0)spd*=(1-player.slowAmt);
      if(player.buffSpdTimer>0)spd+=player.buffSpd;
      player.x+=(joyDir.x/len)*spd*dt;
      player.y+=(joyDir.y/len)*spd*dt;
      player.x=clamp(player.x,20,MAP_W-20);player.y=clamp(player.y,20,MAP_H-20);
    }
    // Auto attack target
    if(autoAttackTarget&&autoAttackTarget.alive&&dist(player,autoAttackTarget)<=player.atkRange+20&&player.atkCd<=0){
      doAttack(player,autoAttackTarget);
    }else if(autoAttackTarget&&(!autoAttackTarget.alive||dist(player,autoAttackTarget)>player.atkRange+100)){
      autoAttackTarget=null;
    }
    // Recall
    if(recalling){
      recallTimer-=dt;
      if(recallTimer<=0){
        player.x=BLUE_BASE.x+50;player.y=BLUE_BASE.y+50;
        player.hp=player.maxHp;player.mp=player.maxMp;
        recalling=false;
      }else if(joyActive){cancelRecall()}
    }
    // Regen MP
    if(mpRegenTimer>0.5){mpRegenTimer=0;player.mp=Math.min(player.mp+player.maxMp*0.02,player.maxMp)}
    // Passive gold
    if(goldTimer>1){goldTimer=0;player.gold+=4+player.level*0.5;playerStats.goldEarned+=4+player.level*0.5}
  }

  // Update semua hero
  const allHeroes=[player,...allies,...enemies];
  allHeroes.forEach(h=>{
    if(!h.alive){
      h.respawnTimer-=dt;
      if(h.respawnTimer<=0){
        h.alive=true;
        const base=h.team==='blue'?BLUE_BASE:RED_BASE;
        h.x=base.x+rnd(-40,40);h.y=base.y+rnd(-40,40);
        h.hp=h.maxHp;h.mp=h.maxMp;h.shield=0;h.stunTimer=0;h.slowTimer=0;
        if(h.isPlayer)addEffect(h.x,h.y,'Respawned!','var(--accent)',20);
      }
      return;
    }
    // Cooldowns
    if(h.s1Cd>0)h.s1Cd-=dt;if(h.s2Cd>0)h.s2Cd-=dt;if(h.ultCd>0)h.ultCd-=dt;
    if(h.atkCd>0)h.atkCd-=dt;
    if(h.stunTimer>0)h.stunTimer-=dt;
    if(h.slowTimer>0)h.slowTimer-=dt;
    if(h.shieldTimer>0){h.shieldTimer-=dt;if(h.shieldTimer<=0)h.shield=0}
    if(h.buffAtkTimer>0){h.buffAtkTimer-=dt;if(h.buffAtkTimer<=0)h.buffAtk=0}
    if(h.buffSpdTimer>0){h.buffSpdTimer-=dt;if(h.buffSpdTimer<=0)h.buffSpd=0}
    if(h.bleedTimer>0){h.bleedTimer-=dt;h.hp-=h.bleedDmg*dt;if(h.hp<=0)killEntity(h,{heroData:{name:'Bleed'}})}
    // AI
    if(!h.isPlayer)updateAI(h,dt);
  });

  // Minions
  minions.forEach(m=>{
    if(!m.alive)return;
    if(m.stunTimer>0){m.stunTimer-=dt;return}
    if(m.atkCd>0)m.atkCd-=dt;
    updateMinion(m,dt);
  });
  minions=minions.filter(m=>m.alive);

  // Towers
  towers.forEach(t=>{if(t.alive){if(t.atkCd>0)t.atkCd-=dt;updateTower(t,dt)}});

  // Jungle monsters
  jungleMonsters.forEach(m=>{
    if(!m.alive){m.respawnTimer-=dt;if(m.respawnTimer<=0){m.alive=true;m.hp=m.maxHp}return}
    if(m.atkCd>0)m.atkCd-=dt;
    updateJungleMonster(m,dt);
  });

  // Projectiles & Effects
  updateProjectiles(dt);
  updateEffects(dt);

  // Cek win/lose
  const blueBaseAlive=towers.filter(t=>t.team==='blue'&&t.lane==='base'&&t.alive).length;
  const redBaseAlive=towers.filter(t=>t.team==='red'&&t.lane==='base'&&t.alive).length;
  if(redBaseAlive===0)endGame(true);
  if(blueBaseAlive===0)endGame(false);

  // Camera
  if(player.alive){camera.x=lerp(camera.x,player.x,5*dt);camera.y=lerp(camera.y,player.y,5*dt)}

  updateHUD();
}

// ============================================================
//  RENDER
// ============================================================
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.scale(camera.zoom,camera.zoom);
  ctx.translate(-camera.x,-camera.y);

  // Terrain
  ctx.drawImage(mapCanvas,0,0);

  // Range attack player (halus)
  if(player.alive){
    ctx.beginPath();ctx.arc(player.x,player.y,player.atkRange,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.stroke();
  }

  // Tower range (jika dekat)
  towers.forEach(t=>{
    if(!t.alive)return;
    if(dist(player,t)<500){
      ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);
      ctx.strokeStyle=t.team==='blue'?'rgba(33,150,243,0.08)':'rgba(244,67,54,0.08)';ctx.lineWidth=1;ctx.stroke();
    }
  });

  // Jungle monsters
  jungleMonsters.forEach(m=>{
    if(!m.alive)return;
    const col=m.type==='blue_buff'?'#4488ff':m.type==='red_buff'?'#ff4444':m.type==='turtle'?'#ffb800':m.type==='lord'?'#e040fb':'#88aa44';
    ctx.beginPath();ctx.arc(m.x,m.y,m.type==='lord'?18:m.type==='turtle'?15:12,0,Math.PI*2);
    ctx.fillStyle=col+'33';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=col;ctx.font='bold 8px Rajdhani';ctx.textAlign='center';ctx.fillText(m.type.charAt(0).toUpperCase(),m.x,m.y+3);
    // HP bar
    drawHPBar(m.x,m.y-18,24,3,m.hp,m.maxHp,m.team==='neutral'?'#ffb800':m.team==='blue'?'#448aff':'#f44336');
  });

  // Towers
  towers.forEach(t=>{
    if(!t.alive)return;
    const col=t.team==='blue'?'#2196f3':'#f44336';
    const size=t.lane==='base'?22:18;
    // Base
    ctx.beginPath();ctx.arc(t.x,t.y,size,0,Math.PI*2);
    ctx.fillStyle=col+'22';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();
    // Inner
    ctx.beginPath();ctx.arc(t.x,t.y,size*0.5,0,Math.PI*2);
    ctx.fillStyle=col+'66';ctx.fill();
    // Turret top
    ctx.beginPath();ctx.arc(t.x,t.y-3,6,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    // HP bar
    drawHPBar(t.x,t.y-size-8,30,4,t.hp,t.maxHp,col);
  });

  // Minions
  minions.forEach(m=>{
    if(!m.alive)return;
    const col=m.team==='blue'?'#448aff':'#f44336';
    ctx.beginPath();ctx.arc(m.x,m.y,m.radius,0,Math.PI*2);
    ctx.fillStyle=col+'88';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
    drawHPBar(m.x,m.y-12,14,2,m.hp,m.maxHp,col);
  });

  // Heroes
  const allHeroes=[...allies,...enemies];
  if(player.alive)allHeroes.push(player);
  allHeroes.forEach(h=>{
    if(!h.alive)return;
    const col=h.heroData.color;
    const r=h.isPlayer?16:14;
    // Shadow
    ctx.beginPath();ctx.ellipse(h.x,h.y+r*0.6,r*0.8,r*0.3,0,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
    // Body
    ctx.beginPath();ctx.arc(h.x,h.y,r,0,Math.PI*2);
    const grad=ctx.createRadialGradient(h.x-3,h.y-3,0,h.x,h.y,r);
    grad.addColorStop(0,col);grad.addColorStop(1,col+'88');
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle=h.isPlayer?'#fff':col;ctx.lineWidth=h.isPlayer?2.5:1.5;ctx.stroke();
    // Symbol
    ctx.fillStyle='#fff';ctx.font=`bold ${r*0.9}px Rajdhani`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h.symbol,h.x,h.y+1);
    // Shield visual
    if(h.shield>0){
      ctx.beginPath();ctx.arc(h.x,h.y,r+4,0,Math.PI*2);
      ctx.strokeStyle='rgba(0,229,255,0.5)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
    }
    // Stun visual
    if(h.stunTimer>0){
      ctx.fillStyle='#ffd600';ctx.font='bold 10px sans-serif';ctx.fillText('*',h.x-6,h.y-r-4);ctx.fillText('*',h.x+6,h.y-r-4);
    }
    // HP bar
    const barW=h.isPlayer?36:28;
    drawHPBar(h.x,h.y-r-8,barW,4,h.hp,h.maxHp,h.team==='blue'?'#448aff':'#f44336');
    // Name
    if(!h.isPlayer&&dist(player,h)<400){
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 8px Rajdhani';ctx.textAlign='center';
      ctx.fillText(h.heroData.name,h.x,h.y+r+12);
    }
    // Level
    ctx.fillStyle='#000';ctx.font='bold 7px Rajdhani';ctx.textAlign='center';
    ctx.beginPath();ctx.arc(h.x+r*0.7,h.y+r*0.5,6,0,Math.PI*2);ctx.fillStyle=h.team==='blue'?'#1565c0':'#c62828';ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(h.level,h.x+r*0.7,h.y+r*0.5+2.5);
  });

  // Player indicator
  if(player.alive){
    ctx.beginPath();ctx.arc(player.x,player.y-22,3,0,Math.PI*2);
    ctx.fillStyle='var(--accent)';ctx.fill();
    // Recall indicator
    if(recalling){
      ctx.beginPath();ctx.arc(player.x,player.y,20,-Math.PI/2,-Math.PI/2+(1-recallTimer/4)*Math.PI*2);
      ctx.strokeStyle='#00e5ff';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#00e5ff';ctx.font='bold 9px Rajdhani';ctx.textAlign='center';
      ctx.fillText('RECALL '+Math.ceil(recallTimer),player.x,player.y-30);
    }
  }

  // Projectiles
  projectiles.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.fill();
    // Trail
    ctx.beginPath();ctx.arc(p.x,p.y,p.radius+3,0,Math.PI*2);
    ctx.fillStyle=p.color+'33';ctx.fill();
  });

  // Effects
  effects.forEach(e=>{
    const alpha=clamp(e.life/e.maxLife,0,1);
    if(e.type==='text'){
      ctx.globalAlpha=alpha;ctx.fillStyle=e.color;ctx.font=`bold ${e.size}px Rajdhani`;ctx.textAlign='center';
      ctx.fillText(e.text,e.x,e.y);ctx.globalAlpha=1;
    }else if(e.type==='aoe'){
      ctx.beginPath();ctx.arc(e.x,e.y,Math.max(1,e.radius),0,Math.PI*2);
      ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.globalAlpha=alpha*0.6;ctx.stroke();
      ctx.fillStyle=e.color+'11';ctx.globalAlpha=alpha*0.2;ctx.fill();ctx.globalAlpha=1;
    }else if(e.type==='particle'){
      ctx.beginPath();ctx.arc(e.x,e.y,Math.max(0.5,e.radius*alpha),0,Math.PI*2);
      ctx.fillStyle=e.color;ctx.globalAlpha=alpha;ctx.fill();ctx.globalAlpha=1;
    }else if(e.type==='trail'){
      ctx.beginPath();ctx.arc(e.x,e.y,Math.max(0.5,e.radius*alpha),0,Math.PI*2);
      ctx.fillStyle=e.color;ctx.globalAlpha=alpha*0.5;ctx.fill();ctx.globalAlpha=1;
    }else if(e.type==='slash'){
      ctx.beginPath();ctx.arc(e.x,e.y,e.size*alpha,0,Math.PI*1.2);
      ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.globalAlpha=alpha;ctx.stroke();ctx.globalAlpha=1;
    }else if(e.type==='shield'){
      ctx.beginPath();ctx.arc(e.x,e.y,e.size*(1.2-alpha*0.4),0,Math.PI*2);
      ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.globalAlpha=alpha*0.6;ctx.stroke();ctx.globalAlpha=1;
    }else if(e.type==='buff'){
      for(let i=0;i<3;i++){
        const a=gameTime*3+i*Math.PI*2/3;
        ctx.beginPath();ctx.arc(e.x+Math.cos(a)*e.size*0.6,e.y+Math.sin(a)*e.size*0.6,3*alpha,0,Math.PI*2);
        ctx.fillStyle=e.color;ctx.globalAlpha=alpha;ctx.fill();
      }ctx.globalAlpha=1;
    }
  });

  // Fog of war (simplified - gelap di area jauh dari player & allies)
  const fogCanvas=document.createElement('canvas');fogCanvas.width=MAP_W;fogCanvas.height=MAP_H;
  const fctx=fogCanvas.getContext('2d');
  fctx.fillStyle='rgba(0,0,0,0.55)';fctx.fillRect(0,0,MAP_W,MAP_H);
  fctx.globalCompositeOperation='destination-out';
  const visionRadius=350;
  [player,...allies].forEach(h=>{
    if(!h.alive)return;
    const g=fctx.createRadialGradient(h.x,h.y,0,h.x,h.y,visionRadius);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.7,'rgba(0,0,0,0.8)');g.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle=g;fctx.beginPath();fctx.arc(h.x,h.y,visionRadius,0,Math.PI*2);fctx.fill();
  });
  // Tower vision
  towers.filter(t=>t.alive&&t.team==='blue').forEach(t=>{
    const g=fctx.createRadialGradient(t.x,t.y,0,t.x,t.y,t.range);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.8,'rgba(0,0,0,0.5)');g.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle=g;fctx.beginPath();fctx.arc(t.x,t.y,t.range,0,Math.PI*2);fctx.fill();
  });
  ctx.drawImage(fogCanvas,0,0);

  ctx.restore();

  // Minimap
  renderMinimap();
}

function drawHPBar(x,y,w,h,hp,maxHp,color){
  const bx=x-w/2;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.fillRect(bx-1,y-1,w+2,h+2);
  ctx.fillStyle='#333';ctx.fillRect(bx,y,w,h);
  const pct=clamp(hp/maxHp,0,1);
  ctx.fillStyle=pct>0.5?color:pct>0.25?'#ff9800':'#f44336';
  ctx.fillRect(bx,y,w*pct,h);
}

function renderMinimap(){
  const mw=mmCanvas.width,mh=mmCanvas.height;
  const sx=mw/MAP_W,sy=mh/MAP_H;
  mmCtx.fillStyle='#0a120a';mmCtx.fillRect(0,0,mw,mh);

  // Lane paths
  mmCtx.strokeStyle='#1a2a1a';mmCtx.lineWidth=2;
  ['top','mid','bot'].forEach(l=>{
    const wp=LANES[l].blue;mmCtx.beginPath();mmCtx.moveTo(wp[0][0]*sx,wp[0][1]*sy);
    for(let i=1;i<wp.length;i++)mmCtx.lineTo(wp[i][0]*sx,wp[i][1]*sy);mmCtx.stroke();
  });

  // Towers
  towers.forEach(t=>{
    if(!t.alive)return;
    mmCtx.fillStyle=t.team==='blue'?'#2196f3':'#f44336';
    mmCtx.fillRect(t.x*sx-2,t.y*sy-2,4,4);
  });

  // Bases
  mmCtx.fillStyle='#2196f3';mmCtx.beginPath();mmCtx.arc(BLUE_BASE.x*sx,BLUE_BASE.y*sy,4,0,Math.PI*2);mmCtx.fill();
  mmCtx.fillStyle='#f44336';mmCtx.beginPath();mmCtx.arc(RED_BASE.x*sx,RED_BASE.y*sy,4,0,Math.PI*2);mmCtx.fill();

  // Minions (tiny dots)
  minions.forEach(m=>{
    if(!m.alive)return;
    mmCtx.fillStyle=m.team==='blue'?'rgba(33,150,243,0.5)':'rgba(244,67,54,0.5)';
    mmCtx.fillRect(m.x*sx-0.5,m.y*sy-0.5,1,1);
  });

  // Heroes
  const visibleHeroes=[player,...allies,...enemies].filter(h=>h.alive);
  visibleHeroes.forEach(h=>{
    // Hanya tampilkan hero musuh jika dalam visi
    if(h.team==='red'){
      const inVision=[player,...allies].some(a=>a.alive&&dist(a,h)<350);
      const inTowerVision=towers.some(t=>t.alive&&t.team==='blue'&&dist(t,h)<t.range);
      if(!inVision&&!inTowerVision)return;
    }
    mmCtx.fillStyle=h.heroData.color;
    mmCtx.beginPath();mmCtx.arc(h.x*sx,h.y*sy,h.isPlayer?3.5:2.5,0,Math.PI*2);mmCtx.fill();
    if(h.isPlayer){mmCtx.strokeStyle='#fff';mmCtx.lineWidth=1;mmCtx.stroke()}
  });

  // Camera viewport
  const vw=canvas.width/camera.zoom*sx,vh=canvas.height/camera.zoom*sy;
  mmCtx.strokeStyle='rgba(255,255,255,0.3)';mmCtx.lineWidth=1;
  mmCtx.strokeRect(camera.x*sx-vw/2,camera.y*sy-vh/2,vw,vh);
}

// ============================================================
//  GAME LOOP
// ============================================================
function gameLoop(now){
  if(!gameActive)return;
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;
  update(dt);render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
//  END GAME
// ============================================================
function endGame(win){
  gameActive=false;
  showScreen('screen-results');
  const rt=document.getElementById('resultTitle');
  rt.textContent=win?'VICTORY':'DEFEAT';
  rt.className='result-title '+(win?'win':'lose');
  // Cari MVP (kill tertinggi)
  let mvpName=player.heroData.name;
  let mvpKills=playerStats.kills;
  allies.forEach(a=>{const k=Math.floor(a.gold/300);if(k>mvpKills){mvpKills=k;mvpName=a.heroData.name}});
  document.getElementById('resultMVP').innerHTML='<i class="fas fa-crown"></i> MVP: '+mvpName;
  const m=Math.floor(gameTime/60),s=Math.floor(gameTime%60);
  document.getElementById('resultStats').innerHTML=`
    <div class="result-stat"><div class="rs-val">${playerStats.kills}</div><div class="rs-label">Kills</div></div>
    <div class="result-stat"><div class="rs-val">${playerStats.deaths}</div><div class="rs-label">Deaths</div></div>
    <div class="result-stat"><div class="rs-val">${playerStats.assists}</div><div class="rs-label">Assists</div></div>
    <div class="result-stat"><div class="rs-val">${Math.floor(playerStats.damage)}</div><div class="rs-label">Total Damage</div></div>
    <div class="result-stat"><div class="rs-val">${Math.floor(playerStats.goldEarned)}</div><div class="rs-label">Gold Earned</div></div>
    <div class="result-stat"><div class="rs-val">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><div class="rs-label">Duration</div></div>
  `;
}

function backToMenu(){
  showScreen('screen-menu');
  initMenuParticles();
}

// ============================================================
//  INPUT: JOYSTICK
// ============================================================
(function(){
  const area=document.getElementById('joystickArea');
  const base=document.getElementById('joyBase');
  const stick=document.getElementById('joyStick');
  const maxR=40;

  function getCenter(){
    const r=base.getBoundingClientRect();
    return{x:r.left+r.width/2,y:r.top+r.height/2};
  }

  function handleMove(cx,cy){
    const c=getCenter();
    let dx=cx-c.x,dy=cy-c.y;
    const d=Math.hypot(dx,dy);
    if(d>maxR){dx=dx/d*maxR;dy=dy/d*maxR}
    stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joyDir.x=dx/maxR;joyDir.y=dy/maxR;
    joyActive=true;
  }
  function handleEnd(){
    stick.style.transform='translate(-50%,-50%)';
    joyDir.x=0;joyDir.y=0;joyActive=false;joyTouchId=null;
  }

  area.addEventListener('pointerdown',e=>{
    e.preventDefault();joyTouchId=e.pointerId;area.setPointerCapture(e.pointerId);handleMove(e.clientX,e.clientY);
  });
  area.addEventListener('pointermove',e=>{if(e.pointerId===joyTouchId){e.preventDefault();handleMove(e.clientX,e.clientY)}});
  area.addEventListener('pointerup',e=>{if(e.pointerId===joyTouchId)handleEnd()});
  area.addEventListener('pointercancel',e=>{if(e.pointerId===joyTouchId)handleEnd()});
})();

// ============================================================
//  INPUT: MINIMAP CLICK (ping sederhana)
// ============================================================
document.getElementById('minimap').addEventListener('click',e=>{
  if(!gameActive||!player.alive)return;
  const r=e.target.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*MAP_W;
  const my=(e.clientY-r.top)/r.height*MAP_H;
  addEffect(mx,my,'PING!','#00e5ff',16);
});

// ============================================================
//  INPUT: KEYBOARD (untuk desktop)
// ============================================================
document.addEventListener('keydown',e=>{
  if(!gameActive||!player||!player.alive)return;
  if(e.key==='1')useSkill('s1Cd',player.heroData.s1);
  if(e.key==='2')useSkill('s2Cd',player.heroData.s2);
  if(e.key==='3')useSkill('ultCd',player.heroData.ult);
  if(e.key==='a'||e.key===' ')playerAttackNearest();
  if(e.key==='b')startRecall();
  if(e.key==='p')toggleShop();
});
// WASD movement via keyboard
const keys={};
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
// Override joystick with keyboard
const origUpdate=update;
update=function(dt){
  if(keys['w']||keys['arrowup']){joyDir.y=-1;joyActive=true}
  else if(keys['s']||keys['arrowdown']){joyDir.y=1;joyActive=true}
  else if(!joyTouchId){joyDir.y=0;if(!keys['a']&&!keys['d']&&!keys['arrowleft']&&!keys['arrowright'])joyActive=false}
  if(keys['a']||keys['arrowleft']){joyDir.x=-1;joyActive=true}
  else if(keys['d']||keys['arrowright']){joyDir.x=1;joyActive=true}
  else if(!joyTouchId)joyDir.x=0;
  origUpdate(dt);
};
</script>
