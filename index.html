<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Legends of Valor</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#080c14;--bg2:#0f1524;--card:#141c30;--border:#1c2a48;--accent:#00e5ff;--accent2:#ffb800;--danger:#ff2d55;--success:#00e676;--blue:#42a5f5;--red:#ef5350;--text:#e4eaf4;--dim:#5a6d8a;--font1:'Rajdhani',sans-serif;--font2:'Exo 2',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font2);overflow:hidden;height:100vh;width:100vw;user-select:none;touch-action:none}
.screen{display:none;position:absolute;inset:0;z-index:1}.screen.active{display:flex}
#screen-menu{flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
#menuCanvas{position:absolute;inset:0;z-index:0}
.menu-content{position:relative;z-index:2;text-align:center;padding:20px}
.menu-logo{font-family:var(--font1);font-size:clamp(2rem,6vw,4.2rem);font-weight:700;letter-spacing:3px;background:linear-gradient(135deg,var(--accent),#00ffaa,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(0,229,255,.25))}
.menu-sub{font-family:var(--font2);font-size:clamp(.65rem,1.6vw,.9rem);color:var(--dim);letter-spacing:6px;text-transform:uppercase;margin:4px 0 36px}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(300px,80vw);margin:0 auto}
.menu-btn{background:linear-gradient(135deg,rgba(0,229,255,.07),rgba(0,229,255,.02));border:1px solid rgba(0,229,255,.18);color:var(--text);font-family:var(--font1);font-size:1.05rem;font-weight:600;padding:13px 20px;border-radius:8px;cursor:pointer;transition:all .25s;letter-spacing:1px}
.menu-btn:hover,.menu-btn:active{background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(0,229,255,.05));border-color:var(--accent);transform:scale(1.03);box-shadow:0 0 20px rgba(0,229,255,.12)}
.menu-btn i{margin-right:10px;color:var(--accent)}
.menu-rank{margin-top:28px;display:flex;align-items:center;gap:12px;justify-content:center}
.rank-badge{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:var(--accent2);background:rgba(255,184,0,.07)}
.rank-info{text-align:left}.rank-name{font-family:var(--font1);font-weight:700;color:var(--accent2);font-size:.95rem}.rank-stars{color:var(--dim);font-size:.7rem}
.menu-ver{position:absolute;bottom:10px;right:14px;font-size:.6rem;color:var(--dim);z-index:2}
#screen-heropick{flex-direction:column;background:var(--bg)}
.hp-top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--border);min-height:48px;flex-shrink:0}
.hp-team{display:flex;gap:3px}.hp-slot{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.55rem;color:var(--dim);font-family:var(--font1);font-weight:700}
.hp-slot.filled{border-color:var(--accent);color:var(--accent)}
.hp-vs{font-family:var(--font1);font-weight:700;font-size:1rem;color:var(--accent2)}
.hp-body{display:flex;flex:1;overflow:hidden}
.hp-filters{display:flex;gap:3px;padding:4px 8px;flex-shrink:0;flex-wrap:wrap;background:var(--bg2);border-bottom:1px solid var(--border)}
.hp-filter{padding:3px 9px;border-radius:16px;font-size:.65rem;font-family:var(--font1);font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--dim);cursor:pointer;transition:all .2s}
.hp-filter.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.07)}
.hp-grid{flex:1;padding:6px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.hp-hero-card{width:56px;height:68px;border-radius:7px;border:2px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.hp-hero-card:hover{border-color:var(--dim)}.hp-hero-card.selected{border-color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.18)}
.hc-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.hc-name{font-size:.45rem;font-family:var(--font1);font-weight:600;text-align:center;line-height:1.1}.hc-role{font-size:.4rem;color:var(--dim)}
.hp-detail{width:260px;background:var(--bg2);border-left:1px solid var(--border);padding:10px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.hd-portrait{width:100%;aspect-ratio:16/9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2.8rem;position:relative;overflow:hidden}
.hd-portrait::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.65))}
.hd-name{font-family:var(--font1);font-weight:700;font-size:1.1rem}.hd-role{font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:2px}
.hd-stats{display:flex;flex-direction:column;gap:3px}
.hd-stat{display:flex;align-items:center;gap:5px;font-size:.65rem}
.hd-stat label{width:28px;color:var(--dim);font-family:var(--font1);font-weight:600}
.hd-stat .bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.hd-stat .bar div{height:100%;border-radius:2px}
.hd-skills{display:flex;flex-direction:column;gap:5px}
.hd-skill{background:var(--card);border-radius:5px;padding:5px 7px;border:1px solid var(--border)}
.hd-skill-name{font-family:var(--font1);font-weight:600;font-size:.72rem;color:var(--accent)}
.hd-skill-desc{font-size:.58rem;color:var(--dim);margin-top:1px}
.hd-passive{border-color:rgba(255,184,0,.25)}.hd-passive .hd-skill-name{color:var(--accent2)}
.hp-bottom{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.hp-sel{display:flex;flex-direction:column;gap:1px}
.hp-sel label{font-size:.5rem;color:var(--dim);font-family:var(--font1);font-weight:600;text-transform:uppercase}
.hp-sel select{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:var(--font2);font-size:.7rem;padding:3px 6px;border-radius:4px;min-width:100px}
.hp-lockin{margin-left:auto;padding:9px 24px;background:linear-gradient(135deg,var(--accent),#00b8d4);border:none;border-radius:8px;color:#000;font-family:var(--font1);font-weight:700;font-size:.95rem;cursor:pointer;letter-spacing:1px;transition:all .2s}
.hp-lockin:hover{transform:scale(1.05);box-shadow:0 0 18px rgba(0,229,255,.25)}
#screen-loading{flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:16px}
.loading-bar{width:220px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.loading-bar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s}
.loading-text{font-family:var(--font1);font-size:.85rem;color:var(--dim)}
.loading-tip{font-size:.65rem;color:var(--dim);max-width:280px;text-align:center;font-style:italic}
#screen-game{position:relative}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;background:#0a150a}
.hud{position:absolute;inset:0;z-index:10;pointer-events:none}.hud>*{pointer-events:auto}
.hud-top{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 14px;background:rgba(8,12,20,.88);border-radius:0 0 10px 10px;border:1px solid var(--border);border-top:none}
.hud-score{font-family:var(--font1);font-weight:700;font-size:1.15rem;letter-spacing:1px}
.hud-score .blue{color:var(--blue)}.hud-score .red{color:var(--red)}
.hud-timer{font-family:var(--font1);font-weight:600;font-size:.85rem;color:var(--dim);min-width:42px;text-align:center}
.hud-minimap{position:absolute;top:6px;left:6px;border:1px solid rgba(0,229,255,.2);border-radius:5px;overflow:hidden;background:rgba(8,12,20,.85)}
.hud-gold{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.hud-gold-val{font-family:var(--font1);font-weight:700;font-size:1rem;color:var(--accent2)}
.hud-gold-rate{font-size:.55rem;color:var(--dim)}
.hud-level{position:absolute;top:44px;right:6px;display:flex;align-items:center;gap:5px}
.hud-lvl-num{font-family:var(--font1);font-weight:700;font-size:1.2rem;color:var(--accent)}
.hud-xp-bar{width:70px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.hud-xp-bar div{height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
.hud-bars{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);width:min(260px,55vw);display:flex;flex-direction:column;gap:2px}
.hud-bar{height:9px;background:rgba(0,0,0,.65);border-radius:4px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.06)}
.hud-bar div{height:100%;border-radius:4px;transition:width .12s}
.hud-bar.hp div{background:linear-gradient(90deg,#00c853,#69f0ae)}
.hud-bar.mp div{background:linear-gradient(90deg,#2979ff,#64b5f6)}
.hud-bar span{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:.5rem;font-family:var(--font1);font-weight:600;color:#fff;text-shadow:0 1px 2px #000}
.hud-skills{position:absolute;bottom:16px;right:10px;display:flex;gap:7px;align-items:flex-end}
.skill-btn{width:48px;height:48px;border-radius:10px;border:2px solid var(--border);background:rgba(20,28,48,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s}
.skill-btn:active{transform:scale(.88)}
.skill-btn .sk-key{position:absolute;top:1px;left:3px;font-size:.45rem;font-family:var(--font1);font-weight:700;color:var(--dim)}
.skill-btn .sk-icon{font-size:1.1rem}
.skill-btn.ult{width:56px;height:56px;border-radius:12px;border-color:rgba(255,184,0,.4)}
.skill-btn .cd-overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;font-family:var(--font1);font-weight:700;font-size:.85rem;color:#fff}
.skill-btn .mp-cost{position:absolute;bottom:0;right:2px;font-size:.4rem;color:var(--blue)}
.skill-btn.atk-btn{border-color:rgba(255,255,255,.12);width:44px;height:44px}
.hud-joystick{position:absolute;bottom:16px;left:10px;width:110px;height:110px}
.joy-base{width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.08);position:relative}
.joy-stick{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.35),rgba(0,229,255,.12));border:2px solid rgba(0,229,255,.35);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.hud-items{position:absolute;bottom:115px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.item-slot{width:32px;height:32px;border-radius:5px;border:1px solid var(--border);background:rgba(20,28,48,.9);display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--dim);cursor:pointer;font-family:var(--font1);font-weight:600}
.item-slot.has-item{border-color:rgba(0,229,255,.25);color:var(--accent);background:rgba(0,229,255,.05)}
.hud-shop-btn{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);padding:3px 12px;border-radius:10px;background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.25);color:var(--accent2);font-family:var(--font1);font-weight:600;font-size:.6rem;cursor:pointer;white-space:nowrap}
.hud-recall{position:absolute;bottom:76px;left:10px;padding:3px 8px;border-radius:6px;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.15);color:var(--accent);font-family:var(--font1);font-weight:600;font-size:.55rem;cursor:pointer;white-space:nowrap}
.hud-kills{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.kill-msg{padding:2px 10px;background:rgba(0,0,0,.75);border-radius:3px;font-size:.6rem;font-family:var(--font1);font-weight:600;white-space:nowrap;animation:kf 3s forwards}
@keyframes kf{0%{opacity:1;transform:translateY(0)}70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.hud-surrender{position:absolute;top:44px;right:6px;padding:3px 8px;border-radius:5px;background:rgba(255,45,85,.08);border:1px solid rgba(255,45,85,.2);color:var(--danger);font-family:var(--font1);font-weight:600;font-size:.55rem;cursor:pointer}
.shop-overlay{display:none;position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.82);align-items:center;justify-content:center}
.shop-overlay.open{display:flex}
.shop-panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;width:min(560px,90vw);max-height:78vh;overflow:hidden;display:flex;flex-direction:column}
.shop-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border)}
.shop-header h3{font-family:var(--font1);font-weight:700;font-size:1rem}
.shop-gold{font-family:var(--font1);font-weight:700;color:var(--accent2);font-size:.9rem}
.shop-close{background:none;border:none;color:var(--dim);font-size:1.1rem;cursor:pointer;padding:4px}
.shop-cats{display:flex;gap:3px;padding:6px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.shop-cat{padding:2px 8px;border-radius:10px;font-size:.6rem;font-family:var(--font1);font-weight:600;border:1px solid var(--border);color:var(--dim);cursor:pointer;background:var(--card)}
.shop-cat.active{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.06)}
.shop-items{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px;overflow-y:auto;flex:1}
.shop-item{width:120px;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s}
.shop-item:hover{border-color:var(--accent)}.shop-item.cant-afford{opacity:.35}
.shop-item-name{font-family:var(--font1);font-weight:600;font-size:.68rem;margin-bottom:1px}
.shop-item-stats{font-size:.5rem;color:var(--dim);margin-bottom:3px;line-height:1.3}
.shop-item-cost{font-family:var(--font1);font-weight:700;font-size:.72rem;color:var(--accent2)}
.shop-item .buy-btn{margin-top:3px;width:100%;padding:2px;border-radius:3px;border:none;background:var(--accent);color:#000;font-family:var(--font1);font-weight:700;font-size:.6rem;cursor:pointer}
.shop-item .buy-btn:disabled{background:var(--border);color:var(--dim);cursor:not-allowed}
#screen-results{flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,20,.96);gap:16px}
.result-title{font-family:var(--font1);font-size:clamp(1.8rem,5vw,3.5rem);font-weight:700;letter-spacing:3px}
.result-title.win{background:linear-gradient(135deg,var(--accent2),#ff9100);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-title.lose{background:linear-gradient(135deg,var(--danger),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.result-stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px}
.result-stat .rs-val{font-family:var(--font1);font-weight:700;font-size:1.5rem;color:var(--accent)}
.result-stat .rs-label{font-size:.65rem;color:var(--dim);margin-top:1px}
.result-mvp{font-family:var(--font1);font-size:.9rem;color:var(--accent2);font-weight:600}
.result-btn{padding:10px 32px;background:linear-gradient(135deg,var(--accent),#00b8d4);border:none;border-radius:8px;color:#000;font-family:var(--font1);font-weight:700;font-size:.95rem;cursor:pointer;letter-spacing:1px;transition:all .2s;margin-top:8px}
.result-btn:hover{transform:scale(1.05);box-shadow:0 0 18px rgba(0,229,255,.25)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="screen-menu" class="screen active">
  <canvas id="menuCanvas"></canvas>
  <div class="menu-content">
    <div class="menu-logo">LEGENDS OF VALOR</div>
    <div class="menu-sub">Conquer the Battlefield</div>
    <div class="menu-btns">
      <button class="menu-btn" onclick="startMode('classic')"><i class="fas fa-gamepad"></i>Classic</button>
      <button class="menu-btn" onclick="startMode('ranked')"><i class="fas fa-trophy"></i>Ranked</button>
      <button class="menu-btn" onclick="startMode('custom')"><i class="fas fa-users"></i>Custom Room</button>
      <button class="menu-btn" onclick="startMode('training')"><i class="fas fa-robot"></i>AI Training</button>
    </div>
    <div class="menu-rank">
      <div class="rank-badge"><i class="fas fa-shield-halved"></i></div>
      <div class="rank-info"><div class="rank-name">Grandmaster</div><div class="rank-stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i></div></div>
    </div>
  </div>
  <div class="menu-ver">v1.0.0</div>
</div>
<div id="screen-heropick" class="screen">
  <div class="hp-top"><div class="hp-team" id="blueTeam"></div><div class="hp-vs">VS</div><div class="hp-team" id="redTeam"></div></div>
  <div class="hp-filters" id="heroFilters"></div>
  <div class="hp-body"><div class="hp-grid" id="heroGrid"></div><div class="hp-detail" id="heroDetail"><div style="color:var(--dim);text-align:center;padding:40px 0;font-size:.75rem">Pilih hero untuk melihat detail</div></div></div>
  <div class="hp-bottom">
    <div class="hp-sel"><label>Spell</label><select id="selSpell"></select></div>
    <div class="hp-sel"><label>Emblem</label><select id="selEmblem"></select></div>
    <button class="hp-lockin" onclick="lockIn()">LOCK IN</button>
  </div>
</div>
<div id="screen-loading" class="screen">
  <div class="loading-bar"><div id="loadBar"></div></div>
  <div class="loading-text" id="loadText">Memprepare pertandingan...</div>
  <div class="loading-tip" id="loadTip">Tips: Last hit minion untuk bonus gold ekstra.</div>
</div>
<div id="screen-game" class="screen">
  <canvas id="gameCanvas"></canvas>
  <div class="hud">
    <div class="hud-top"><span class="hud-score"><span class="blue" id="blueKills">0</span> : <span class="red" id="redKills">0</span></span><span class="hud-timer" id="gameTimer">00:00</span></div>
    <canvas class="hud-minimap" id="minimap" width="130" height="130"></canvas>
    <div class="hud-gold"><div class="hud-gold-val"><i class="fas fa-coins" style="font-size:.7rem"></i> <span id="goldVal">500</span></div><div class="hud-gold-rate">+<span id="goldRate">4.0</span>/s</div></div>
    <div class="hud-level"><span class="hud-lvl-num" id="lvlNum">1</span><div class="hud-xp-bar"><div id="xpBar" style="width:0%"></div></div></div>
    <div class="hud-bars"><div class="hud-bar hp"><div id="hpBar" style="width:100%"></div><span id="hpText"></span></div><div class="hud-bar mp"><div id="mpBar" style="width:100%"></div><span id="mpText"></span></div></div>
    <div class="hud-items" id="hudItems"></div>
    <div class="hud-shop-btn" onclick="toggleShop()"><i class="fas fa-store"></i> SHOP</div>
    <div class="hud-recall" onclick="startRecall()"><i class="fas fa-rotate-left"></i> RECALL</div>
    <div class="hud-skills" id="hudSkills"></div>
    <div class="hud-joystick" id="joystickArea"><div class="joy-base" id="joyBase"><div class="joy-stick" id="joyStick"></div></div></div>
    <div class="hud-kills" id="killFeed"></div>
    <div class="hud-surrender" onclick="trySurrender()">SURRENDER</div>
  </div>
  <div class="shop-overlay" id="shopOverlay"><div class="shop-panel"><div class="shop-header"><h3>Item Shop</h3><span class="shop-gold"><i class="fas fa-coins"></i> <span id="shopGold">0</span></span><button class="shop-close" onclick="toggleShop()"><i class="fas fa-xmark"></i></button></div><div class="shop-cats" id="shopCats"></div><div class="shop-items" id="shopItems"></div></div></div>
</div>
<div id="screen-results" class="screen">
  <div class="result-title" id="resultTitle">VICTORY</div>
  <div class="result-mvp" id="resultMVP"></div>
  <div class="result-stats" id="resultStats"></div>
  <button class="result-btn" onclick="backToMenu()">MAIN MENU</button>
</div>

<script>
/* ================================================================

let mParts=[];
function initMenu(){
  const c=document.getElementById('menuCanvas');c.width=innerWidth;c.height=innerHeight;
  const cx=c.getContext('2d');mParts=[];
  for(let i=0;i<70;i++)mParts.push({x:rnd(0,c.width),y:rnd(0,c.height),vx:rnd(-.25,.25),vy:rnd(-.4,-.08),r:rnd(1,2.5),a:rnd(.08,.4),c:Math.random()>.5?'0,229,255':'255,184,0'});
  (function anim(){
    if(!document.getElementById('screen-menu').classList.contains('active'))return;
    cx.clearRect(0,0,c.width,c.height);
    const g=cx.createRadialGradient(c.width/2,c.height*.38,0,c.width/2,c.height*.38,c.width*.6);
    g.addColorStop(0,'rgba(0,229,255,0.035)');g.addColorStop(1,'transparent');
    cx.fillStyle=g;cx.fillRect(0,0,c.width,c.height);
    mParts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=c.height+5;p.x=rnd(0,c.width)}cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=`rgba(${p.c},${p.a})`;cx.fill()});
    requestAnimationFrame(anim);
  })();
}
window.addEventListener('resize',()=>{
  const mc=document.getElementById('menuCanvas');if(mc){mc.width=innerWidth;mc.height=innerHeight}
  if(cvs){cvs.width=innerWidth;cvs.height=innerHeight;cam.z=Math.min(cvs.width,cvs.height)/850}
});

function filtH(role){
  const g=document.getElementById('heroGrid');g.innerHTML='';
  HEROES.filter(h=>role==='All'||h.role===role).forEach(h=>{
    const c=document.createElement('div');c.className='hp-hero-card'+(selHero&&selHero.id===h.id?' selected':'');
    c.innerHTML=`<div class="hc-icon" style="background:${h.color}22;border:2px solid ${h.color};color:${h.color}">${h.symbol}</div><div class="hc-name">${h.name}</div><div class="hc-role">${h.role}</div>`;
    c.onclick=()=>{selHero=h;filtH(role);showHD(h)};g.appendChild(c);
  });
}

function lockIn(){
  if(!selHero)return;
  const sl=document.getElementById('blueTeam_0');if(sl){sl.classList.add('filled');sl.textContent=selHero.symbol;sl.style.color=selHero.color}
  const used=HEROES.map(h=>h.id).filter(id=>id!==selHero.id).sort(()=>Math.random()-.5);
  for(let i=1;i<5;i++){const s=document.getElementById('blueTeam_'+i);const h=HEROES.find(x=>x.id===used[i-1]);if(s&&h){s.classList.add('filled');s.textContent=h.symbol;s.style.color=h.color}}
  for(let i=0;i<5;i++){const s=document.getElementById('redTeam_'+i);const h=HEROES.find(x=>x.id===used[i+4]);if(s&&h){s.classList.add('filled');s.textContent=h.symbol;s.style.color=h.color}}
  showScr('screen-loading');
  let prog=0;
  const tips=['Gunakan Fog of War untuk menghindari ambush.','Last hit minion untuk gold bonus.','Tank harus memimpin saat team fight.','Jangan push lane tanpa visibilitas.','Assassin flanking sangat efektif.'];
  document.getElementById('loadTip').textContent='Tips: '+tips[~~(Math.random()*tips.length)];
  const iv=setInterval(()=>{prog+=rnd(4,10);if(prog>100)prog=100;document.getElementById('loadBar').style.width=prog+'%';document.getElementById('loadText').textContent=['Memprepare peta...','Memuat hero...','Menginisialisasi AI...','Menyinkronkan tower...','Memulai!'][Math.min(~~(prog/25),4)];if(prog>=100){clearInterval(iv);setTimeout(startGame,350)}},180);
}

    if(c.type.includes('buff')){hp=800;dmg=50;gold=120;xp=100}
    if(c.type==='wolf'){hp=600;dmg=45;gold=100;xp=80}
    if(c.type==='turtle'){hp=2500;dmg=80;gold=200;xp=200}
    if(c.type==='lord'){hp=4000;dmg=120;gold=300;xp=350}
    return{x:c.x,y:c.y,type:c.type,team:c.team,hp,maxHp:hp,atk:dmg,gold,xp,alive:true,respT:0,atkCd:0}
  });

  // Player
  P=mkHero(selHero,'blue',0);P.x=BB.x+60;P.y=BB.y+60;P.isPlayer=true;

  // CAMERA LANGSUNG KE POSISI PLAYER - FIX UTAMA
  cam.x=P.x;cam.y=P.y;

  // AI Allies
  allies=[];const aL=['top','mid','bot','jungle'];
  const aH=HEROES.filter(h=>h.id!==selHero.id).sort(()=>Math.random()-.5).slice(0,4);
  for(let i=0;i<4;i++){const a=mkHero(aH[i],'blue',i+1);a.x=BB.x+rnd(-20,60);a.y=BB.y+rnd(-20,60);a.lane=aL[i];a.wi=0;allies.push(a)}

  // AI Enemies
  enemies=[];const eL=['top','mid','bot','jungle','mid'];
  const eH=HEROES.filter(h=>h.id!==selHero.id).sort(()=>Math.random()-.5).slice(4,9);
  for(let i=0;i<5;i++){const e=mkHero(eH[i],'red',i);e.x=RB.x+rnd(-60,20);e.y=RB.y+rnd(-60,20);e.lane=eL[i];e.wi=0;enemies.push(e)}

  spawnMin();minT=30;
  buildHUD();buildShopUI();
  lt=performance.now();
  requestAnimationFrame(gameLoop);
}

function mkHero(d,team,idx){

}

/* ================================================================
   BUILD TERRAIN - OFFSCREEN, DIBUAT SEKALI
   ================================================================ */
function buildTerrain(){
  mapCvs=document.createElement('canvas');mapCvs.width=MW;mapCvs.height=MH;
  mapCtx=mapCvs.getContext('2d');

  // Latar belakang - GRASS yang lebih terang
  mapCtx.fillStyle='#1e3a1e';mapCtx.fillRect(0,0,MW,MH);

  // Subtle noise/texture
  for(let i=0;i<800;i++){
    mapCtx.fillStyle=`rgba(${30+~~(Math.random()*20)},${50+~~(Math.random()*30)},${30+~~(Math.random()*20)},0.3)`;
    mapCtx.fillRect(~~(Math.random()*MW),~~(Math.random()*MH),~~(rnd(10,40)),~~(rnd(10,40)));
  }

  // Grid halus
  mapCtx.strokeStyle='rgba(255,255,255,0.018)';mapCtx.lineWidth=1;
  for(let i=0;i<=MW;i+=100){mapCtx.beginPath();mapCtx.moveTo(i,0);mapCtx.lineTo(i,MH);mapCtx.stroke();mapCtx.beginPath();mapCtx.moveTo(0,i);mapCtx.lineTo(MW,i);mapCtx.stroke()}

  // Lane paths - LEBIH TERANG DAN JELAS
  function drawLane(pts){
    // Border luar
    mapCtx.beginPath();mapCtx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)mapCtx.lineTo(pts[i][0],pts[i][1]);
    mapCtx.strokeStyle='#3d5a30';mapCtx.lineWidth=70;mapCtx.lineCap='round';mapCtx.lineJoin='round';mapCtx.stroke();
    // Path utama
    mapCtx.beginPath();mapCtx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)mapCtx.lineTo(pts[i][0],pts[i][1]);
    mapCtx.strokeStyle='#4a6b3a';mapCtx.lineWidth=52;mapCtx.stroke();
    // Garis tengah lane
    mapCtx.beginPath();mapCtx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++)mapCtx.lineTo(pts[i][0],pts[i][1]);
    mapCtx.strokeStyle='rgba(255,255,255,0.03)';mapCtx.lineWidth=2;mapCtx.setLineDash([8,12]);mapCtx.stroke();mapCtx.setLineDash([]);
  }
  drawLane(LANES.top.blue);drawLane(LANES.mid.blue);drawLane(LANES.bot.blue);

  // River - LEBIH VISIBLE
  mapCtx.save();
  mapCtx.lineWidth=100;mapCtx.lineCap='round';
  mapCtx.beginPath();mapCtx.moveTo(800,2400);mapCtx.quadraticCurveTo(1600,1600,2400,800);
  mapCtx.strokeStyle='rgba(0,120,200,0.18)';mapCtx.stroke();
  mapCtx.lineWidth=60;
  mapCtx.beginPath();mapCtx.moveTo(800,2400);mapCtx.quadraticCurveTo(1600,1600,2400,800);
  mapCtx.strokeStyle='rgba(0,160,240,0.12)';mapCtx.stroke();
  mapCtx.lineWidth=20;
  mapCtx.beginPath();mapCtx.moveTo(800,2400);mapCtx.quadraticCurveTo(1600,1600,2400,800);
  mapCtx.strokeStyle='rgba(100,200,255,0.08)';mapCtx.stroke();
  mapCtx.restore();

  // Jungle trees - LEBIH BESAR DAN JELAS
  const trees=[[500,2000,28],[700,1800,22],[900,2000,25],[400,1500,22],[600,1000,28],[800,800,22],[1100,1800,20],[2700,1200,28],[2500,1400,22],[2300,1200,25],[2800,1700,22],[2600,2200,28],[2400,2400,22],[2100,1400,20],[1200,2200,20],[1400,2400,22],[1800,800,22],[2000,1000,20],[1200,1000,22],[2000,2200,22]];
  trees.forEach(t=>{
    const g=mapCtx.createRadialGradient(t[0],t[1],0,t[0],t[1],t[2]);
    g.addColorStop(0,'rgba(15,50,15,0.7)');g.addColorStop(0.7,'rgba(20,60,20,0.4)');g.addColorStop(1,'transparent');
    mapCtx.fillStyle=g;mapCtx.beginPath();mapCtx.arc(t[0],t[1],t[2],0,Math.PI*2);mapCtx.fill();
    mapCtx.strokeStyle='rgba(30,80,30,0.5)';mapCtx.lineWidth=1.5;mapCtx.stroke();
  });

  // Base glow
  let g=mapCtx.createRadialGradient(BB.x,BB.y,0,BB.x,BB.y,280);
  g.addColorStop(0,'rgba(33,150,243,0.15)');g.addColorStop(0.5,'rgba(33,150,243,0.05)');g.addColorStop(1,'transparent');
  mapCtx.fillStyle=g;mapCtx.fillRect(0,0,MW,MH);
  g=mapCtx.createRadialGradient(RB.x,RB.y,0,RB.x,RB.y,280);
  g.addColorStop(0,'rgba(244,67,54,0.15)');g.addColorStop(0.5,'rgba(244,67,54,0.05)');g.addColorStop(1,'transparent');
  mapCtx.fillStyle=g;mapCtx.fillRect(0,0,MW,MH);

  // Base structures
  function drawBase(bx,by,col){
    mapCtx.save();
    // Platform
    mapCtx.beginPath();mapCtx.arc(bx,by,65,0,Math.PI*2);
    mapCtx.fillStyle=col+'18';mapCtx.fill();
    mapCtx.strokeStyle=col+'55';mapCtx.lineWidth=2;mapCtx.stroke();
    // Inner ring
    mapCtx.beginPath();mapCtx.arc(bx,by,40,0,Math.PI*2);
    mapCtx.strokeStyle=col+'44';mapCtx.lineWidth=1.5;mapCtx.stroke();
    // Crystal
    mapCtx.beginPath();mapCtx.moveTo(bx,by-28);mapCtx.lineTo(bx+20,by);mapCtx.lineTo(bx,by+28);mapCtx.lineTo(bx-20,by);mapCtx.closePath();
    mapCtx.fillStyle=col+'55';mapCtx.fill();mapCtx.strokeStyle=col+'cc';mapCtx.lineWidth=2;mapCtx.stroke();
    mapCtx.restore();
  }
  drawBase(BB.x,BB.y,'#2196f3');drawBase(RB.x,RB.y,'#f44336');
}

  [{k:'S1',sk:h.s1,cd:'s1Cd',u:false},{k:'S2',sk:h.s2,cd:'s2Cd',u:false},{k:'ULT',sk:h.ult,cd:'uCd',u:true}].forEach(s=>{

    b.innerHTML=`<span class="sk-key">${s.k}</span><span class="sk-icon" style="color:${h.color}">${s.u?'<i class="fas fa-star"></i>':h.symbol}</span><span class="mp-cost">${s.sk.cost}</span>`;
    b.id='sk_'+s.cd;
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();useSkill(s.cd,s.sk)});

}
function updHUD(){

  document.getElementById('hpBar').style.width=(P.hp/P.maxHp*100)+'%';

  document.getElementById('mpBar').style.width=(P.mp/P.maxMp*100)+'%';
  document.getElementById('mpText').textContent=~~P.mp+'/'+P.maxMp;

  document.getElementById('goldRate').textContent=(4+P.level*.5).toFixed(1);

  document.getElementById('redKills').textContent=rKills;
  const m=~~(gTime/60),s=~~(gTime%60);
  document.getElementById('gameTimer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  ['s1Cd','s2Cd','uCd'].forEach(cd=>{
    const el=document.getElementById('sk_'+cd);if(!el)return;

    if(P[cd]>0){if(!ov){ov=document.createElement('div');ov.className='cd-overlay';el.appendChild(ov)}ov.textContent=Math.ceil(P[cd])}else if(ov)ov.remove();
  });
  for(let i=0;i<6;i++){const el=document.getElementById('iSlot'+i);if(!el)continue;if(P.items[i]){el.classList.add('has-item');el.textContent=P.items[i].name.charAt(0);el.title=P.items[i].name+': '+P.items[i].desc}else{el.classList.remove('has-item');el.textContent=i+1;el.title=''}}
}

function toggleShop(){const o=document.getElementById('shopOverlay');o.classList.toggle('open');if(o.classList.contains('open'))buildShopUI()}
function buyItem(it){
  if(!P||P.items.length>=6||P.gold<it.cost)return;
  P.gold-=it.cost;
  if(it.atk)P.atk+=it.atk;if(it.mpow)P.atk+=it.mpow*.8;if(it.def)P.def+=it.def;
  if(it.hp){P.maxHp+=it.hp;P.hp+=it.hp}if(it.mp){P.maxMp+=it.mp;P.mp+=it.mp}
  if(it.spd)P.spd+=it.spd;if(it.crit)P._crit+=it.crit;if(it.steal)P._steal+=it.steal;if(it.mpen)P._mpen+=it.mpen;
  P.items.push(it);buildShopUI();updHUD();addFx(P.x,P.y,'+','#ffb800',18);
}

/* ================================================================
   COMBAT
   ================================================================ */
function dealDmg(atk,tgt,dmg){
  if(!tgt.alive)return;
  let ad=Math.max(1,dmg-(tgt.def||0)*.4);
  if(atk._crit&&Math.random()*100<atk._crit)ad*=1.5;
  if(tgt.shield>0){const ab=Math.min(tgt.shield,ad);tgt.shield-=ab;ad-=ab}
  tgt.hp-=ad;
  if(atk.isPlayer)pStats.dmg+=ad;
  addFx(tgt.x,tgt.y-10,'-'+~~ad,'#ff4444',13);
  if(tgt.hp<=0)killEnt(tgt,atk);
}
function doAtk(atk,tgt){
  if(atk.atkCd>0||!tgt.alive)return;atk.atkCd=1/atk.atkSpeed;
  let dmg=atk.atk+(atk.bAtk||0)+atk.level*5;
  if(atk.atkRange>200){projs.push({x:atk.x,y:atk.y,tx:tgt.x,ty:tgt.y,spd:600,dmg,team:atk.team,own:atk,r:4,color:atk.hd.color,life:1.5})}
  else{dealDmg(atk,tgt,dmg);if(atk._steal)atk.hp=Math.min(atk.hp+dmg*atk._steal/100,atk.maxHp)}
}
function killEnt(ent,killer){
  ent.alive=false;
  if(ent.maxHp>600&&ent.hd){// Hero death
    ent.respT=5+ent.level*1.5;
    if(ent.team==='blue')rKills++;else bKills++;
    if(killer&&killer.isPlayer)pStats.kills++;
    if(ent.isPlayer)pStats.deaths++;
    addKillMsg((killer?killer.hd.name:'Tower')+' mengeliminasi '+ent.hd.name,ent.team==='red'?'var(--blue)':'var(--red)');
    if(killer&&killer.gold!==undefined){killer.gold+=200+ent.level*20;killer.xp+=100+ent.level*15;chkLvl(killer)}
    for(let i=0;i<10;i++)fx.push({type:'p',x:ent.x+rnd(-15,15),y:ent.y+rnd(-15,15),vx:rnd(-70,70),vy:rnd(-70,70),r:rnd(2,5),color:ent.hd.color,life:.7,ml:.7});
  }else if(ent.maxHp<=600&&ent.lane){// Minion
    if(killer&&killer.gold!==undefined){const b=killer.team!==ent.team?20:0;killer.gold+=50+b;killer.xp+=25+b;chkLvl(killer);if(killer.isPlayer)pStats.gold+=50+b}
  }else if(ent.type){// Jungle
    if(killer&&killer.gold!==undefined){killer.gold+=ent.gold;killer.xp+=ent.xp;chkLvl(killer);if(killer.isPlayer)pStats.gold+=ent.gold}
    ent.respT=ent.type==='lord'?120:ent.type==='turtle'?90:40;
    addKillMsg((killer?killer.hd.name:'')+' membunuh '+ent.type.replace('_',' '),'var(--accent2)');
  }
}
function chkLvl(h){
  while(h.xp>=h.xpTo&&h.level<15){h.xp-=h.xpTo;h.level++;h.xpTo=100+h.level*50;h.maxHp+=h.hd.hp*.08;h.hp=Math.min(h.hp+h.hd.hp*.08,h.maxHp);h.maxMp+=h.hd.mp*.05;h.mp=Math.min(h.mp+h.hd.mp*.05,h.maxMp);h.atk+=h.hd.atk*.06;h.def+=h.hd.def*.05;if(h.isPlayer)addFx(h.x,h.y-20,'LEVEL UP!','#00e5ff',20)}
}
function getEnemies(team){
  const a=[];
  if(team==='blue'){enemies.forEach(e=>{if(e.alive)a.push(e)});minions.forEach(m=>{if(m.alive&&m.team==='red')a.push(m)});towers.forEach(t=>{if(t.alive&&t.team==='red')a.push(t)});jmonsters.forEach(j=>{if(j.alive)a.push(j)})}
  else{allies.forEach(e=>{if(e.alive)a.push(e)});if(P.alive)a.push(P);minions.forEach(m=>{if(m.alive&&m.team==='blue')a.push(m)});towers.forEach(t=>{if(t.alive&&t.team==='blue')a.push(t)});jmonsters.forEach(j=>{if(j.alive)a.push(j)})}
  return a;
}
function addFx(x,y,text,color,sz){fx.push({type:'t',x,y,text,color,size:sz||14,life:.8,ml:.8,vy:-35})}
function addKillMsg(text,color){kmsgs.push({text,color,time:3});const kf=document.getElementById('killFeed');const d=document.createElement('div');d.className='kill-msg';d.style.color=color;d.textContent=text;kf.appendChild(d);setTimeout(()=>d.remove(),3000)}

/* ================================================================
   SKILL SYSTEM
   ================================================================ */
function useSkill(cdKey,sk){
  if(!P||!P.alive||P[cdKey]>0||P.mp<sk.cost)return;
  P[cdKey]=sk.cd;P.mp-=sk.cost;
  let tx=P.x,ty=P.y;
  const ne=getEnemies(P.team).filter(e=>dst(P,e)<=(sk.range||sk.radius||300));
  if(ne.length>0){let n=ne[0];ne.forEach(e=>{if(dst(P,e)<dst(P,n))n=e});tx=n.x;ty=n.y}
  else if(jDir.x!==0||jDir.y!==0){const a=Math.atan2(jDir.y,jDir.x);tx=P.x+Math.cos(a)*(sk.range||200);ty=P.y+Math.sin(a)*(sk.range||200)}
  else{tx=P.x+100}
  const dmg=sk.dmg+P.level*15+(P.bAtk||0);
  const a=ang(P,{x:tx,y:ty});

  if(sk.type==='melee'){ne.forEach(e=>{if(dst(P,e)<=sk.range+20)dealDmg(P,e,dmg)});fx.push({type:'sl',x:P.x+Math.cos(a)*60,y:P.y+Math.sin(a)*60,color:P.hd.color,life:.35,ml:.35,sz:40})}
  else if(sk.type==='projectile'){projs.push({x:P.x,y:P.y,tx,ty,spd:500,dmg,team:P.team,own:P,r:6,color:P.hd.color,life:2,fx:sk.fx,dur:sk.dur||0})}
  else if(sk.type==='aoe'){const cx=sk.range>0?tx:P.x,cy=sk.range>0?ty:P.y;const r=sk.radius||200;getEnemies(P.team).forEach(e=>{if(dst({x:cx,y:cy},e)<=r){if(sk.fx==='heal_aoe'){e.hp=Math.min(e.hp+(sk.val||300),e.maxHp);addFx(e.x,e.y,'+','#00e676',16)}else dealDmg(P,e,dmg);if(sk.fx==='stun'&&e.stunT!==undefined)e.stunT=sk.dur;if(sk.fx==='slow'&&e.slowT!==undefined){e.slowT=sk.dur;e.slowA=.4}}});fx.push({type:'aoe',x:cx,y:cy,rad:0,mr:r,color:P.hd.color,life:.5,ml:.5})}
  else if(sk.type==='dash'){const dd=sk.dashDist||200;const nx=clp(P.x+Math.cos(a)*dd,20,MW-20),ny=clp(P.y+Math.sin(a)*dd,20,MH-20);ne.forEach(e=>{if(dst(P,e)<=dd+30)dealDmg(P,e,dmg)});for(let i=0;i<5;i++)fx.push({type:'tr',x:lrp(P.x,nx,i/5),y:lrp(P.y,ny,i/5),r:10,color:P.hd.color,life:.25,ml:.25});P.x=nx;P.y=ny}
  else if(sk.type==='self'){if(sk.fx==='shield'){P.shield=sk.val;P.shT=sk.dur;fx.push({type:'sh',x:P.x,y:P.y,color:P.hd.color,life:.4,ml:.4,sz:28})}if(sk.fx==='buff'){P.bAtk=(P.bAtk||0)+sk.val;P.bAtkT=sk.dur;fx.push({type:'bf',x:P.x,y:P.y,color:P.hd.color,life:.4,ml:.4,sz:28})}}
  else if(sk.type==='heal'){let tgt=P;[P,...allies].filter(a=>a.alive&&dst(P,a)<sk.range).forEach(a=>{if(a.hp<a.maxHp&&a!==P)tgt=a});tgt.hp=Math.min(tgt.hp+sk.val,tgt.maxHp);addFx(tgt.x,tgt.y,'+','#00e676',18)}
  else if(sk.type==='ally_shield'||sk.type==='ally_buff'){let tgt=P;[P,...allies].filter(a=>a.alive&&dst(P,a)<sk.range).forEach(a=>{if(a!==P)tgt=a});if(sk.fx==='shield'){tgt.shield=sk.val;tgt.shT=sk.dur}if(sk.fx==='buff'){tgt.bAtk=(tgt.bAtk||0)+sk.val;tgt.bAtkT=sk.dur}addFx(tgt.x,tgt.y,sk.fx==='shield'?'shield':'buff','#00e676',22)}
}
function pAtkNearest(){
  if(!P||!P.alive||P.atkCd>0)return;
  const ts=getEnemies(P.team).filter(e=>e.alive&&dst(P,e)<=P.atkRange+60);
  if(!ts.length)return;let n=ts[0];ts.forEach(e=>{if(dst(P,e)<dst(P,n))n=e});atkTarget=n;doAtk(P,n);
}

/* ================================================================
   RECALL & SURRENDER
   ================================================================ */
function startRecall(){if(!P||!P.alive||recalling)return;if(dst(P,BB)>500){addFx(P.x,P.y-15,'Terlalu jauh!','#ff2d55',12);return}recalling=true;recT=4}
function cancelRecall(){recalling=false;recT=0}
function trySurrender(){if(gTime<300){addFx(P.x,P.y-15,'Min 5 menit','#ff2d55',12);return}endGame(false)}

/* ================================================================
   AI
   ================================================================ */
function aiUpdate(h,dt){
  if(!h.alive||h.stunT>0)return;
  const base=h.team==='blue'?BB:RB;
  if(dst(h,base)<200){h.hp=Math.min(h.hp+h.maxHp*.03*dt,h.maxHp);h.mp=Math.min(h.mp+h.maxMp*.04*dt,h.maxMp)}
  if(h.gold>=800&&dst(h,base)<200&&h.items.length<6){const af=ITEMS.filter(it=>it.cost<=h.gold).sort((a,b)=>b.cost-a.cost)[0];if(af){h.gold-=af.cost;if(af.atk)h.atk+=af.atk;if(af.mpow)h.atk+=af.mpow*.8;if(af.def)h.def+=af.def;if(af.hp){h.maxHp+=af.hp;h.hp+=af.hp}if(af.spd)h.spd+=af.spd;h.items.push(af)}}
  if(h.hp<h.maxHp*.2){moveT(h,base,dt);return}
  if(h.lane==='jungle'){aiJungle(h,dt);return}
  const wps=LANES[h.lane][h.team==='blue'?'blue':'red'];if(!wps)return;
  const ne=getEnemies(h.team).filter(e=>e.alive&&dst(h,e)<=h.atkRange+50);
  if(ne.length>0){
    let t=ne[0];ne.forEach(e=>{if(e.hp<t.hp)t=e});
    if(dst(h,t)<=h.atkRange)doAtk(h,t);else moveT(h,t,dt);
    if(h.s1Cd<=0&&h.mp>=h.hd.s1.cost&&dst(h,t)<=h.hd.s1.range+30){h.s1Cd=h.hd.s1.cd;h.mp-=h.hd.s1.cost;dealDmg(h,t,h.hd.s1.dmg+h.level*15);if(h.hd.s1.fx==='stun')t.stunT=h.hd.s1.dur;fx.push({type:'aoe',x:t.x,y:t.y,rad:0,mr:50,color:h.hd.color,life:.25,ml:.25})}
    if(h.uCd<=0&&h.mp>=h.hd.ult.cost&&dst(h,t)<=h.hd.ult.range+50&&h.level>=4){h.uCd=h.hd.ult.cd;h.mp-=h.hd.ult.cost;const r=h.hd.ult.radius||200;getEnemies(h.team).forEach(e=>{if(dst(t,e)<=r){dealDmg(h,e,h.hd.ult.dmg+h.level*20);if(h.hd.ult.fx==='stun')e.stunT=h.hd.ult.dur}});fx.push({type:'aoe',x:t.x,y:t.y,rad:0,mr:r,color:h.hd.color,life:.5,ml:.5})}
  }else{if(h.wi>=wps.length)h.wi=wps.length-1;const wp=wps[h.wi];if(dst(h,wp)<50)h.wi=Math.min(h.wi+1,wps.length-1);moveT(h,wp,dt)}
}
function aiJungle(h,dt){
  const base=h.team==='blue'?BB:RB;
  const camps=jmonsters.filter(j=>j.alive&&(j.team===h.team||j.team==='neutral'));
  if(camps.length>0){let c=camps[0];camps.forEach(j=>{if(dst(h,j)<dst(h,c))c=j});if(dst(h,c)<=h.atkRange){doAtk(h,c);if(h.s1Cd<=0&&h.mp>=h.hd.s1.cost){h.s1Cd=h.hd.s1.cd;h.mp-=h.hd.s1.cost;dealDmg(h,c,h.hd.s1.dmg+h.level*15)}}else moveT(h,c,dt)}
  else{const mwp=LANES.mid[h.team==='blue'?'blue':'red'];const wp=mwp[Math.min(2,mwp.length-1)];moveT(h,wp,dt);const ne=getEnemies(h.team).filter(e=>e.alive&&dst(h,e)<=h.atkRange+50);if(ne.length>0){let t=ne[0];ne.forEach(e=>{if(e.hp<t.hp)t=e});if(dst(h,t)<=h.atkRange)doAtk(h,t);else moveT(h,t,dt)}}
}
function moveT(e,t,dt){const a=ang(e,t);let s=e.spd;if(e.slowT>0)s*=(1-e.slowA);if(e.bSpdT>0)s+=e.bSpd;e.x+=Math.cos(a)*s*dt;e.y+=Math.sin(a)*s*dt;e.x=clp(e.x,20,MW-20);e.y=clp(e.y,20,MH-20)}

/* ================================================================
   MINION AI
   ================================================================ */
function minAI(m,dt){
  if(!m.alive||m.stunT>0)return;
  const wps=LANES[m.lane][m.team==='blue'?'blue':'red'];if(!wps)return;
  const ts=m.team==='blue'?enemies.filter(e=>e.alive).concat(minions.filter(x=>x.alive&&x.team==='red')).concat(towers.filter(t=>t.alive&&t.team==='red')):allies.filter(e=>e.alive).concat(minions.filter(x=>x.alive&&x.team==='blue')).concat(towers.filter(t=>t.alive&&t.team==='blue')).concat(P.alive?[P]:[]);
  const near=ts.filter(t=>dst(m,t)<m.atkRange+30);
  if(near.length>0){let t=near[0];near.forEach(e=>{if(e.hp<t.hp)t=e});if(dst(m,t)<=m.atkRange&&m.atkCd<=0){m.atkCd=1;dealDmg(m,t,m.atk)}}
  else{if(m.wi>=wps.length)m.wi=wps.length-1;const wp=wps[m.wi];if(dst(m,wp)<40)m.wi++;if(m.wi<wps.length)moveT(m,wps[m.wi],dt)}
}

/* ================================================================
   TOWER AI
   ================================================================ */
function twAI(t,dt){
  if(!t.alive||t.atkCd>0)return;
  const ts=t.team==='blue'?minions.filter(m=>m.alive&&m.team==='red'&&dst(t,m)<=t.range).concat(enemies.filter(e=>e.alive&&dst(t,e)<=t.range)):minions.filter(m=>m.alive&&m.team==='blue'&&dst(t,m)<=t.range).concat(allies.filter(e=>e.alive&&dst(t,e)<=t.range)).concat(P.alive&&dst(t,P)<=t.range?[P]:[]);
  if(ts.length>0){dealDmg(t,ts[0],t.atk);t.atkCd=1;projs.push({x:t.x,y:t.y,tx:ts[0].x,ty:ts[0].y,spd:700,dmg:0,team:t.team,r:5,color:t.team==='blue'?'#42a5f5':'#ef5350',life:.5,vis:true})}
}

/* ================================================================
   JUNGLE MONSTER AI
   ================================================================ */
function jmAI(m,dt){
  if(!m.alive||m.atkCd>0)return;
  const hs=[P,...allies,...enemies].filter(h=>h.alive&&dst(m,h)<150);
  if(hs.length>0){let t=hs[0];hs.forEach(h=>{if(dst(m,h)<dst(m,t))t=h});dealDmg(m,t,m.atk);m.atkCd=1.5}
}

/* ================================================================
   UPDATE UTAMA
   ================================================================ */
function update(dt){
  if(!gameOn)return;
  gTime+=dt;minT-=dt;if(minT<=0){spawnMin();minT=30}

  // Player movement
  if(P.alive&&P.stunT<=0){
    if(jAct&&(jDir.x!==0||jDir.y!==0)){cancelRecall();const len=Math.hypot(jDir.x,jDir.y);let s=P.spd;if(P.slowT>0)s*=(1-P.slowA);if(P.bSpdT>0)s+=P.bSpd;P.x+=(jDir.x/len)*s*dt;P.y+=(jDir.y/len)*s*dt;P.x=clp(P.x,20,MW-20);P.y=clp(P.y,20,MH-20)}
    if(atkTarget&&atkTarget.alive&&dst(P,atkTarget)<=P.atkRange+20&&P.atkCd<=0)doAtk(P,atkTarget);
    else if(atkTarget&&(!atkTarget.alive||dst(P,atkTarget)>P.atkRange+100))atkTarget=null;
    if(recalling){recT-=dt;if(recT<=0){P.x=BB.x+50;P.y=BB.y+50;P.hp=P.maxHp;P.mp=P.maxMp;recalling=false}else if(jAct)cancelRecall()}
    mpRT+=dt;if(mpRT>.5){mpRT=0;P.mp=Math.min(P.mp+P.maxMp*.02,P.maxMp)}
    gRT+=dt;if(gRT>1){gRT=0;P.gold+=4+P.level*.5;pStats.gold+=4+P.level*.5}
  }

  // Update semua hero
  [P,...allies,...enemies].forEach(h=>{
    if(!h.alive){h.respT-=dt;if(h.respT<=0){h.alive=true;const b=h.team==='blue'?BB:RB;h.x=b.x+rnd(-30,30);h.y=b.y+rnd(-30,30);h.hp=h.maxHp;h.mp=h.maxMp;h.shield=0;h.stunT=0;h.slowT=0;if(h.isPlayer)addFx(h.x,h.y-15,'Respawned!','#00e5ff',18)}return}
    if(h.s1Cd>0)h.s1Cd-=dt;if(h.s2Cd>0)h.s2Cd-=dt;if(h.uCd>0)h.uCd-=dt;if(h.atkCd>0)h.atkCd-=dt;if(h.stunT>0)h.stunT-=dt;if(h.slowT>0)h.slowT-=dt;if(h.shT>0){h.shT-=dt;if(h.shT<=0)h.shield=0}if(h.bAtkT>0){h.bAtkT-=dt;if(h.bAtkT<=0)h.bAtk=0}if(h.bSpdT>0){h.bSpdT-=dt;if(h.bSpdT<=0)h.bSpd=0}
    if(!h.isPlayer)aiUpdate(h,dt);
  });

  // Minions
  minions.forEach(m=>{if(!m.alive)return;if(m.stunT>0){m.stunT-=dt;return}if(m.atkCd>0)m.atkCd-=dt;minAI(m,dt)});
  minions=minions.filter(m=>m.alive);

  // Towers
  towers.forEach(t=>{if(t.alive){if(t.atkCd>0)t.atkCd-=dt;twAI(t,dt)}});

  // Jungle
  jmonsters.forEach(m=>{if(!m.alive){m.respT-=dt;if(m.respT<=0){m.alive=true;m.hp=m.maxHp}return}if(m.atkCd>0)m.atkCd-=dt;jmAI(m,dt)});

  // Projectiles
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.life-=dt;if(p.life<=0){projs.splice(i,1);continue}
    const a=Math.atan2(p.ty-p.y,p.tx-p.x);p.x+=Math.cos(a)*p.spd*dt;p.y+=Math.sin(a)*p.spd*dt;
    if(p.vis){if(dst(p,{x:p.tx,y:p.ty})<20){projs.splice(i,1)}continue}
    const ts=getEnemies(p.team);
    let hit=false;for(const t of ts){if(!t.alive)continue;if(dst(p,t)<(t.r||15)+p.r){if(p.dmg>0)dealDmg(p.own||p,t,p.dmg);if(p.fx==='stun'&&t.stunT!==undefined)t.stunT=p.dur;if(p.fx==='slow'&&t.slowT!==undefined){t.slowT=p.dur;t.slowA=.4}projs.splice(i,1);hit=true;break}}
  }

  // Effects
  for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.life-=dt;if(e.life<=0){fx.splice(i,1);continue}if(e.type==='t')e.y+=e.vy*dt;if(e.type==='p'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=.95;e.vy*=.95}if(e.type==='aoe')e.rad=lrp(0,e.mr,1-e.life/e.ml)}

  // Win/lose
  if(!towers.some(t=>t.team==='red'&&t.lane==='base'&&t.alive))endGame(true);
  if(!towers.some(t=>t.team==='blue'&&t.lane==='base'&&t.alive))endGame(false);

  // Camera SMOOTH ke player
  if(P.alive){cam.x=lrp(cam.x,P.x,6*dt);cam.y=lrp(cam.y,P.y,6*dt)}
  updHUD();
}

/* ================================================================
   RENDER - DITULIS ULANG TOTAL
   ================================================================ */
function render(){
  const W=cvs.width,H=cvs.height;
  // Clear dengan warna gelap hijau
  ctx.fillStyle='#0a150a';ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(cam.z,cam.z);
  ctx.translate(-cam.x,-cam.y);

  // 1. Terrain (offscreen canvas)
  ctx.drawImage(mapCvs,0,0);

  // 2. Range indicators
  if(P.alive){
    ctx.beginPath();ctx.arc(P.x,P.y,P.atkRange,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;ctx.stroke();
  }
  towers.forEach(t=>{if(!t.alive||dst(P,t)>500)return;ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);ctx.strokeStyle=t.team==='blue'?'rgba(33,150,243,0.06)':'rgba(244,67,54,0.06)';ctx.lineWidth=1;ctx.stroke()});

  // 3. Jungle monsters
  jmonsters.forEach(m=>{
    if(!m.alive)return;
    const col=m.type==='blue_buff'?'#4488ff':m.type==='red_buff'?'#ff4444':m.type==='turtle'?'#ffb800':m.type==='lord'?'#e040fb':'#88aa44';
    const sz=m.type==='lord'?20:m.type==='turtle'?16:13;
    // Glow
    ctx.beginPath();ctx.arc(m.x,m.y,sz+6,0,Math.PI*2);ctx.fillStyle=col+'15';ctx.fill();
    // Body
    ctx.beginPath();ctx.arc(m.x,m.y,sz,0,Math.PI*2);ctx.fillStyle=col+'33';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
    // Label
    ctx.fillStyle=col;ctx.font='bold 9px Rajdhani';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m.type==='blue_buff'?'B':m.type==='red_buff'?'R':m.type==='turtle'?'T':m.type==='lord'?'L':'M',m.x,m.y+1);
    drawHP(m.x,m.y-sz-6,26,3,m.hp,m.maxHp,col);
  });

  // 4. Towers
  towers.forEach(t=>{
    if(!t.alive)return;
    const col=t.team==='blue'?'#42a5f5':'#ef5350';
    const sz=t.lane==='base'?24:18;
    // Range glow
    ctx.beginPath();ctx.arc(t.x,t.y,sz+8,0,Math.PI*2);ctx.fillStyle=col+'0a';ctx.fill();
    // Base
    ctx.beginPath();ctx.arc(t.x,t.y,sz,0,Math.PI*2);ctx.fillStyle=col+'20';ctx.fill();ctx.strokeStyle=col+'cc';ctx.lineWidth=2.5;ctx.stroke();
    // Inner
    ctx.beginPath();ctx.arc(t.x,t.y,sz*.45,0,Math.PI*2);ctx.fillStyle=col+'66';ctx.fill();
    // Turret
    ctx.beginPath();ctx.arc(t.x,t.y-2,5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    // Attack flash
    if(t.atkCd>.8){ctx.beginPath();ctx.arc(t.x,t.y,sz+4,0,Math.PI*2);ctx.strokeStyle=col+'44';ctx.lineWidth=3;ctx.stroke()}
    drawHP(t.x,t.y-sz-7,32,4,t.hp,t.maxHp,col);
  });

  // 5. Minions
  minions.forEach(m=>{
    if(!m.alive)return;
    const col=m.team==='blue'?'#64b5f6':'#e57373';
    ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fillStyle=col+'99';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
    drawHP(m.x,m.y-12,14,2,m.hp,m.maxHp,col);
  });

  // 6. Heroes
  const allH=[...allies,...enemies];if(P.alive)allH.push(P);
  allH.forEach(h=>{
    if(!h.alive)return;
    const col=h.hd.color;const r=h.isPlayer?16:13;
    // Shadow
    ctx.beginPath();ctx.ellipse(h.x,h.y+r*.6,r*.8,r*.25,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fill();
    // Glow untuk player
    if(h.isPlayer){ctx.beginPath();ctx.arc(h.x,h.y,r+8,0,Math.PI*2);ctx.fillStyle=col+'18';ctx.fill()}
    // Body gradient
    const gr=ctx.createRadialGradient(h.x-2,h.y-2,0,h.x,h.y,r);
    gr.addColorStop(0,col);gr.addColorStop(1,col+'77');
    ctx.beginPath();ctx.arc(h.x,h.y,r,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
    ctx.strokeStyle=h.isPlayer?'#fff':col+'bb';ctx.lineWidth=h.isPlayer?2.5:1.5;ctx.stroke();
    // Symbol
    ctx.fillStyle='#fff';ctx.font=`bold ${r}px Rajdhani`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(h.symbol,h.x,h.y+1);
    // Shield visual
    if(h.shield>0){ctx.beginPath();ctx.arc(h.x,h.y,r+4,0,Math.PI*2);ctx.strokeStyle='rgba(0,229,255,0.5)';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([])}
    // Stun
    if(h.stunT>0){ctx.fillStyle='#ffd600';ctx.font='bold 10px sans-serif';ctx.textBaseline='alphabetic';ctx.fillText('*',h.x-5,h.y-r-3);ctx.fillText('*',h.x+5,h.y-r-3)}
    // HP bar
    drawHP(h.x,h.y-r-7,h.isPlayer?36:26,4,h.hp,h.maxHp,h.team==='blue'?'#42a5f5':'#ef5350');
    // Name (hanya musuh dekat)
    if(!h.isPlayer&&dst(P,h)<400){ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 7px Rajdhani';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(h.hd.name,h.x,h.y+r+11)}
    // Level badge
    ctx.beginPath();ctx.arc(h.x+r*.7,h.y+r*.4,6,0,Math.PI*2);ctx.fillStyle=h.team==='blue'?'#1565c0':'#c62828';ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 7px Rajdhani';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h.level,h.x+r*.7,h.y+r*.4+1);
  });

  // Player arrow indicator
  if(P.alive){ctx.beginPath();ctx.moveTo(P.x,P.y-24);ctx.lineTo(P.x-4,P.y-19);ctx.lineTo(P.x+4,P.y-19);ctx.closePath();ctx.fillStyle='#00e5ff';ctx.fill()}
  // Recall visual
  if(recalling){ctx.beginPath();ctx.arc(P.x,P.y,22,-Math.PI/2,-Math.PI/2+(1-recT/4)*Math.PI*2);ctx.strokeStyle='#00e5ff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#00e5ff';ctx.font='bold 9px Rajdhani';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('RECALL '+Math.ceil(recT),P.x,P.y-30)}

  // 7. Projectiles
  projs.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,Math.PI*2);ctx.fillStyle=p.color+'33';ctx.fill()});

  // 8. Effects
  fx.forEach(e=>{
    const a=clp(e.life/e.ml,0,1);
    if(e.type==='t'){ctx.globalAlpha=a;ctx.fillStyle=e.color;ctx.font=`bold ${e.size}px Rajdhani`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.text,e.x,e.y);ctx.globalAlpha=1}
    else if(e.type==='aoe'){ctx.beginPath();ctx.arc(e.x,e.y,Math.max(1,e.rad),0,Math.PI*2);ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.globalAlpha=a*.6;ctx.stroke();ctx.fillStyle=e.color+'11';ctx.globalAlpha=a*.15;ctx.fill();ctx.globalAlpha=1}
    else if(e.type==='p'){ctx.beginPath();ctx.arc(e.x,e.y,Math.max(.5,e.r*a),0,Math.PI*2);ctx.fillStyle=e.color;ctx.globalAlpha=a;ctx.fill();ctx.globalAlpha=1}
    else if(e.type==='tr'){ctx.beginPath();ctx.arc(e.x,e.y,Math.max(.5,e.r*a),0,Math.PI*2);ctx.fillStyle=e.color;ctx.globalAlpha=a*.4;ctx.fill();ctx.globalAlpha=1}
    else if(e.type==='sl'){ctx.beginPath();ctx.arc(e.x,e.y,e.sz*a,0,Math.PI*1.2);ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.globalAlpha=a;ctx.stroke();ctx.globalAlpha=1}
    else if(e.type==='sh'){ctx.beginPath();ctx.arc(e.x,e.y,e.sz*(1.2-a*.4),0,Math.PI*2);ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.globalAlpha=a*.5;ctx.stroke();ctx.globalAlpha=1}
    else if(e.type==='bf'){for(let i=0;i<3;i++){const an=gTime*3+i*Math.PI*2/3;ctx.beginPath();ctx.arc(e.x+Math.cos(an)*e.sz*.5,e.y+Math.sin(an)*e.sz*.5,3*a,0,Math.PI*2);ctx.fillStyle=e.color;ctx.globalAlpha=a;ctx.fill()}ctx.globalAlpha=1}
  });

  // 9. FOG OF WAR - GUNA CANVAS YANG SUDAH DIBUAT, CUKUP CLEAR & REDRAW
  fogCtx.clearRect(0,0,MW,MH);
  fogCtx.fillStyle='rgba(0,0,0,0.45)';
  fogCtx.fillRect(0,0,MW,MH);
  fogCtx.globalCompositeOperation='destination-out';
  const vr=380;
  [P,...allies].forEach(h=>{
    if(!h.alive)return;
    const g=fogCtx.createRadialGradient(h.x,h.y,0,h.x,h.y,vr);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.65,'rgba(0,0,0,0.85)');g.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.fillStyle=g;fogCtx.beginPath();fogCtx.arc(h.x,h.y,vr,0,Math.PI*2);fogCtx.fill();
  });
  towers.filter(t=>t.alive&&t.team==='blue').forEach(t=>{
    const g=fogCtx.createRadialGradient(t.x,t.y,0,t.x,t.y,t.range);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.75,'rgba(0,0,0,0.5)');g.addColorStop(1,'rgba(0,0,0,0)');
    fogCtx.fillStyle=g;fogCtx.beginPath();fogCtx.arc(t.x,t.y,t.range,0,Math.PI*2);fogCtx.fill();
  });
  fogCtx.globalCompositeOperation='source-over';
  ctx.drawImage(fogCvs,0,0);

  ctx.restore();

  // 10. MINIMAP
  renderMM();
}

function drawHP(x,y,w,h,hp,mx,col){
  const bx=x-w/2;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(bx-1,y-1,w+2,h+2);
  ctx.fillStyle='#222';ctx.fillRect(bx,y,w,h);
  const pct=clp(hp/mx,0,1);ctx.fillStyle=pct>.5?col:pct>.25?'#ff9800':'#f44336';
  ctx.fillRect(bx,y,w*pct,h);
}

function renderMM(){
  const w=mmCvs.width,h=mmCvs.height,sx=w/MW,sy=h/MH;
  mmCtx.fillStyle='#0c180c';mmCtx.fillRect(0,0,w,h);
  // Lanes
  mmCtx.strokeStyle='#1e3018';mmCtx.lineWidth=2;
  ['top','mid','bot'].forEach(l=>{const wp=LANES[l].blue;mmCtx.beginPath();mmCtx.moveTo(wp[0][0]*sx,wp[0][1]*sy);for(let i=1;i<wp.length;i++)mmCtx.lineTo(wp[i][0]*sx,wp[i][1]*sy);mmCtx.stroke()});
  // River
  mmCtx.strokeStyle='rgba(0,100,200,0.15)';mmCtx.lineWidth=3;mmCtx.beginPath();mmCtx.moveTo(800*sx,2400*sy);mmCtx.quadraticCurveTo(1600*sx,1600*sy,2400*sx,800*sy);mmCtx.stroke();
  // Towers
  towers.forEach(t=>{if(!t.alive)return;mmCtx.fillStyle=t.team==='blue'?'#42a5f5':'#ef5350';mmCtx.fillRect(t.x*sx-2,t.y*sy-2,4,4)});
  // Bases
  mmCtx.fillStyle='#42a5f5';mmCtx.beginPath();mmCtx.arc(BB.x*sx,BB.y*sy,4,0,Math.PI*2);mmCtx.fill();
  mmCtx.fillStyle='#ef5350';mmCtx.beginPath();mmCtx.arc(RB.x*sx,RB.y*sy,4,0,Math.PI*2);mmCtx.fill();
  // Minions
  minions.forEach(m=>{if(!m.alive)return;mmCtx.fillStyle=m.team==='blue'?'rgba(66,165,245,0.4)':'rgba(239,83,80,0.4)';mmCtx.fillRect(m.x*sx-.5,m.y*sy-.5,1,1)});
  // Heroes (hanya tampilkan musuh jika di visi)
  [P,...allies,...enemies].filter(hh=>hh.alive).forEach(hh=>{
    if(hh.team==='red'){const inV=[P,...allies].some(a=>a.alive&&dst(a,hh)<380)||towers.some(t=>t.alive&&t.team==='blue'&&dst(t,hh)<t.range);if(!inV)return}
    mmCtx.fillStyle=hh.hd.color;mmCtx.beginPath();mmCtx.arc(hh.x*sx,hh.y*sy,hh.isPlayer?3.5:2.5,0,Math.PI*2);mmCtx.fill();
    if(hh.isPlayer){mmCtx.strokeStyle='#fff';mmCtx.lineWidth=1;mmCtx.stroke()}
  });
  // Camera viewport
  const vw=cvs.width/cam.z*sx,vh=cvs.height/cam.z*sy;
  mmCtx.strokeStyle='rgba(255,255,255,0.25)';mmCtx.lineWidth=1;mmCtx.strokeRect(cam.x*sx-vw/2,cam.y*sy-vh/2,vw,vh);
}

/* ================================================================
   GAME LOOP
   ================================================================ */
function gameLoop(now){
  if(!gameOn)return;
  const dt=Math.min((now-lt)/1000,.05);lt=now;
  update(dt);render();
  requestAnimationFrame(gameLoop);
}

/* ================================================================
   END GAME
   ================================================================ */
function endGame(win){
  gameOn=false;showScr('screen-results');
  const rt=document.getElementById('resultTitle');rt.textContent=win?'VICTORY':'DEFEAT';rt.className='result-title '+(win?'win':'lose');
  let mvpN=P.hd.name,mvpK=pStats.kills;
  allies.forEach(a=>{const k=~~(a.gold/300);if(k>mvpK){mvpK=k;mvpN=a.hd.name}});
  document.getElementById('resultMVP').innerHTML='<i class="fas fa-crown"></i> MVP: '+mvpN;
  const m=~~(gTime/60),s=~~(gTime%60);
  document.getElementById('resultStats').innerHTML=`<div class="result-stat"><div class="rs-val">${pStats.kills}</div><div class="rs-label">Kills</div></div><div class="result-stat"><div class="rs-val">${pStats.deaths}</div><div class="rs-label">Deaths</div></div><div class="result-stat"><div class="rs-val">${pStats.assists}</div><div class="rs-label">Assists</div></div><div class="result-stat"><div class="rs-val">${~~pStats.dmg}</div><div class="rs-label">Total Damage</div></div><div class="result-stat"><div class="rs-val">${~~pStats.gold}</div><div class="rs-label">Gold Earned</div></div><div class="result-stat"><div class="rs-val">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div><div class="rs-label">Duration</div></div>`;
}
function backToMenu(){showScr('screen-menu');initMenu()}

/* ================================================================
   INPUT: JOYSTICK (touch + mouse)
   ================================================================ */
(function(){
  const area=document.getElementById('joystickArea'),base=document.getElementById('joyBase'),stick=document.getElementById('joyStick'),maxR=38;
  function ctr(){const r=base.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
  function mv(cx,cy){const c=ctr();let dx=cx-c.x,dy=cy-c.y;const d=Math.hypot(dx,dy);if(d>maxR){dx=dx/d*maxR;dy=dy/d*maxR}stick.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;jDir.x=dx/maxR;jDir.y=dy/maxR;jAct=true}
  function end(){stick.style.transform='translate(-50%,-50%)';jDir.x=0;jDir.y=0;jAct=false;jTid=null}
  area.addEventListener('pointerdown',e=>{e.preventDefault();jTid=e.pointerId;area.setPointerCapture(e.pointerId);mv(e.clientX,e.clientY)});
  area.addEventListener('pointermove',e=>{if(e.pointerId===jTid){e.preventDefault();mv(e.clientX,e.clientY)}});
  area.addEventListener('pointerup',e=>{if(e.pointerId===jTid)end()});
  area.addEventListener('pointercancel',e=>{if(e.pointerId===jTid)end()});
})();

/* ================================================================
   INPUT: MINIMAP CLICK
   ================================================================ */
document.getElementById('minimap').addEventListener('click',e=>{
  if(!gameOn||!P.alive)return;const r=e.target.getBoundingClientRect();
  addFx((e.clientX-r.left)/r.width*MW,(e.clientY-r.top)/r.height*MH,'PING!','#00e5ff',14);
});

/* ================================================================
   INPUT: KEYBOARD (desktop)
   ================================================================ */
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;
  if(!gameOn||!P||!P.alive)return;
  if(e.key==='1')useSkill('s1Cd',P.hd.s1);if(e.key==='2')useSkill('s2Cd',P.hd.s2);if(e.key==='3')useSkill('uCd',P.hd.ult);
  if(e.key==='a'||e.key===' ')pAtkNearest();if(e.key==='b')startRecall();if(e.key==='p')toggleShop();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

// Keyboard WASD override joystick
const _origUpdate=update;
update=function(dt){
  let kx=0,ky=0;
  if(keys['w']||keys['arrowup'])ky=-1;if(keys['s']||keys['arrowdown'])ky=1;
  if(keys['a']||keys['arrowleft'])kx=-1;if(keys['d']||keys['arrowright'])kx=1;
  if(kx!==0||ky!==0){jDir.x=kx;jDir.y=ky;jAct=true}
  else if(!jTid){jDir.x=0;jDir.y=0;jAct=false}
  _origUpdate(dt);
};
</script>
