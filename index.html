<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Stickman Warriors</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a12;--card:rgba(16,16,28,0.97);--accent:#e63946;--gold:#ffd700;--blue:#4cc9f0;--purple:#9b5de5;--green:#06d6a0;--txt:#eee;--mut:#666}
body{background:var(--bg);color:var(--txt);font-family:'Rajdhani',sans-serif;overflow:hidden;height:100vh;width:100vw;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
.ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.ui>*{pointer-events:auto}
.scr{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:radial-gradient(ellipse at 50% 30%,rgba(230,57,70,0.1),transparent 60%),var(--bg)}
.scr.on{display:flex}
.ttl{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,7vw,4rem);font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--accent),#ff6b6b,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px}
.sub{font-size:clamp(.65rem,2vw,1rem);color:var(--mut);letter-spacing:6px;text-transform:uppercase;margin-bottom:32px}
.btn{font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;padding:12px 34px;border:2px solid var(--accent);background:rgba(230,57,70,0.1);color:var(--txt);border-radius:8px;cursor:pointer;transition:all .2s;min-width:200px;text-align:center;letter-spacing:1px;margin:5px 0;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--accent);transform:translateY(-2px);box-shadow:0 5px 20px rgba(230,57,70,0.4)}
.btn:active{transform:scale(.96)}
.btn.g{border-color:var(--gold);background:rgba(255,215,0,0.07)}.btn.g:hover{background:var(--gold);color:#111}
.btn.gr{border-color:var(--green);background:rgba(6,214,160,0.07)}.btn.gr:hover{background:var(--green);color:#111}
.btn.b{border-color:var(--blue);background:rgba(76,201,240,0.07)}.btn.b:hover{background:var(--blue);color:#111}
.btn.sm{padding:7px 16px;font-size:.85rem;min-width:110px}
.pn{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:18px;max-width:460px;width:92%;max-height:76vh;overflow-y:auto}
.pn::-webkit-scrollbar{width:3px}.pn::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
.pt{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;margin-bottom:12px;color:var(--accent)}
.grd{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ic{background:rgba(255,255,255,0.025);border:2px solid rgba(255,255,255,0.06);border-radius:8px;padding:9px;text-align:center;cursor:pointer;transition:all .15s}
.ic:hover{border-color:var(--accent);background:rgba(230,57,70,0.05)}
.ic.ow{border-color:var(--green)}.ic.eq{border-color:var(--gold);background:rgba(255,215,0,0.05)}
.ic .n{font-weight:700;font-size:.85rem;margin-bottom:1px}.ic .d{font-size:.68rem;color:var(--mut)}
.ic .p{font-size:.72rem;color:var(--gold);margin-top:3px}
.ur{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.035)}
.ur:last-child{border:none}.ui2{flex:1}.un{font-weight:700;font-size:.88rem}.ul{font-size:.68rem;color:var(--mut)}
.lg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.lb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,0.07);border-radius:8px;font-family:'Orbitron',monospace;font-weight:700;font-size:.95rem;cursor:pointer;transition:all .15s;background:rgba(255,255,255,0.015)}
.lb.u{border-color:var(--accent);color:var(--accent)}.lb.u:hover{background:var(--accent);color:#fff}
.lb.d{border-color:var(--green);color:var(--green);background:rgba(6,214,160,0.06)}
.lb.bo{border-color:var(--gold);color:var(--gold)}.lb.k{opacity:.22;cursor:default}
.sb{padding:6px 11px;border-radius:6px;border:2px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.015);cursor:pointer;font-size:.75rem;font-weight:600;transition:all .15s;color:var(--txt);font-family:'Rajdhani',sans-serif}
.sb:hover{border-color:var(--purple);background:rgba(156,93,229,0.07)}
.sb.eq{border-color:var(--purple);background:rgba(156,93,229,0.12);color:var(--purple)}
.hud{position:fixed;top:0;left:0;width:100%;padding:9px 12px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:15}
.hud.on{display:flex}
.hl,.hr{display:flex;flex-direction:column;gap:4px}
.br{height:13px;background:rgba(0,0,0,0.55);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,0.07)}
.br.s{height:8px}
.bf{height:100%;border-radius:6px;transition:width .12s}
.hpf{background:linear-gradient(90deg,#e63946,#ff6b6b)}
.enf{background:linear-gradient(90deg,#4cc9f0,#7209b7)}
.ehf{background:linear-gradient(90deg,#ff006e,#fb5607)}
.bl{font-size:.68rem;font-weight:600;display:flex;justify-content:space-between;margin-bottom:1px}
.bw{width:170px}.bw.e{width:220px}.bw.s{width:130px}
.ch{display:flex;align-items:center;gap:4px;font-family:'Orbitron',monospace;font-size:.75rem;color:var(--gold);margin-top:2px}
.cp{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:var(--gold);opacity:0;pointer-events:none;z-index:16;text-shadow:0 0 18px rgba(255,215,0,0.5);transition:opacity .12s}
.cp.on{opacity:1}
.mc{position:fixed;bottom:0;left:0;width:100%;padding:12px;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:15}
.mc.on{display:flex}.mc>*{pointer-events:auto}
.dp{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:46px 46px;gap:3px}
.db{width:46px;height:46px;border-radius:10px;background:rgba(255,255,255,0.09);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:1rem;color:rgba(255,255,255,0.45);cursor:pointer}
.db:active{background:rgba(255,255,255,0.22)}.db.e{background:none;border:none;pointer-events:none}
.ab{display:grid;grid-template-columns:54px 54px;grid-template-rows:54px 54px 44px;gap:4px}
.a1{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.62rem;cursor:pointer;border:2px solid}
.a1.t{background:rgba(230,57,70,0.13);border-color:var(--accent);color:var(--accent)}
.a1.sk{background:rgba(156,93,229,0.13);border-color:var(--purple);color:var(--purple)}
.a1.jm{background:rgba(76,201,240,0.13);border-color:var(--blue);color:var(--blue)}
.a1.da{width:44px;height:44px;background:rgba(255,215,0,0.1);border-color:var(--gold);color:var(--gold)}
.a1:active{transform:scale(.86);filter:brightness(1.5)}
.ro{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(3px);z-index:25}
.ro.on{display:flex}
.rt{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900}
.rs{display:flex;gap:18px;font-size:.95rem}.rs span{color:var(--gold)}
.tst{position:fixed;top:17%;left:50%;transform:translateX(-50%);padding:7px 18px;background:var(--card);border:1px solid var(--accent);border-radius:7px;font-weight:600;opacity:0;transition:opacity .22s;pointer-events:none;z-index:100;white-space:nowrap;font-size:.85rem}
.tst.on{opacity:1}
.wi{position:fixed;top:72px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:1rem;color:var(--accent);opacity:0;pointer-events:none;z-index:16}
.wi.on{opacity:1;animation:wa .35s ease}
@keyframes wa{from{transform:translateX(-50%) scale(1.3);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.bw2{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-size:clamp(1.3rem,4.5vw,2.5rem);font-weight:900;color:var(--accent);opacity:0;pointer-events:none;z-index:16;text-shadow:0 0 35px rgba(230,57,70,0.7)}
.bw2.on{animation:bb 2s ease forwards}
@keyframes bb{0%{opacity:0;transform:translate(-50%,-50%) scale(2.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
.ci{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--mut);text-align:center;pointer-events:none;display:none;z-index:15}
.ci.on{display:block}
@media(max-width:600px){.bw{width:120px}.bw.e{width:160px}.bw.s{width:95px}.br{height:10px}.br.s{height:6px}.pn{padding:12px}}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div class="ui" id="ui">
  <div class="scr on" id="sM"><div class="ttl">STICKMAN WARRIORS</div><div class="sub">Battle of Legends</div><button class="btn" onclick="nav('sMd')"><i class="fas fa-gamepad"></i> Mulai Bermain</button><button class="btn g" onclick="nav('sSh')"><i class="fas fa-store"></i> Toko</button><button class="btn b" onclick="nav('sUp')"><i class="fas fa-arrow-up"></i> Upgrade</button></div>
  <div class="scr" id="sMd"><div class="pt">Pilih Mode</div><button class="btn" onclick="nav('sLv')"><i class="fas fa-book"></i> Story Mode</button><button class="btn gr" onclick="goSurv()"><i class="fas fa-skull"></i> Survival Mode</button><button class="btn sm" onclick="nav('sM')"><i class="fas fa-arrow-left"></i> Kembali</button></div>
  <div class="scr" id="sLv"><div class="pn"><div class="pt">Story Mode</div><div class="lg" id="lG"></div></div><button class="btn sm" onclick="nav('sMd')" style="margin-top:10px"><i class="fas fa-arrow-left"></i> Kembali</button></div>
  <div class="scr" id="sSh"><div class="pn"><div class="pt"><i class="fas fa-store"></i> Toko</div><div class="ch" style="margin-bottom:8px"><i class="fas fa-coins"></i><span id="sC">0</span></div><div style="font-weight:700;margin:8px 0 5px;font-size:.82rem;color:var(--accent)">Senjata</div><div class="grd" id="wS"></div><div style="font-weight:700;margin:12px 0 5px;font-size:.82rem;color:var(--purple)">Skin</div><div class="grd" id="kS"></div></div><button class="btn sm" onclick="nav('sM')" style="margin-top:10px"><i class="fas fa-arrow-left"></i> Kembali</button></div>
  <div class="scr" id="sUp"><div class="pn"><div class="pt"><i class="fas fa-arrow-up"></i> Upgrade</div><div class="ch" style="margin-bottom:12px"><i class="fas fa-coins"></i><span id="uC">0</span></div><div id="uL"></div></div><button class="btn sm" onclick="nav('sM')" style="margin-top:10px"><i class="fas fa-arrow-left"></i> Kembali</button></div>
  <div class="scr" id="sSk"><div class="pn"><div class="pt">Pilih Skill</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin:8px 0" id="sS"></div><div style="font-size:.75rem;color:var(--mut);margin-bottom:12px" id="sD"></div><button class="btn" onclick="goBattle()"><i class="fas fa-bolt"></i> Mulai Pertarungan</button></div></div>
  <div class="hud" id="hud"><div class="hl"><div class="bl"><span>HP</span><span id="hpT">100/100</span></div><div class="bw"><div class="br"><div class="bf hpf" id="hpB" style="width:100%"></div></div></div><div class="bl"><span>Energy</span><span id="enT">100/100</span></div><div class="bw s"><div class="br s"><div class="bf enf" id="enB" style="width:100%"></div></div></div><div class="ch"><i class="fas fa-coins"></i><span id="bC">0</span></div></div><div class="hr"><div class="bl"><span id="eN">Musuh</span><span id="eHT">100/100</span></div><div class="bw e"><div class="br"><div class="bf ehf" id="eHB" style="width:100%"></div></div></div><div id="wL" style="font-family:'Orbitron',monospace;font-size:.72rem;color:var(--accent);display:none"></div></div></div>
  <div class="cp" id="cP"></div>
  <div class="wi" id="wI"></div>
  <div class="bw2" id="bW">WARNING - BOSS</div>
  <div class="mc" id="mC"><div class="dp"><div class="db e"></div><div class="db" id="tU"><i class="fas fa-chevron-up"></i></div><div class="db e"></div><div class="db" id="tL"><i class="fas fa-chevron-left"></i></div><div class="db e"></div><div class="db" id="tR"><i class="fas fa-chevron-right"></i></div></div><div class="ab"><div class="a1 t" id="tA">ATK</div><div class="a1 sk" id="tS">SKILL</div><div class="a1 jm" id="tJ">JUMP</div><div class="a1 da" id="tD">DASH</div></div></div>
  <div class="ci" id="cI">A/D: Gerak | W/Space: Lompat | J: Serang | K: Berat | L: Skill | Shift: Dash</div>
  <div class="ro" id="rO"><div class="rt" id="rT">MENANG!</div><div class="rs" id="rS"></div><div id="rR" style="font-size:.9rem;color:var(--gold)"></div><button class="btn" id="rB" onclick="doRes()">Lanjut</button><button class="btn sm" onclick="toMenu()" style="margin-top:3px">Menu Utama</button></div>
  <div class="tst" id="tst"></div>
</div>
<script>
// ===== SETUP CANVAS =====
var C = document.getElementById("gc");
var X = C.getContext("2d");
var PI = Math.PI;
var TAU = PI * 2;
var GRAV = 1700;
var W, H, GY;
var isMob = "ontouchstart" in window || navigator.maxTouchPoints > 0;

function resize() {
  W = C.width = innerWidth;
  H = C.height = innerHeight;
  GY = H - 110;
}
resize();
addEventListener("resize", resize);

// ===== UTILITAS =====
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndI(a, b) { return Math.floor(rnd(a, b + 1)); }
function easeO(t) { return 1 - (1 - t) * (1 - t); }
function rOv(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// ===== AUDIO =====
var AC = null;
function eA() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === "suspended") AC.resume();
}
function snd(f, d, tp, v, fe) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = tp || "square"; o.connect(g); g.connect(AC.destination);
    o.frequency.setValueAtTime(f, AC.currentTime);
    if (fe) o.frequency.exponentialRampToValueAtTime(Math.max(20, fe), AC.currentTime + d);
    g.gain.setValueAtTime(v || 0.1, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + d);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function sHit() { snd(300, 0.08, "square", 0.08, 80); snd(800, 0.05, "sawtooth", 0.04, 200); }
function sHvy() { snd(150, 0.15, "square", 0.12, 40); snd(400, 0.1, "sawtooth", 0.06, 100); }
function sSl() { snd(1200, 0.06, "sawtooth", 0.04, 600); }
function sJmp() { snd(400, 0.1, "sine", 0.06, 800); }
function sDsh() { snd(600, 0.12, "sine", 0.04, 1200); }
function sSk() { snd(500, 0.3, "sine", 0.08, 1500); snd(300, 0.3, "square", 0.04, 100); }
function sCr() { snd(600, 0.12, "square", 0.1, 200); snd(1500, 0.08, "sine", 0.07, 3000); }
function sKl() { snd(800, 0.15, "sine", 0.06, 200); snd(200, 0.2, "square", 0.04, 50); }
function sWn() { snd(523, 0.15, "sine", 0.08); setTimeout(function(){snd(659,0.15,"sine",0.08)},150); setTimeout(function(){snd(784,0.3,"sine",0.1)},300); }
function sLs() { snd(400, 0.2, "sine", 0.06, 200); setTimeout(function(){snd(300,0.3,"sine",0.06,100)},200); }
function sCn() { snd(1200, 0.08, "sine", 0.04, 1800); }
function sBk() { snd(200, 0.08, "triangle", 0.06, 100); }
function sBw() { snd(100, 0.5, "sawtooth", 0.1, 50); snd(150, 0.5, "square", 0.05, 75); }

// ===== DATA SENJATA =====
var WP = {
  sword: { nm: "Pedang", dm: 12, sp: 1, rn: 55, kb: 8, c: "#ccc", tc: "rgba(200,200,200,0.4)", pr: 0, ds: "Seimbang" },
  katana: { nm: "Katana", dm: 16, sp: 1.3, rn: 60, kb: 10, c: "#ff4444", tc: "rgba(255,68,68,0.5)", pr: 500, ds: "Cepat & mematikan" },
  spear: { nm: "Tombak", dm: 14, sp: 0.7, rn: 85, kb: 14, c: "#66ccff", tc: "rgba(102,204,255,0.4)", pr: 400, ds: "Jangkauan jauh" },
  hammer: { nm: "Palu", dm: 24, sp: 0.5, rn: 50, kb: 22, c: "#ffaa00", tc: "rgba(255,170,0,0.5)", pr: 600, ds: "Kerusakan besar" },
  bow: { nm: "Busur", dm: 10, sp: 0.8, rn: 200, kb: 5, c: "#66ff66", tc: "rgba(102,255,102,0.4)", pr: 350, ds: "Jarak jauh", rng: 1 },
  shuriken: { nm: "Shuriken", dm: 8, sp: 1.5, rn: 180, kb: 3, c: "#cc66ff", tc: "rgba(204,102,255,0.4)", pr: 450, ds: "Lemparan cepat", rng: 1 }
};

// ===== DATA SKILL =====
var SK = {
  fireSlash: { nm: "Fire Slash", ds: "Tebasan api besar", cost: 35, dm: 30, c: "#ff4400", cd: 4 },
  thunderStrike: { nm: "Thunder Strike", ds: "Sambaran petir", cost: 40, dm: 35, c: "#ffff00", cd: 5 },
  shadowDash: { nm: "Shadow Dash", ds: "Bergerak cepat menembus", cost: 25, dm: 20, c: "#9b5de5", cd: 3 },
  energyBlast: { nm: "Energy Blast", ds: "Bola energi jarak jauh", cost: 30, dm: 28, c: "#4cc9f0", cd: 4 }
};

// ===== DATA SKIN =====
var SN = {
  default: { nm: "Default", c: "#ffffff", g: null, hc: "#ffffff", pr: 0 },
  ninja: { nm: "Ninja", c: "#333333", g: "#ff0000", hc: "#222222", pr: 300 },
  samurai: { nm: "Samurai", c: "#4488ff", g: "#4488ff", hc: "#3366cc", pr: 400 },
  cyber: { nm: "Cyber", c: "#00ffaa", g: "#00ffaa", hc: "#00cc88", pr: 500 },
  shadow: { nm: "Shadow", c: "#9b5de5", g: "#9b5de5", hc: "#7733cc", pr: 600 },
  dragon: { nm: "Dragon", c: "#ff6600", g: "#ff4400", hc: "#cc4400", pr: 800 }
};

// ===== DATA UPGRADE =====
var UP = {
  hp: { nm: "HP Maks", st: "maxHp", bs: 100, pr: 15, pb: 100, pm: 1.5, ic: "fa-heart", cl: "#e63946" },
  atk: { nm: "Serangan", st: "atkB", bs: 0, pr: 3, pb: 120, pm: 1.5, ic: "fa-fist-raised", cl: "#ff6b6b" },
  def: { nm: "Pertahanan", st: "defB", bs: 0, pr: 2, pb: 100, pm: 1.5, ic: "fa-shield-alt", cl: "#4cc9f0" },
  spd: { nm: "Kecepatan", st: "spdB", bs: 0, pr: 15, pb: 80, pm: 1.4, ic: "fa-bolt", cl: "#ffd700" },
  crit: { nm: "Kritikal", st: "critB", bs: 5, pr: 3, pb: 150, pm: 1.6, ic: "fa-crosshairs", cl: "#9b5de5" }
};

// ===== SAVE SYSTEM =====
var sv = { coins: 200, ulLv: 1, doneLv: [], upg: { hp: 0, atk: 0, def: 0, spd: 0, crit: 0 }, wps: ["sword"], curWp: "sword", skins: ["default"], curSkin: "default", survHi: 0, curSk: "fireSlash", ownSk: ["fireSlash", "thunderStrike"] };
function loadSv() { try { var d = JSON.parse(localStorage.getItem("sw3")); if (d) { for (var k in d) sv[k] = d[k]; } } catch (e) {} if (!sv.ownSk) sv.ownSk = ["fireSlash", "thunderStrike"]; if (!sv.curSk) sv.curSk = "fireSlash"; }
function saveSv() { try { localStorage.setItem("sw3", JSON.stringify(sv)); } catch (e) {} }
loadSv();

// ===== TOAST =====
var tTm = 0;
function toast(m) { var t = document.getElementById("tst"); t.textContent = m; t.classList.add("on"); clearTimeout(tTm); tTm = setTimeout(function () { t.classList.remove("on"); }, 1700); }

// ===== NAVIGASI =====
var gAct = false;
function nav(id) {
  eA();
  var all = document.querySelectorAll(".scr");
  for (var i = 0; i < all.length; i++) all[i].classList.remove("on");
  document.getElementById("hud").classList.remove("on");
  document.getElementById("mC").classList.remove("on");

      resActFn = function () { goSurv(); };
    }
  } else {
    rt.textContent = "KALAH!"; rt.style.color = "var(--accent)"; sLs();
    rs.innerHTML = "<div>Kills: <span>" + bKills + "</span></div><div>Max Combo: <span>" + bMaxC + "</span></div>"; rr.innerHTML = ""; rb.textContent = "Coba Lagi";
    resActFn = function () { if (gMode === "story") nav("sSk"); else goSurv(); };
  }
  document.getElementById("rO").classList.add("on");
}
function doRes() { if (resActFn) resActFn(); }

// ===== UPDATE HUD =====
function updHUD() {
  if (!player) return;
  document.getElementById("hpB").style.width = clamp(player.hp / player.mhp * 100, 0, 100) + "%";
  document.getElementById("hpT").textContent = Math.round(player.hp) + "/" + player.mhp;
  document.getElementById("enB").style.width = clamp(player.en / player.men * 100, 0, 100) + "%";
  document.getElementById("enT").textContent = Math.round(player.en) + "/" + player.men;
  document.getElementById("bC").textContent = sv.coins;
  var tg = null; for (var i = 0; i < enemies.length; i++) { if (enemies[i].alive) { tg = enemies[i]; break; } }
  if (tg) { document.getElementById("eHB").style.width = clamp(tg.hp / tg.mhp * 100, 0, 100) + "%"; document.getElementById("eHT").textContent = Math.round(tg.hp) + "/" + tg.mhp; document.getElementById("eN").textContent = tg.isB ? "Boss Lv." + pendLv : tg.tp.charAt(0).toUpperCase() + tg.tp.slice(1); }
  var cd = document.getElementById("cP"); if (player.combo >= 2) { cd.textContent = player.combo + "x COMBO"; cd.classList.add("on"); } else cd.classList.remove("on");
}

// ===== GAMBAR BACKGROUND =====
function drawBG(cx) {
  var g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#08081a"); g.addColorStop(0.5, "#101028"); g.addColorStop(1, "#181830"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  var t = performance.now() * 0.001;
  for (var i = 0; i < bgStars.length; i++) { var s = bgStars[i], sx = ((s.x - camX * 0.05) % 2000 + 2000) % 2000 * W / 2000; if (sx < -3 || sx > W + 3) continue; cx.globalAlpha = s.b * (0.5 + 0.5 * Math.sin(t * 2 + s.x)); cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(sx, s.y, s.s, 0, TAU); cx.fill(); } cx.globalAlpha = 1;
  cx.fillStyle = "#0c0c1e"; for (var j = 0; j < 6; j++) { var mx = ((j * 340 - camX * 0.1) % 2040 + 2040) % 2040 - W * 0.1, mh = 110 + Math.sin(j * 2.3) * 35; cx.beginPath(); cx.moveTo(mx - 190, GY); cx.lineTo(mx, GY - mh); cx.lineTo(mx + 190, GY); cx.fill(); }
  cx.fillStyle = "#0f0f26"; for (var k = 0; k < 8; k++) { var mx2 = ((k * 240 - camX * 0.22) % 1920 + 1920) % 1920 - W * 0.1, mh2 = 55 + Math.sin(k * 1.7) * 22; cx.beginPath(); cx.moveTo(mx2 - 140, GY); cx.lineTo(mx2, GY - mh2); cx.lineTo(mx2 + 140, GY); cx.fill(); }
  var gg = cx.createLinearGradient(0, GY, 0, H); gg.addColorStop(0, "#181830"); gg.addColorStop(1, "#0e0e1a"); cx.fillStyle = gg; cx.fillRect(0, GY, W, H - GY);
  cx.strokeStyle = "rgba(230,57,70,0.22)"; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(0, GY); cx.lineTo(W, GY); cx.stroke();
  cx.strokeStyle = "rgba(255,255,255,0.02)"; cx.lineWidth = 1; for (var gx = -camX % 55; gx < W; gx += 55) { cx.beginPath(); cx.moveTo(gx, GY); cx.lineTo(gx, H); cx.stroke(); }
}

// ===== COMBAT =====
function resolveC() {
  if (!player || !player.alive) return;
  var phb = player.atkHB();
  if (phb) {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i]; if (!e.alive || e.inv > 0) continue;
      var sc = e.sc2 || 1, eb = { x: e.x - 15 * sc, y: e.y - 70 * sc, w: 30 * sc, h: 70 * sc };
      if (rOv(phb, eb)) {
        var w = WP[player.wk], ih = player.st === "hatk", dm = w.dm * (ih ? 2 : 1) + player.atkB;
        var cr = Math.random() * 100 < player.critB; if (cr) dm *= 2;
        dm = Math.max(1, dm - (e.def || 0) * 0.5);
        e.takeDmg(dm, player.f, w.kb * (ih ? 1.5 : 1)); player.hd = true;
        spDm(e.x, e.y - 70 * sc, dm, cr); spSl(e.x, e.y - 30, player.f, w.rn * 0.6, w.tc);
        if (cr) { sCr(); addSl(0.25, 0.15); hsT = Math.max(hsT, 0.05); } else sHit();
        if (ih) { sHvy(); addSh(6, 0.2); hsT = Math.max(hsT, 0.04); } else addSh(3, 0.1);
        player.combo++; player.comboT = 1.5; if (player.combo > bMaxC) bMaxC = player.combo;
        if (!e.alive) { sKl(); bKills++; spP(e.x, e.y - 30, 18, e.clr, 220, 0.5, 4); var cd = gMode === "story" ? (e.isB ? 100 : 15 + pendLv * 3) : 10 + survWv * 2; bCoins += cd; sv.coins += cd; saveSv(); sCn(); spDm(e.x, e.y - 85, "+" + cd, false); }
      }
    }
  }
  for (var j = 0; j < enemies.length; j++) {
    var e2 = enemies[j]; if (!e2.alive) continue;
    var ehb = e2.atkHB(); if (!ehb) continue;
    var pb = { x: player.x - 15, y: player.y - 70, w: 30, h: 70 };
    if (rOv(ehb, pb)) {
      var dm2 = e2.atk;
      if (player.blk) { dm2 *= 0.2; sBk(); spP(player.x + player.f * 15, player.y - 30, 4, "#4cc9f0", 90, 0.2, 2); }
      else { dm2 = Math.max(1, dm2 - player.defB * 0.5); player.st = "hit"; player.stT = 0; sHit(); addSh(4, 0.15); spP(player.x, player.y - 30, 7, "#ff4444", 130, 0.25, 3); }
      var ac = player.takeDmg(dm2, e2.f, 8); e2.hd = true; spDm(player.x, player.y - 70, ac, false);
      if (!player.alive) showRes(false);
    }
  }
  for (var m = 0; m < projs.length; m++) {
    var p = projs[m]; if (p.dead) continue;
    if (p.ow === "player") {
      for (var n = 0; n < enemies.length; n++) {
        var e3 = enemies[n]; if (!e3.alive) continue;
        var sc2 = e3.sc2 || 1;
        if (Math.hypot(p.x - e3.x, p.y - (e3.y - 30 * sc2)) < 24 * sc2) {
          var dm3 = p.dm, cr2 = Math.random() * 100 < player.critB; if (cr2) dm3 *= 2;
          dm3 = Math.max(1, dm3 - (e3.def || 0) * 0.5);
          e3.takeDmg(dm3, p.vx > 0 ? 1 : -1, 6); p.dead = true;
          spDm(e3.x, e3.y - 70 * sc2, dm3, cr2); spP(p.x, p.y, 7, p.c, 130, 0.25, 3);
          if (cr2) { sCr(); addSl(0.25, 0.12); } else sHit(); addSh(3, 0.1);
          player.combo++; player.comboT = 1.5; if (player.combo > bMaxC) bMaxC = player.combo;
          if (!e3.alive) { sKl(); bKills++; spP(e3.x, e3.y - 30, 18, e3.clr, 220, 0.5, 4); var cd2 = gMode === "story" ? (e3.isB ? 100 : 15 + pendLv * 3) : 10 + survWv * 2; bCoins += cd2; sv.coins += cd2; saveSv(); sCn(); }
          break;
        }
      }
    }
    if (p.ow === "enemy" && player.alive && !p.dead) {
      if (Math.hypot(p.x - player.x, p.y - (player.y - 30)) < 24) {
        var dm4 = p.dm;
        if (player.blk) { dm4 *= 0.2; sBk(); } else { dm4 = Math.max(1, dm4 - player.defB * 0.5); sHit(); addSh(3, 0.1); player.st = "hit"; player.stT = 0; }
        player.takeDmg(dm4, p.vx > 0 ? 1 : -1, 5); p.dead = true; spDm(player.x, player.y - 70, dm4, false);
        if (!player.alive) showRes(false);
      }
    }
  }
}

// ===== GAME LOOP =====
var lt = 0;
function loop(t) {
  requestAnimationFrame(loop);
  var dt = Math.min((t - lt) / 1000, 0.05); lt = t;
  X.clearRect(0, 0, W, H); drawBG(X);
  if (!gAct) return;

  // Slow motion & hit stop
  var gdt = dt;
  if (hsT > 0) { hsT -= dt; gdt = 0; if (hsT < 0) hsT = 0; }
  else if (slMo > 0) { slMo -= dt; gdt = dt * slF; if (slMo < 0) slMo = 0; }

  if (gdt > 0) {
    // Spawn queue
    spawnTimer += gdt;
    while (spawnQueue.length > 0 && spawnTimer >= spawnQueue[0].dl) { var sq = spawnQueue.shift(); enemies.push(new Enemy(sq.x, sq.y, sq.tp, sq.lv)); }

    player.update(gdt, inp);
    for (var i = 0; i < enemies.length; i++) enemies[i].update(gdt, player);
    for (var j = parts.length - 1; j >= 0; j--) { parts[j].update(gdt); if (parts[j].dead) parts.splice(j, 1); }
    for (var k = projs.length - 1; k >= 0; k--) { projs[k].update(gdt); if (projs[k].dead) projs.splice(k, 1); }
    for (var m = dmgNs.length - 1; m >= 0; m--) { dmgNs[m].l -= gdt; dmgNs[m].vy += 300 * gdt; dmgNs[m].y += dmgNs[m].vy * gdt; if (dmgNs[m].l <= 0) dmgNs.splice(m, 1); }
    resolveC();

    // Cek menang
    if (gAct) {
      if (gMode === "story" && spawnQueue.length === 0 && enemies.length > 0) {
        var allDead = true; for (var n = 0; n < enemies.length; n++) { if (enemies[n].alive) { allDead = false; break; } }
        if (allDead) { checkWinTimer += gdt; if (checkWinTimer > 0.6) { checkWinTimer = 0; showRes(true); } } else { checkWinTimer = 0; }
      }
      if (gMode === "survival" && enemies.length > 0) {
        var allDead2 = true; for (var p = 0; p < enemies.length; p++) { if (enemies[p].alive) { allDead2 = false; break; } }
        if (allDead2) { checkWinTimer += gdt; if (checkWinTimer > 0.8) { checkWinTimer = 0; nextWv(); } } else { checkWinTimer = 0; }
      }
    }
  }

  // Kamera
  if (player) { var target = player.x - W * 0.35; camX += (target - camX) * 0.08; camX = clamp(camX, 0, Math.max(0, lvlW - W)); }
  // Shake
  if (shD > 0) { shD -= dt; shX = (Math.random() - 0.5) * shI * 2; shY = (Math.random() - 0.5) * shI * 2; shI *= Math.pow(0.01, dt); } else { shX = 0; shY = 0; }

  // DRAW
  X.save(); X.translate(shX, shY);
  for (var a = 0; a < parts.length; a++) { if (parts[a].tp !== "sp") parts[a].draw(X, camX); }
  for (var b = 0; b < enemies.length; b++) enemies[b].draw(X, camX);
  if (player) player.draw(X, camX);
  for (var c = 0; c < projs.length; c++) projs[c].draw(X, camX);
  for (var d = 0; d < parts.length; d++) { if (parts[d].tp === "sp") parts[d].draw(X, camX); }
  for (var e = 0; e < dmgNs.length; e++) { var dn = dmgNs[e], da = clamp(dn.l / dn.ml, 0, 1); X.globalAlpha = da; X.font = dn.sz + "px 'Orbitron',monospace"; X.fillStyle = dn.c; X.textAlign = "center"; X.fillText(dn.t, dn.x - camX, dn.y); X.globalAlpha = 1; }
  X.restore();

  if (slMo > 0) { X.fillStyle = "rgba(230,57,70,0.05)"; X.fillRect(0, 0, W, H); }
  updHUD();
}
requestAnimationFrame(loop);
</script>
